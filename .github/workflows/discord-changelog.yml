name: Discord Changelog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: discord-changelog
  cancel-in-progress: false

jobs:
  publish_changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publishing dependencies
        run: python -m pip install requests PyYAML

      - name: Publish changelog
        run: python Tools/actions_changelogs_since_last_run.py
        env:
          CHANGELOG_DIR: Resources/Changelog/Changelog.yml
          CHANGELOG_WEBHOOK: ${{ secrets.CHANGELOG_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
