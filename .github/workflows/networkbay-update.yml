name: NetworkBay Update

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Choose check, verify, build, stage, or deploy (deploy waits for the round to finish)
        type: choice
        required: true
        default: check
        options:
          - check
          - verify
          - build
          - stage
          - deploy

permissions:
  contents: read

concurrency:
  group: networkbay-manual
  cancel-in-progress: false

jobs:
  build:
    if: inputs.mode == 'build' || ((inputs.mode == 'stage' || inputs.mode == 'deploy') && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out code and engine
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Linux server with bundled client
        run: dotnet run --project Content.Packaging server --platform linux-x64 --hybrid-acz

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('release/SS14.Server_linux-x64.zip') as package:
              names = set(package.namelist())
              for required in ('Robust.Server', 'Content.Client.zip'):
                  if required not in names:
                      raise SystemExit(f'Missing required file: {required}')
              for required in (
                  'Resources/Prototypes/_ReclamationProject/Maps/Wendover.yml',
                  'Resources/Maps/Reclamation/Wendover-edit.yml',
                  'Resources/Maps/Reclamation/Wendover-sky-edit.yml',
                  'Resources/Maps/Reclamation/Wendover-vault-edit.yml',
                  'Resources/Maps/Reclamation/Wendover-enclave-edit.yml',
              ):
                  if required not in names:
                      raise SystemExit(f'Missing edited Wendover file: {required}; refusing deployment.')
              print('Verified server, bundled client, and all edited Wendover map files.')
          PY

      - name: Save server package
        uses: actions/upload-artifact@v4
        with:
          name: networkbay-linux-server-${{ github.sha }}
          path: release/SS14.Server_linux-x64.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0


  connection-check:
    if: inputs.mode == 'check'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read NETWORKBAY server status
        env:
          NETWORKBAY_API_KEY: ${{ secrets.NETWORKBAY_API_KEY }}
          NETWORKBAY_PANEL_URL: ${{ vars.NETWORKBAY_PANEL_URL }}
          NETWORKBAY_SERVER_ID: ${{ vars.NETWORKBAY_SERVER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          import urllib.request, urllib.error
          panel = os.environ['NETWORKBAY_PANEL_URL'].rstrip('/')
          server = os.environ['NETWORKBAY_SERVER_ID']
          token = os.environ['NETWORKBAY_API_KEY']
          if panel != 'https://panel.naidru.ca' or server != '3f6a75df':
              sys.exit('NETWORKBAY panel or server variable does not match the intended server.')
          if not token:
              sys.exit('NETWORKBAY_API_KEY is missing.')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          request = urllib.request.Request(
              f'{panel}/api/client/servers/{server}/resources',
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.wisp.v1+json',
                       'Content-Type': 'application/json', 'User-Agent': 'Reclamation-GitHub-Updater/1.0'})
          try:
              opener = urllib.request.build_opener(NoRedirect())
              with opener.open(request, timeout=30) as response:
                  result = json.load(response)
                  state = result.get('status') or result.get('attributes', {}).get('current_state')
              if state not in ('running', 'offline', 'starting', 'stopping'):
                  sys.exit('NETWORKBAY returned an unexpected server state.')
              print(f'NETWORKBAY API connection successful. Server state: {state}')

          except urllib.error.HTTPError as error:
              print('Response type:', error.headers.get('Content-Type', 'unknown'))
              print('Response server:', error.headers.get('Server', 'unknown'))
              try:
                  failure = json.load(error)
                  print('Error classes:', [item.get('code', '') for item in failure.get('errors', []) if isinstance(item, dict)])
              except (ValueError, AttributeError):
                  pass
              sys.exit(f'NETWORKBAY API check failed: HTTP {error.code}. Response body withheld.')
          except (urllib.error.URLError, TimeoutError, ValueError, KeyError):
              sys.exit('NETWORKBAY API check failed: network or unexpected response. Details withheld.')
          PY

      - name: Discover SFTP host key for independent verification
        if: always()
        env:
          NETWORKBAY_SFTP_HOST: ${{ vars.NETWORKBAY_SFTP_HOST }}
          NETWORKBAY_SFTP_PORT: ${{ vars.NETWORKBAY_SFTP_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$NETWORKBAY_SFTP_HOST" = '800cc0300b7bc2e4.daemon.panel.gg'
          test "$NETWORKBAY_SFTP_PORT" = '2022'
          ssh-keyscan -T 15 -p "$NETWORKBAY_SFTP_PORT" -t ed25519 "$NETWORKBAY_SFTP_HOST" > "$RUNNER_TEMP/networkbay-host-keys" 2>/dev/null
          test -s "$RUNNER_TEMP/networkbay-host-keys"
          echo 'SFTP endpoint responded. Comparing with the initial connection fingerprint before login:'
          ssh-keygen -lf "$RUNNER_TEMP/networkbay-host-keys" -E sha256
          echo 'This discovery step does not authenticate or modify the server.'

      - name: Test SFTP key login without modifying files
        env:
          NETWORKBAY_SSH_KEY: ${{ secrets.NETWORKBAY_SSH_KEY }}
          NETWORKBAY_SFTP_FINGERPRINT: ${{ vars.NETWORKBAY_SFTP_FINGERPRINT }}
          NETWORKBAY_SFTP_HOST: ${{ vars.NETWORKBAY_SFTP_HOST }}
          NETWORKBAY_SFTP_PORT: ${{ vars.NETWORKBAY_SFTP_PORT }}
          NETWORKBAY_SFTP_USERNAME: ${{ vars.NETWORKBAY_SFTP_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          test "$NETWORKBAY_SFTP_HOST" = '800cc0300b7bc2e4.daemon.panel.gg'
          test "$NETWORKBAY_SFTP_PORT" = '2022'
          test "$NETWORKBAY_SFTP_USERNAME" = 'nibanath22@gmail.com.3f6a75df'
          # Trust baseline: independently verified NetworkBay host fingerprint.
          expected="$NETWORKBAY_SFTP_FINGERPRINT"
          test -n "$expected"
          actual=$(ssh-keygen -lf "$RUNNER_TEMP/networkbay-host-keys" -E sha256 | awk '{print $2}')
          if [ "$actual" != "$expected" ]; then
            echo 'SFTP host key does not match the pinned fingerprint; refusing login.'
            exit 1
          fi
          test -n "$NETWORKBAY_SSH_KEY"
          umask 077
          keyfile="$RUNNER_TEMP/networkbay-private-key"
          batchfile="$RUNNER_TEMP/networkbay-readonly-batch"
          trap 'rm -f "$keyfile" "$batchfile"' EXIT
          printf '%s\n' "$NETWORKBAY_SSH_KEY" | tr -d '\r' > "$keyfile"
          unset NETWORKBAY_SSH_KEY
          ssh-keygen -y -P '' -f "$keyfile" > /dev/null
          printf '%s\n' 'ls /Robust.Server' 'ls /server_config.toml' 'cd /data' 'cd /logs' > "$batchfile"
          sftp -q -b "$batchfile" -i "$keyfile" -P "$NETWORKBAY_SFTP_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
            -o UserKnownHostsFile="$RUNNER_TEMP/networkbay-host-keys" \
            -o GlobalKnownHostsFile=/dev/null \
            "$NETWORKBAY_SFTP_USERNAME@$NETWORKBAY_SFTP_HOST"
          echo 'SFTP key login successful; expected server files and folders exist.'
          echo 'No files were modified and no server power actions were performed.'

      - name: Save public host keys for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: networkbay-unverified-public-host-keys
          path: ${{ runner.temp }}/networkbay-host-keys
          if-no-files-found: error
          retention-days: 7

  stage:
    if: always() && github.ref == 'refs/heads/main' && ((inputs.mode == 'verify' && needs.build.result == 'skipped') || ((inputs.mode == 'stage' || inputs.mode == 'deploy') && needs.build.result == 'success'))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Download this run's verified server package
        if: inputs.mode != 'verify'
        uses: actions/download-artifact@v4
        with:
          name: networkbay-linux-server-${{ github.sha }}
          path: package

      - name: Stage package and deploy when selected
        env:
          NETWORKBAY_MODE: ${{ inputs.mode }}
          NETWORKBAY_API_KEY: ${{ secrets.NETWORKBAY_API_KEY }}
          NETWORKBAY_SSH_KEY: ${{ secrets.NETWORKBAY_SSH_KEY }}
          NETWORKBAY_SFTP_FINGERPRINT: ${{ vars.NETWORKBAY_SFTP_FINGERPRINT }}
          NETWORKBAY_PANEL_URL: ${{ vars.NETWORKBAY_PANEL_URL }}
          NETWORKBAY_SERVER_ID: ${{ vars.NETWORKBAY_SERVER_ID }}
          NETWORKBAY_SFTP_HOST: ${{ vars.NETWORKBAY_SFTP_HOST }}
          NETWORKBAY_SFTP_PORT: ${{ vars.NETWORKBAY_SFTP_PORT }}
          NETWORKBAY_SFTP_USERNAME: ${{ vars.NETWORKBAY_SFTP_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Stage safely; deploy mode promotes only after a confirmed round boundary."""
          import base64
          import hashlib
          import json
          import os
          import secrets
          from pathlib import Path, PurePosixPath
          import shutil
          import stat
          import subprocess
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          
          
          class StageError(Exception):
              pass
          
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          
          def prepare(source, destination):
              expected = {}
              seen = set()
              with zipfile.ZipFile(source) as original, zipfile.ZipFile(
                  destination, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=1
              ) as output:
                  for entry in original.infolist():
                      name = entry.filename
                      parts = PurePosixPath(name).parts
                      if not parts or name.startswith('/') or '\\' in name or '..' in parts:
                          raise StageError('Package contains an unsafe path.')
                      if ':' in name or any(ord(character) < 32 for character in name):
                          raise StageError('Package contains an unsupported path.')
                      if stat.S_ISLNK(entry.external_attr >> 16):
                          raise StageError('Package contains a symbolic link.')
                      top = parts[0].lower()
                      if top in ('data', 'logs', 'server_config.toml') or top.startswith('.'):
                          continue
                      if len(parts) == 1 and top.endswith(('.toml', '.db', '.sqlite', '.sqlite3')):
                          continue
                      if name in seen:
                          raise StageError('Package contains duplicate entries.')
                      seen.add(name)
                      if entry.is_dir():
                          output.writestr(entry, b'')
                          continue
                      # Reading each entry to its end also verifies its original ZIP CRC.
                      with original.open(entry) as incoming, output.open(name, 'w', force_zip64=True) as outgoing:
                          shutil.copyfileobj(incoming, outgoing, length=1024 * 1024)
                      expected[name] = entry.file_size
              if not all(name in expected for name in ('Robust.Server', 'Content.Client.zip')):
                  raise StageError('Package is missing the server or bundled client.')
              if not any(name.startswith('Resources/') for name in expected):
                  raise StageError('Package is missing game resources.')
              return expected
          
          
          def wait_for_round_end(api, listing, state, wait_limit=18000):
              """Never infer a safe round boundary from power state alone."""
              ticket = secrets.token_hex(16)
              deadline = time.monotonic() + wait_limit
              acknowledgement_deadline = time.monotonic() + 60
              acknowledged = False
              stop_requested = False
              shutdown_deadline = None
              def read_receipt():
                  if 'reclamation-update.json' not in listing('/data'):
                      return None
                  return api('/files/contents?' + urllib.parse.urlencode({
                      'file': '/data/reclamation-update.json'
                  }))
              try:
                  api('/command', 'POST', {'command': f'reclamation_update_queue_once {ticket}'})
                  while time.monotonic() < deadline:
                      receipt = read_receipt()
                      power_state = state()
                      # The server may have finished between the first file read and the power query.
                      if power_state in ('offline', 'stopping', 'starting'):
                          receipt = read_receipt()
                      if isinstance(receipt, dict) and receipt.get('ticket') == ticket:
                          status = receipt.get('state')
                          if status == 'cancelled':
                              raise StageError('Round-end deployment was cancelled; live files are unchanged.')
                          if status == 'ready':
                              # Receipt is issued by the game at a safe boundary, before it shuts down.
                              if power_state not in ('running', 'stopping', 'starting', 'offline'):
                                  raise StageError('Unexpected server state after the round-end receipt.')
                              if not stop_requested:
                                  # Tell Pterodactyl this stop is intentional, so it does not restart
                                  # the process while installation is waiting for an offline state.
                                  api('/power', 'POST', {'signal': 'stop'})
                                  stop_requested = True
                                  shutdown_deadline = time.monotonic() + 180
                                  print('Round boundary confirmed. NETWORKBAY stop requested for installation.', flush=True)
                                  power_state = state()
                              if power_state == 'offline':
                                  print('Round boundary confirmed and server is offline.', flush=True)
                                  return
                              if time.monotonic() >= shutdown_deadline:
                                  raise StageError('NETWORKBAY did not stop after the confirmed round boundary; refusing installation.')
                              time.sleep(5)
                              continue
                          if status != 'pending':
                              raise StageError('Unexpected deployment acknowledgement; refusing installation.')
                          acknowledged = True
                      if power_state != 'running':
                          raise StageError('Server stopped without a matching round-end receipt; refusing installation.')
                      now = time.monotonic()
                      if not acknowledged and now >= acknowledgement_deadline:
                          raise StageError('Server did not acknowledge the round-end command. Install the support code once while offline; do not force-stop a live round.')
                      time.sleep(15 if acknowledged else 5)
                  raise StageError('No round boundary reached within five hours; deployment cancelled without stopping the round.')
              except BaseException:
                  # Cancellation clears only our ticket. Abrupt runner termination is covered by the bounded request lifetime.
                  try:
                      if state() == 'running':
                          api('/command', 'POST', {'command': f'reclamation_update_cancel {ticket}'})
                  except Exception:
                      pass
                  raise

          def promote(api, listing, folder, expected, run, attempt):
              names = sorted({PurePosixPath(name).parts[0] for name in expected})
              if any(name.lower() in ('data', 'logs', 'server_config.toml', 'package.zip')
                     or name.startswith('.') or '/' in name for name in names):
                  raise StageError('Unsafe deployment root entries.')
              backup = f'.networkbay-rollback-{run}-{attempt}'
              failed = f'.networkbay-failed-{run}-{attempt}'
              original = listing('/')
              if backup in original or failed in original:
                  raise StageError('Recovery folders already exist; refusing deployment.')
              if any(original.get(name, {}).get('is_symlink') for name in names):
                  raise StageError('A live game path is a symbolic link; refusing deployment.')
          
              def state():
                  return api('/resources', timeout=15)['attributes']['current_state']
          
              def wait_for(target, seconds):
                  deadline = time.monotonic() + seconds
                  while time.monotonic() < deadline:
                      if state() == target:
                          return
                      time.sleep(5)
                  raise StageError(f'Timed out waiting for server state: {target}.')
          
              def power(signal):
                  api('/power', 'POST', {'signal': signal}, timeout=30)
          
              def move(source, destination):
                  api('/files/rename', 'PUT', {
                      'root': '/', 'files': [{'from': source, 'to': destination}]
                  })
          
              initial = state()
              if initial not in ('running', 'offline'):
                  raise StageError('Server is already starting or stopping; retry when stable.')
              if initial == 'running':
                  print('Package is ready. Queueing a player announcement and waiting for the round boundary.', flush=True)
                  wait_for_round_end(api, listing, state)
              # The safe shutdown is confirmed before preparing recovery folders. No deletions are used.
              api('/files/create-folder', 'POST', {'root': '/', 'name': backup})
              api('/files/create-folder', 'POST', {'root': '/', 'name': failed})
              print('Recovery copy folder:', backup, flush=True)
              print('Beginning manual deployment; configuration, data, and logs stay in place.', flush=True)
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary, 'a', encoding='utf-8') as out:
                      out.write(f'\n### Deployment recovery\n\nOld game files: `{backup}`\n\n'
                                f'Staged/new files: `{folder}`\n\nFailed installation files: `{failed}`\n\n'
                                'Do not manually cancel during file installation. If interrupted, '
                                'keep the server offline until the installation or recovery is completed.\n')
              changed = False
              check = "Confirm the server is offline"
              try:
                  wait_for('offline', 180)
                  # The server is stopped: refresh paths to avoid stale live-directory information.
                  check = 'Read live directory after shutdown'
                  original = listing('/')
                  for name in ('server_config.toml', 'data', 'logs'):
                      check = f'Validate protected path {name!r}'
                      if name not in original or original[name].get('is_symlink'):
                          raise StageError('Protected live paths are missing or unsafe.')
                  config = original['server_config.toml']
                  for name in names:
                      check = f'Validate live path {name!r}'
                      if original.get(name, {}).get('is_symlink'):
                          raise StageError('Live game path became a symbolic link.')
                      if name in original:
                          # Mark before sending: a network timeout can follow a successful rename.
                          changed = True
                          check = f'Move old path {name!r} to rollback folder'
                          move(name, backup + '/' + name)
                  for name in names:
                      changed = True
                      check = f'Move staged path {name!r} into place'
                      move(folder + '/' + name, name)
                  check = 'Read installed directory'
                  installed = listing('/')
                  for name, size in expected.items():
                      if '/' in name:
                          continue
                      check = f'Verify installed file size for {name!r}'
                      if name not in installed:
                          raise StageError('Installed file is missing.')
                      actual = installed[name].get('size')
                      if actual != size:
                          observed = actual if type(actual) is int else 'unavailable'
                          raise StageError(f'Expected {size} bytes; observed {observed}.')
                  for field in ('size', 'modified_at'):
                      check = f'Verify server_config.toml {field}'
                      if installed['server_config.toml'].get(field) != config.get(field):
                          raise StageError('Live configuration metadata changed unexpectedly.')
                  check = 'Set and verify Robust.Server executable permissions'
                  api('/files/chmod', 'POST', {
                      'root': '/', 'files': [{'file': 'Robust.Server', 'mode': '755'}]
                  })
                  print('Installation verified. Starting NETWORKBAY.', flush=True)
                  check = 'Request server startup'
                  power('start')
                  check = 'Wait for server to report running'
                  wait_for('running', 180)
                  # Confirm it stays running rather than merely observing the startup transition.
                  check = 'Verify server stays running for 30 seconds'
                  for _ in range(6):
                      time.sleep(5)
                      if state() != 'running':
                          raise StageError('The new server did not stay running after startup.')
                  print('Deployment passed: server stayed running for 30 seconds.', flush=True)
                  if summary:
                      check = 'Write deployment summary'
                      with open(summary, 'a', encoding='utf-8') as out:
                          out.write('\n### NETWORKBAY deployment passed\n\nServer restarted and remained running '
                                    'for 30 seconds. Configuration, data, and logs preserved. '
                                    'An in-game connection is still needed to verify gameplay.\n')
              except Exception as error:
                  detail = str(error) if isinstance(error, StageError) else type(error).__name__
                  print(f'Deployment failed at: {check}. {detail}', flush=True)
                  print('Deployment failed. Attempting recovery of the previous game files.', flush=True)
                  try:
                      if changed:
                          if state() != 'offline':
                              power('stop')
                              wait_for('offline', 180)
                          # Inspect actual locations so an ambiguous rename response is recoverable.
                          saved = listing('/' + backup)
                          live = listing('/')
                          staged = listing('/' + folder)
                          for name in names:
                              is_new = name in saved or (name not in original and name not in staged)
                              if is_new and name in live:
                                  move(name, failed + '/' + name)
                          for name in saved:
                              if name not in names:
                                  raise StageError('Unexpected recovery path; refusing to restore it.')
                              move(backup + '/' + name, name)
                          restored = listing('/')
                          for name in names:
                              if name in original:
                                  if name not in restored or restored[name].get('size') != original[name].get('size'):
                                      raise StageError('Previous files could not be verified after recovery.')
                              elif name in restored:
                                  raise StageError('A new game path remains after recovery.')
                      if initial == 'running':
                          if state() == 'stopping':
                              wait_for('offline', 180)
                          if state() == 'offline':
                              power('start')
                          wait_for('running', 180)
                      print('Previous game files and initial power state restored.', flush=True)
                  except Exception:
                      print('Automatic recovery could not finish. Use the retained recovery folders '
                            'or the NETWORKBAY backup; inspect power state before taking further action.', flush=True)
                      raise StageError('Deployment and automatic recovery failed; operator action required.') from None
                  raise StageError('Deployment failed; the previous installation was restored.') from None
          
          
          def main():
              mode = os.environ.get('NETWORKBAY_MODE', 'stage')
              if mode not in ('verify', 'stage', 'deploy'):
                  raise StageError('Invalid workflow mode.')
              if os.environ.get('GITHUB_REF') != 'refs/heads/main':
                  raise StageError('Staging is restricted to the main branch.')
              panel = os.environ['NETWORKBAY_PANEL_URL'].rstrip('/')
              server = os.environ['NETWORKBAY_SERVER_ID']
              host = os.environ['NETWORKBAY_SFTP_HOST']
              port = os.environ['NETWORKBAY_SFTP_PORT']
              username = os.environ['NETWORKBAY_SFTP_USERNAME']
              if (panel, server, host, port, username) != (
                  'https://panel.naidru.ca', '3f6a75df', '800cc0300b7bc2e4.daemon.panel.gg', '2022',
                  'nibanath22@gmail.com.3f6a75df'
              ):
                  raise StageError('NETWORKBAY variables do not match the intended server.')
              token = os.environ.pop('NETWORKBAY_API_KEY', '')
              private_key = os.environ.pop('NETWORKBAY_SSH_KEY', '')
              if not token or not private_key:
                  raise StageError('An NETWORKBAY secret is missing.')
              base = f'{panel}/api/client/servers/{server}'
              opener = urllib.request.build_opener(NoRedirect())
          
              def request_api(path, method='GET', payload=None, timeout=45):
                  body = json.dumps(payload).encode() if payload is not None else None
                  request = urllib.request.Request(base + path, data=body, method=method, headers={
                      'Authorization': 'Bearer ' + token,
                      'Accept': 'application/vnd.wisp.v1+json', 'Content-Type': 'application/json',
                      'User-Agent': 'Reclamation-GitHub-Updater/1.0'
                  })
                  try:
                      with opener.open(request, timeout=timeout) as response:
                          content = response.read()
                          result = json.loads(content) if content else None
                          if isinstance(result, dict) and result.get('errors'):
                              raise StageError('NetworkBay reported an API operation failure; details withheld.')
                          return result
                  except urllib.error.HTTPError as error:
                      raise StageError(f'NetworkBay API {path.split("?")[0]} failed: HTTP {error.code}.') from None
                  except (urllib.error.URLError, TimeoutError, ValueError):
                      raise StageError('NetworkBay API network or response error; details withheld.') from None

              def server_path(root, name):
                  joined = root.rstrip('/') + '/' + name.lstrip('/')
                  if '..' in PurePosixPath(joined).parts or any(c in joined for c in ('"', '\n', '\r')):
                      raise StageError('Unsafe remote file path.')
                  return joined

              def api(path, method='GET', payload=None, timeout=45):
                  # Preserve the existing promotion/recovery logic while adapting WISP's wire format.
                  if path == '/resources':
                      result = request_api(path, timeout=timeout)
                      state = result.get('status')
                      if state not in ('running', 'offline', 'starting', 'stopping'):
                          raise StageError('Unexpected NetworkBay power state.')
                      process = result.get('process', {})
                      return {'attributes': {'current_state': state, 'resources': {
                          'disk_bytes': process.get('disk', {}).get('used', 0)}}}
                  if path.startswith('/files/contents?'):
                      filename = urllib.parse.parse_qs(urllib.parse.urlsplit(path).query)['file'][0]
                      result = request_api('/files/read?' + urllib.parse.urlencode({'path': filename}), timeout=timeout)
                      return json.loads(result['content'])
                  if path == '/files/create-folder':
                      return request_api('/files/directory', 'POST', {
                          'path': server_path(payload['root'], payload['name'])}, timeout)
                  if path == '/files/rename':
                      if len(payload['files']) != 1:
                          raise StageError('Expected one atomic file move.')
                      move = payload['files'][0]
                      source = server_path(payload['root'], move['from'])
                      destination = server_path(payload['root'], move['to'])
                      batch = scratch / 'rename.batch'
                      batch.write_text(f'rename "{source}" "{destination}"\n')
                      moved = subprocess.run([
                          'sftp', '-q', '-b', str(batch), '-i', str(keyfile), '-P', port,
                          '-o', 'BatchMode=yes', '-o', 'IdentitiesOnly=yes', '-o', 'ConnectTimeout=20',
                          '-o', 'PasswordAuthentication=no', '-o', 'KbdInteractiveAuthentication=no',
                          '-o', 'StrictHostKeyChecking=yes', '-o', 'HostKeyAlgorithms=ssh-ed25519',
                          '-o', f'UserKnownHostsFile={hosts}', '-o', 'GlobalKnownHostsFile=/dev/null',
                          f'{username}@{host}'
                      ], capture_output=True, timeout=60, check=False)
                      if moved.returncode:
                          raise StageError('SFTP atomic file move failed; inspect recovery directories.')
                      return None
                  if path == '/files/decompress':
                      return request_api(path, 'POST', {
                          'path': server_path(payload['root'], payload['file'])}, timeout)
                  if path == '/files/chmod':
                      # WISP directory metadata omits permission bits. Verify over the existing SFTP channel.
                      for file in payload['files']:
                          if file['mode'] != '755' or file['file'] != 'Robust.Server':
                              raise StageError('Unexpected permission change.')
                          remote = server_path(payload['root'], file['file'])
                          batch = scratch / 'chmod.batch'
                          batch.write_text(f'chmod 755 "{remote}"\nls -l "{remote}"\n')
                          result = subprocess.run([
                              'sftp', '-q', '-b', str(batch), '-i', str(keyfile), '-P', port,
                              '-o', 'BatchMode=yes', '-o', 'IdentitiesOnly=yes', '-o', 'ConnectTimeout=20',
                              '-o', 'PasswordAuthentication=no', '-o', 'KbdInteractiveAuthentication=no',
                              '-o', 'StrictHostKeyChecking=yes', '-o', 'HostKeyAlgorithms=ssh-ed25519',
                              '-o', f'UserKnownHostsFile={hosts}', '-o', 'GlobalKnownHostsFile=/dev/null',
                              f'{username}@{host}'
                          ], capture_output=True, text=True, timeout=60, check=False)
                          if result.returncode or not any(line.startswith('-rwxr-xr-x')
                                                          for line in result.stdout.splitlines()):
                              raise StageError('Could not verify server executable permission over SFTP.')
                      return None
                  return request_api(path, method, payload, timeout)

              def listing(directory):
                  entries = {}
                  page = 1
                  while page <= 1000:
                      result = request_api('/files/directory?' + urllib.parse.urlencode({
                          'path': directory, 'per_page': 25, 'page': page}))
                      for item in result['data']:
                          entry = dict(item['attributes'])
                          entry['is_file'] = entry['type'] == 'file'
                          entry['is_symlink'] = bool(entry.get('symlink')) or entry['type'] == 'symlink'
                          if entry['name'] in entries:
                              raise StageError('Duplicate directory entry; pagination could not be verified.')
                          entries[entry['name']] = entry
                      pagination = result.get('meta', {}).get('pagination') or {}
                      total = pagination.get('totalPages', pagination.get('total_pages', 1))
                      if page >= int(total):
                          return entries
                      page += 1
                  raise StageError('Directory pagination exceeded the safety limit.')

              run = os.environ['GITHUB_RUN_ID']
              attempt = os.environ['GITHUB_RUN_ATTEMPT']
              if not run.isdigit() or not attempt.isdigit():
                  raise StageError('Invalid run identifier.')
              folder = f'.networkbay-verify-{run}-{attempt}' if mode == 'verify' else f'.networkbay-stage-{run}-{attempt}'
              live = listing('/')
              for name in ('Robust.Server', 'server_config.toml', 'data', 'logs'):
                  if name not in live or live[name].get('is_symlink'):
                      raise StageError('Expected live files or folders are missing or are symbolic links.')
              if folder in live:
                  raise StageError('This staging folder already exists; refusing to overwrite it.')
              before = api('/resources')['attributes']
              limit = api('')['attributes']['limits']['disk']
              print('NETWORKBAY status read successfully. Live server state:', before['current_state'], flush=True)
          
              with tempfile.TemporaryDirectory(prefix='networkbay-stage-') as scratch:
                  scratch = Path(scratch)
                  package = scratch / 'package.zip'
                  source = 'package/SS14.Server_linux-x64.zip'
                  if mode == 'verify':
                      source = scratch / 'fixture.zip'
                      with zipfile.ZipFile(source, 'w') as fixture:
                          fixture.writestr('Robust.Server', '#!/bin/sh\nexit 0\n')
                          fixture.writestr('Content.Client.zip', b'connection-test-only')
                          fixture.writestr('Resources/connection-test.txt', 'isolated deployment verification')
                      print('Verifying file operations with a tiny isolated fixture; live files and power stay unchanged.', flush=True)
                  expected = prepare(source, package)
                  required_bytes = package.stat().st_size + sum(expected.values()) + 128 * 1024 * 1024
                  if limit and int(limit) * 1024 * 1024 - before['resources']['disk_bytes'] < required_bytes:
                      raise StageError('Insufficient NETWORKBAY disk quota for archive plus extracted staging files.')
                  print('Package checked; live config, data, and logs excluded.', flush=True)
          
                  scan = subprocess.run(
                      ['ssh-keyscan', '-T', '15', '-p', port, '-t', 'ed25519', host],
                      capture_output=True, text=True, timeout=30, check=False
                  )
                  keys = [line for line in scan.stdout.splitlines() if line and not line.startswith('#')]
                  if len(keys) != 1:
                      raise StageError('Expected exactly one ED25519 host key.')
                  fields = keys[0].split()
                  if len(fields) != 3 or fields[:2] != [f'[{host}]:{port}', 'ssh-ed25519']:
                      raise StageError('Unexpected SFTP host-key format.')
                  fingerprint = 'SHA256:' + base64.b64encode(
                      hashlib.sha256(base64.b64decode(fields[2], validate=True)).digest()
                  ).decode().rstrip('=')
                  if not os.environ.get('NETWORKBAY_SFTP_FINGERPRINT') or fingerprint != os.environ['NETWORKBAY_SFTP_FINGERPRINT']:
                      raise StageError('SFTP host key changed; refusing authentication.')
                  hosts = scratch / 'known_hosts'
                  hosts.write_text(keys[0] + '\n')
                  keyfile = scratch / 'identity'
                  keyfile.write_text(private_key.replace('\r', '').rstrip('\n') + '\n')
                  keyfile.chmod(0o600)
                  private_key = None
                  checked = subprocess.run(
                      ['ssh-keygen', '-y', '-P', '', '-f', str(keyfile)], capture_output=True, timeout=15
                  )
                  if checked.returncode:
                      raise StageError('SSH private key is invalid or needs a passphrase.')
          
                  api('/files/create-folder', 'POST', {'root': '/', 'name': folder})
                  print('Uploading into isolated folder:', folder, flush=True)
                  batch = scratch / 'upload.batch'
                  batch.write_text(f'put "{package.as_posix()}" "/{folder}/package.zip"\n')
                  transferred = subprocess.run([
                      'sftp', '-q', '-b', str(batch), '-i', str(keyfile), '-P', port,
                      '-o', 'BatchMode=yes', '-o', 'IdentitiesOnly=yes', '-o', 'ConnectTimeout=20',
                      '-o', 'PasswordAuthentication=no', '-o', 'KbdInteractiveAuthentication=no',
                      '-o', 'StrictHostKeyChecking=yes', '-o', 'HostKeyAlgorithms=ssh-ed25519',
                      '-o', f'UserKnownHostsFile={hosts}', '-o', 'GlobalKnownHostsFile=/dev/null',
                      f'{username}@{host}'
                  ], capture_output=True, timeout=1800, check=False)
                  if transferred.returncode:
                      raise StageError('SFTP staging upload failed; live files are unchanged.')
                  uploaded = listing('/' + folder).get('package.zip', {})
                  if uploaded.get('size') != package.stat().st_size:
                      raise StageError('Uploaded archive size does not match.')
                  print('Upload complete; unpacking only inside staging folder.', flush=True)
                  api('/files/decompress', 'POST', {'root': '/' + folder, 'file': 'package.zip'}, timeout=330)
                  staged = listing('/' + folder)
                  for name, size in expected.items():
                      if '/' not in name:
                          entry = staged.get(name, {})
                          if entry.get('size') != size or not entry.get('is_file') or entry.get('is_symlink'):
                              raise StageError('A staged root file is missing, unexpected, or the wrong size.')
                  resources = staged.get('Resources', {})
                  if not resources or resources.get('is_file') or resources.get('is_symlink'):
                      raise StageError('Staged Resources directory is missing or invalid.')
                  for name in ('server_config.toml', 'data', 'logs'):
                      if name in staged:
                          raise StageError('Protected live paths unexpectedly appear in staging.')
                  api('/files/chmod', 'POST', {
                      'root': '/' + folder, 'files': [{'file': 'Robust.Server', 'mode': '755'}]
                  })
                  print('Staging passed. Live server files and power state were not modified.', flush=True)
                  if mode == 'verify':
                      original_config = live['server_config.toml']
                      api('/files/create-folder', 'POST', {'root': '/' + folder, 'name': 'move-test'})
                      api('/files/rename', 'PUT', {'root': '/', 'files': [{
                          'from': folder + '/Resources/connection-test.txt',
                          'to': folder + '/move-test/connection-test.txt'}]})
                      if 'connection-test.txt' not in listing('/' + folder + '/move-test'):
                          raise StageError('Isolated file move could not be verified.')
                      restored_live = listing('/')
                      for field in ('size', 'modified_at'):
                          if restored_live['server_config.toml'].get(field) != original_config.get(field):
                              raise StageError('Live configuration changed during verification.')
                      if api('/resources')['attributes']['current_state'] != before['current_state']:
                          raise StageError('Server power state changed during verification.')
                      print('Verification passed: API, pinned SFTP, isolated upload/extraction, pagination, chmod and rename. Live files and power unchanged.', flush=True)
                  summary = os.environ.get('GITHUB_STEP_SUMMARY')
                  if summary:
                      with open(summary, 'a', encoding='utf-8') as out:
                          out.write(f'### NETWORKBAY staging passed\n\nFolder: `{folder}`\n\n')
                          out.write(f'Built revision: `{os.environ["GITHUB_SHA"]}`\n\n')
                          out.write('Server package uploaded and unpacked; executable permission verified. '
                                    'Live configuration, data, logs, and server power were unchanged.\n')
                  if mode == 'deploy':
                      promote(api, listing, folder, expected, run, attempt)
          
          
          if __name__ == '__main__':
              try:
                  main()
              except StageError as error:
                  raise SystemExit(str(error)) from None
              except Exception:
                  raise SystemExit('NETWORKBAY workflow failed; unexpected details withheld. Inspect the job log and summary.') from None
          PY
