name: No submodule update checker

on:
  pull_request:
    paths:
      - 'RobustToolbox'

jobs:
  this_aint_right:
    name: Submodule update in pr found
    runs-on: ubuntu-latest
    steps:
      # #Misfits Change - Allowlisted actors get green check instead of grey skip
      - name: Check submodule update permission
        env:
          ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          ALLOWED="sleepyyapril VMSolidus DEATHB4DEFEAT Cythisiax"
          if [ "$ACTOR" = "$REPOSITORY_OWNER" ] || echo "$ALLOWED" | grep -qw "$ACTOR"; then
            echo "✅ $ACTOR is allowed to update submodules"
            exit 0
          else
            echo "❌ $ACTOR is not allowed to update submodules"
            exit 1
          fi
