name: OXY Manual Build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Choose check, build, stage, or deploy (deploy waits for the round to finish)
        type: choice
        required: true
        default: check
        options:
          - check
          - build
          - stage
          - deploy

permissions:
  contents: read

concurrency:
  group: oxy-manual
  cancel-in-progress: false

jobs:
  build:
    if: inputs.mode == 'build' || ((inputs.mode == 'stage' || inputs.mode == 'deploy') && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out code and engine
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Linux server with bundled client
        run: dotnet run --project Content.Packaging server --platform linux-x64 --hybrid-acz

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('release/SS14.Server_linux-x64.zip') as package:
              names = set(package.namelist())
              for required in ('Robust.Server', 'Content.Client.zip'):
                  if required not in names:
                      raise SystemExit(f'Missing required file: {required}')
              print('Verified server and bundled client.')
          PY

      - name: Save server package
        uses: actions/upload-artifact@v4
        with:
          name: oxy-linux-server-${{ github.sha }}
          path: release/SS14.Server_linux-x64.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0


  connection-check:
    if: inputs.mode == 'check'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read OXY server status
        env:
          OXY_API_KEY: ${{ secrets.OXY_API_KEY }}
          OXY_PANEL_URL: ${{ vars.OXY_PANEL_URL }}
          OXY_SERVER_ID: ${{ vars.OXY_SERVER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          import urllib.request, urllib.error
          panel = os.environ['OXY_PANEL_URL'].rstrip('/')
          server = os.environ['OXY_SERVER_ID']
          token = os.environ['OXY_API_KEY']
          if panel != 'https://panel.oxy.games' or server != '6c120791':
              sys.exit('OXY panel or server variable does not match the intended server.')
          if not token:
              sys.exit('OXY_API_KEY is missing.')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          request = urllib.request.Request(
              f'{panel}/api/client/servers/{server}/resources',
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'})
          try:
              opener = urllib.request.build_opener(NoRedirect())
              with opener.open(request, timeout=30) as response:
                  result = json.load(response)
              state = result['attributes']['current_state']
              if state not in ('running', 'offline', 'starting', 'stopping'):
                  sys.exit('OXY returned an unexpected server state.')
              print(f'OXY API connection successful. Server state: {state}')
          except urllib.error.HTTPError as error:
              sys.exit(f'OXY API check failed: HTTP {error.code}. Response body withheld.')
          except (urllib.error.URLError, TimeoutError, ValueError, KeyError):
              sys.exit('OXY API check failed: network or unexpected response. Details withheld.')
          PY

      - name: Discover SFTP host key for independent verification
        env:
          OXY_SFTP_HOST: ${{ vars.OXY_SFTP_HOST }}
          OXY_SFTP_PORT: ${{ vars.OXY_SFTP_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$OXY_SFTP_HOST" = 'relay.oxy.games'
          test "$OXY_SFTP_PORT" = '2622'
          ssh-keyscan -T 15 -p "$OXY_SFTP_PORT" -t ed25519 "$OXY_SFTP_HOST" > "$RUNNER_TEMP/oxy-host-keys" 2>/dev/null
          test -s "$RUNNER_TEMP/oxy-host-keys"
          echo 'SFTP endpoint responded. Comparing with the initial connection fingerprint before login:'
          ssh-keygen -lf "$RUNNER_TEMP/oxy-host-keys" -E sha256
          echo 'This discovery step does not authenticate or modify the server.'

      - name: Test SFTP key login without modifying files
        env:
          OXY_SSH_KEY: ${{ secrets.OXY_SSH_KEY }}
          OXY_SFTP_HOST: ${{ vars.OXY_SFTP_HOST }}
          OXY_SFTP_PORT: ${{ vars.OXY_SFTP_PORT }}
          OXY_SFTP_USERNAME: ${{ vars.OXY_SFTP_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          test "$OXY_SFTP_HOST" = 'relay.oxy.games'
          test "$OXY_SFTP_PORT" = '2622'
          test "$OXY_SFTP_USERNAME" = 'nibanath22_gmail.com.6c120791'
          # Trust baseline: key observed on the successful initial connection test.
          expected='SHA256:jaX+FxW5+EnIYnPGmTN+hpQnYjwg7s60pEqWhkLYX5Q'
          actual=$(ssh-keygen -lf "$RUNNER_TEMP/oxy-host-keys" -E sha256 | awk '{print $2}')
          if [ "$actual" != "$expected" ]; then
            echo 'SFTP host key does not match the pinned fingerprint; refusing login.'
            exit 1
          fi
          test -n "$OXY_SSH_KEY"
          umask 077
          keyfile="$RUNNER_TEMP/oxy-private-key"
          batchfile="$RUNNER_TEMP/oxy-readonly-batch"
          trap 'rm -f "$keyfile" "$batchfile"' EXIT
          printf '%s\n' "$OXY_SSH_KEY" | tr -d '\r' > "$keyfile"
          unset OXY_SSH_KEY
          ssh-keygen -y -P '' -f "$keyfile" > /dev/null
          printf '%s\n' 'ls /Robust.Server' 'ls /server_config.toml' 'cd /data' 'cd /logs' > "$batchfile"
          sftp -q -b "$batchfile" -i "$keyfile" -P "$OXY_SFTP_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
            -o UserKnownHostsFile="$RUNNER_TEMP/oxy-host-keys" \
            -o GlobalKnownHostsFile=/dev/null \
            "$OXY_SFTP_USERNAME@$OXY_SFTP_HOST"
          echo 'SFTP key login successful; expected server files and folders exist.'
          echo 'No files were modified and no server power actions were performed.'

      - name: Save public host keys for verification
        uses: actions/upload-artifact@v4
        with:
          name: oxy-unverified-public-host-keys
          path: ${{ runner.temp }}/oxy-host-keys
          if-no-files-found: error
          retention-days: 7

  stage:
    if: (inputs.mode == 'stage' || inputs.mode == 'deploy') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Download this run's verified server package
        uses: actions/download-artifact@v4
        with:
          name: oxy-linux-server-${{ github.sha }}
          path: package

      - name: Stage package and deploy when selected
        env:
          OXY_MODE: ${{ inputs.mode }}
          OXY_API_KEY: ${{ secrets.OXY_API_KEY }}
          OXY_SSH_KEY: ${{ secrets.OXY_SSH_KEY }}
          OXY_PANEL_URL: ${{ vars.OXY_PANEL_URL }}
          OXY_SERVER_ID: ${{ vars.OXY_SERVER_ID }}
          OXY_SFTP_HOST: ${{ vars.OXY_SFTP_HOST }}
          OXY_SFTP_PORT: ${{ vars.OXY_SFTP_PORT }}
          OXY_SFTP_USERNAME: ${{ vars.OXY_SFTP_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Stage a package in an isolated OXY folder; never change live files or power."""
          import base64
          import hashlib
          import json
          import os
          import secrets
          from pathlib import Path, PurePosixPath
          import shutil
          import stat
          import subprocess
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          
          
          class StageError(Exception):
              pass
          
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          
          def prepare(source, destination):
              expected = {}
              seen = set()
              with zipfile.ZipFile(source) as original, zipfile.ZipFile(
                  destination, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=1
              ) as output:
                  for entry in original.infolist():
                      name = entry.filename
                      parts = PurePosixPath(name).parts
                      if not parts or name.startswith('/') or '\\' in name or '..' in parts:
                          raise StageError('Package contains an unsafe path.')
                      if ':' in name or any(ord(character) < 32 for character in name):
                          raise StageError('Package contains an unsupported path.')
                      if stat.S_ISLNK(entry.external_attr >> 16):
                          raise StageError('Package contains a symbolic link.')
                      top = parts[0].lower()
                      if top in ('data', 'logs', 'server_config.toml') or top.startswith('.'):
                          continue
                      if len(parts) == 1 and top.endswith(('.toml', '.db', '.sqlite', '.sqlite3')):
                          continue
                      if name in seen:
                          raise StageError('Package contains duplicate entries.')
                      seen.add(name)
                      if entry.is_dir():
                          output.writestr(entry, b'')
                          continue
                      # Reading each entry to its end also verifies its original ZIP CRC.
                      with original.open(entry) as incoming, output.open(name, 'w', force_zip64=True) as outgoing:
                          shutil.copyfileobj(incoming, outgoing, length=1024 * 1024)
                      expected[name] = entry.file_size
              if not all(name in expected for name in ('Robust.Server', 'Content.Client.zip')):
                  raise StageError('Package is missing the server or bundled client.')
              if not any(name.startswith('Resources/') for name in expected):
                  raise StageError('Package is missing game resources.')
              return expected
          
          
          def wait_for_round_end(api, listing, state, wait_limit=18000):
              """Never infer a safe round boundary from power state alone."""
              ticket = secrets.token_hex(16)
              deadline = time.monotonic() + wait_limit
              acknowledgement_deadline = time.monotonic() + 60
              next_heartbeat = 0
              acknowledged = False
              stop_requested = False
              shutdown_deadline = None
              def read_receipt():
                  if 'reclamation-update.json' not in listing('/data'):
                      return None
                  return api('/files/contents?' + urllib.parse.urlencode({
                      'file': '/data/reclamation-update.json'
                  }))
              try:
                  while time.monotonic() < deadline:
                      receipt = read_receipt()
                      power_state = state()
                      # The server may have finished between the first file read and the power query.
                      if power_state in ('offline', 'stopping', 'starting'):
                          receipt = read_receipt()
                      if isinstance(receipt, dict) and receipt.get('ticket') == ticket:
                          status = receipt.get('state')
                          if status == 'cancelled':
                              raise StageError('Round-end deployment was cancelled; live files are unchanged.')
                          if status == 'ready':
                              # Receipt is issued by the game at a safe boundary, before it shuts down.
                              if power_state not in ('running', 'stopping', 'starting', 'offline'):
                                  raise StageError('Unexpected server state after the round-end receipt.')
                              if not stop_requested:
                                  # Tell Pterodactyl this stop is intentional, so it does not restart
                                  # the process while installation is waiting for an offline state.
                                  api('/power', 'POST', {'signal': 'stop'})
                                  stop_requested = True
                                  shutdown_deadline = time.monotonic() + 180
                                  print('Round boundary confirmed. OXY stop requested for installation.', flush=True)
                                  power_state = state()
                              if power_state == 'offline':
                                  print('Round boundary confirmed and server is offline.', flush=True)
                                  return
                              if time.monotonic() >= shutdown_deadline:
                                  raise StageError('OXY did not stop after the confirmed round boundary; refusing installation.')
                              time.sleep(5)
                              continue
                          if status != 'pending':
                              raise StageError('Unexpected deployment acknowledgement; refusing installation.')
                          acknowledged = True
                      if power_state != 'running':
                          raise StageError('Server stopped without a matching round-end receipt; refusing installation.')
                      now = time.monotonic()
                      if not acknowledged and now >= acknowledgement_deadline:
                          raise StageError('Server did not acknowledge the round-end command. Install the support code once while offline; do not force-stop a live round.')
                      if now >= next_heartbeat:
                          api('/command', 'POST', {'command': f'reclamation_update_queue {ticket}'})
                          next_heartbeat = now + 30
                      time.sleep(5)
                  raise StageError('No round boundary reached within five hours; deployment cancelled without stopping the round.')
              except BaseException:
                  # Cancellation clears only our ticket. Abrupt runner termination is covered by the 3-minute lease.
                  try:
                      if state() == 'running':
                          api('/command', 'POST', {'command': f'reclamation_update_cancel {ticket}'})
                  except Exception:
                      pass
                  raise

          def promote(api, listing, folder, expected, run, attempt):
              names = sorted({PurePosixPath(name).parts[0] for name in expected})
              if any(name.lower() in ('data', 'logs', 'server_config.toml', 'package.zip')
                     or name.startswith('.') or '/' in name for name in names):
                  raise StageError('Unsafe deployment root entries.')
              backup = f'.oxy-rollback-{run}-{attempt}'
              failed = f'.oxy-failed-{run}-{attempt}'
              original = listing('/')
              if backup in original or failed in original:
                  raise StageError('Recovery folders already exist; refusing deployment.')
              if any(original.get(name, {}).get('is_symlink') for name in names):
                  raise StageError('A live game path is a symbolic link; refusing deployment.')
          
              def state():
                  return api('/resources', timeout=15)['attributes']['current_state']
          
              def wait_for(target, seconds):
                  deadline = time.monotonic() + seconds
                  while time.monotonic() < deadline:
                      if state() == target:
                          return
                      time.sleep(5)
                  raise StageError(f'Timed out waiting for server state: {target}.')
          
              def power(signal):
                  api('/power', 'POST', {'signal': signal}, timeout=30)
          
              def move(source, destination):
                  api('/files/rename', 'PUT', {
                      'root': '/', 'files': [{'from': source, 'to': destination}]
                  })
          
              initial = state()
              if initial not in ('running', 'offline'):
                  raise StageError('Server is already starting or stopping; retry when stable.')
              if initial == 'running':
                  print('Package is ready. Queueing a player announcement and waiting for the round boundary.', flush=True)
                  wait_for_round_end(api, listing, state)
              # The safe shutdown is confirmed before preparing recovery folders. No deletions are used.
              api('/files/create-folder', 'POST', {'root': '/', 'name': backup})
              api('/files/create-folder', 'POST', {'root': '/', 'name': failed})
              print('Recovery copy folder:', backup, flush=True)
              print('Beginning manual deployment; configuration, data, and logs stay in place.', flush=True)
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary, 'a', encoding='utf-8') as out:
                      out.write(f'\n### Deployment recovery\n\nOld game files: `{backup}`\n\n'
                                f'Staged/new files: `{folder}`\n\nFailed installation files: `{failed}`\n\n'
                                'Do not manually cancel during file installation. If interrupted, '
                                'keep the server offline until the installation or recovery is completed.\n')
              changed = False
              try:
                  wait_for('offline', 180)
                  # The server is stopped: refresh paths to avoid stale live-directory information.
                  original = listing('/')
                  for name in ('server_config.toml', 'data', 'logs'):
                      if name not in original or original[name].get('is_symlink'):
                          raise StageError('Protected live paths are missing or unsafe.')
                  config = original['server_config.toml']
                  for name in names:
                      if original.get(name, {}).get('is_symlink'):
                          raise StageError('Live game path became a symbolic link.')
                      if name in original:
                          # Mark before sending: a network timeout can follow a successful rename.
                          changed = True
                          move(name, backup + '/' + name)
                  for name in names:
                      changed = True
                      move(folder + '/' + name, name)
                  installed = listing('/')
                  for name, size in expected.items():
                      if '/' not in name and installed.get(name, {}).get('size') != size:
                          raise StageError('Installed file size does not match staged package.')
                  for field in ('size', 'modified_at'):
                      if installed['server_config.toml'].get(field) != config.get(field):
                          raise StageError('Live configuration metadata changed unexpectedly.')
                  api('/files/chmod', 'POST', {
                      'root': '/', 'files': [{'file': 'Robust.Server', 'mode': '755'}]
                  })
                  if str(listing('/')['Robust.Server'].get('mode_bits', '')).lstrip('0') != '755':
                      raise StageError('Installed executable permission could not be verified.')
                  print('Installation verified. Starting OXY.', flush=True)
                  power('start')
                  wait_for('running', 180)
                  # Confirm it stays running rather than merely observing the startup transition.
                  for _ in range(6):
                      time.sleep(5)
                      if state() != 'running':
                          raise StageError('The new server did not stay running after startup.')
                  print('Deployment passed: server stayed running for 30 seconds.', flush=True)
                  if summary:
                      with open(summary, 'a', encoding='utf-8') as out:
                          out.write('\n### OXY deployment passed\n\nServer restarted and remained running '
                                    'for 30 seconds. Configuration, data, and logs preserved. '
                                    'An in-game connection is still needed to verify gameplay.\n')
              except Exception:
                  print('Deployment failed. Attempting recovery of the previous game files.', flush=True)
                  try:
                      if changed:
                          if state() != 'offline':
                              power('stop')
                              wait_for('offline', 180)
                          # Inspect actual locations so an ambiguous rename response is recoverable.
                          saved = listing('/' + backup)
                          live = listing('/')
                          staged = listing('/' + folder)
                          for name in names:
                              is_new = name in saved or (name not in original and name not in staged)
                              if is_new and name in live:
                                  move(name, failed + '/' + name)
                          for name in saved:
                              if name not in names:
                                  raise StageError('Unexpected recovery path; refusing to restore it.')
                              move(backup + '/' + name, name)
                          restored = listing('/')
                          for name in names:
                              if name in original:
                                  if name not in restored or restored[name].get('size') != original[name].get('size'):
                                      raise StageError('Previous files could not be verified after recovery.')
                              elif name in restored:
                                  raise StageError('A new game path remains after recovery.')
                      if initial == 'running':
                          if state() == 'stopping':
                              wait_for('offline', 180)
                          if state() == 'offline':
                              power('start')
                          wait_for('running', 180)
                      print('Previous game files and initial power state restored.', flush=True)
                  except Exception:
                      print('Automatic recovery could not finish. Use the retained recovery folders '
                            'or the OXY backup; inspect power state before taking further action.', flush=True)
                      raise StageError('Deployment and automatic recovery failed; operator action required.') from None
                  raise StageError('Deployment failed; the previous installation was restored.') from None
          
          
          def main():
              mode = os.environ.get('OXY_MODE', 'stage')
              if mode not in ('stage', 'deploy'):
                  raise StageError('Invalid workflow mode.')
              if os.environ.get('GITHUB_REF') != 'refs/heads/main':
                  raise StageError('Staging is restricted to the main branch.')
              panel = os.environ['OXY_PANEL_URL'].rstrip('/')
              server = os.environ['OXY_SERVER_ID']
              host = os.environ['OXY_SFTP_HOST']
              port = os.environ['OXY_SFTP_PORT']
              username = os.environ['OXY_SFTP_USERNAME']
              if (panel, server, host, port, username) != (
                  'https://panel.oxy.games', '6c120791', 'relay.oxy.games', '2622',
                  'nibanath22_gmail.com.6c120791'
              ):
                  raise StageError('OXY variables do not match the intended server.')
              token = os.environ.pop('OXY_API_KEY', '')
              private_key = os.environ.pop('OXY_SSH_KEY', '')
              if not token or not private_key:
                  raise StageError('An OXY secret is missing.')
              base = f'{panel}/api/client/servers/{server}'
              opener = urllib.request.build_opener(NoRedirect())
          
              def api(path, method='GET', payload=None, timeout=45):
                  body = json.dumps(payload).encode() if payload is not None else None
                  request = urllib.request.Request(base + path, data=body, method=method, headers={
                      'Authorization': 'Bearer ' + token,
                      'Accept': 'application/json', 'Content-Type': 'application/json'
                  })
                  try:
                      with opener.open(request, timeout=timeout) as response:
                          content = response.read()
                          return json.loads(content) if content else None
                  except urllib.error.HTTPError as error:
                      raise StageError(f'OXY API {path.split("?")[0]} failed: HTTP {error.code}.') from None
                  except (urllib.error.URLError, TimeoutError, ValueError):
                      raise StageError('OXY API network or response error; details withheld.') from None
          
              def listing(directory):
                  result = api('/files/list?' + urllib.parse.urlencode({'directory': directory}))
                  return {item['attributes']['name']: item['attributes'] for item in result['data']}
          
              run = os.environ['GITHUB_RUN_ID']
              attempt = os.environ['GITHUB_RUN_ATTEMPT']
              if not run.isdigit() or not attempt.isdigit():
                  raise StageError('Invalid run identifier.')
              folder = f'.oxy-stage-{run}-{attempt}'
              live = listing('/')
              for name in ('Robust.Server', 'server_config.toml', 'data', 'logs'):
                  if name not in live or live[name].get('is_symlink'):
                      raise StageError('Expected live files or folders are missing or are symbolic links.')
              if folder in live:
                  raise StageError('This staging folder already exists; refusing to overwrite it.')
              before = api('/resources')['attributes']
              limit = api('')['attributes']['limits']['disk']
              print('OXY status read successfully. Live server state:', before['current_state'], flush=True)
          
              with tempfile.TemporaryDirectory(prefix='oxy-stage-') as scratch:
                  scratch = Path(scratch)
                  package = scratch / 'package.zip'
                  expected = prepare('package/SS14.Server_linux-x64.zip', package)
                  required_bytes = package.stat().st_size + sum(expected.values()) + 128 * 1024 * 1024
                  if limit and int(limit) * 1024 * 1024 - before['resources']['disk_bytes'] < required_bytes:
                      raise StageError('Insufficient OXY disk quota for archive plus extracted staging files.')
                  print('Package checked; live config, data, and logs excluded.', flush=True)
          
                  scan = subprocess.run(
                      ['ssh-keyscan', '-T', '15', '-p', port, '-t', 'ed25519', host],
                      capture_output=True, text=True, timeout=30, check=False
                  )
                  keys = [line for line in scan.stdout.splitlines() if line and not line.startswith('#')]
                  if len(keys) != 1:
                      raise StageError('Expected exactly one ED25519 host key.')
                  fields = keys[0].split()
                  if len(fields) != 3 or fields[:2] != [f'[{host}]:{port}', 'ssh-ed25519']:
                      raise StageError('Unexpected SFTP host-key format.')
                  fingerprint = 'SHA256:' + base64.b64encode(
                      hashlib.sha256(base64.b64decode(fields[2], validate=True)).digest()
                  ).decode().rstrip('=')
                  if fingerprint != 'SHA256:jaX+FxW5+EnIYnPGmTN+hpQnYjwg7s60pEqWhkLYX5Q':
                      raise StageError('SFTP host key changed; refusing authentication.')
                  hosts = scratch / 'known_hosts'
                  hosts.write_text(keys[0] + '\n')
                  keyfile = scratch / 'identity'
                  keyfile.write_text(private_key.replace('\r', '').rstrip('\n') + '\n')
                  keyfile.chmod(0o600)
                  private_key = None
                  checked = subprocess.run(
                      ['ssh-keygen', '-y', '-P', '', '-f', str(keyfile)], capture_output=True, timeout=15
                  )
                  if checked.returncode:
                      raise StageError('SSH private key is invalid or needs a passphrase.')
          
                  api('/files/create-folder', 'POST', {'root': '/', 'name': folder})
                  print('Uploading into isolated folder:', folder, flush=True)
                  batch = scratch / 'upload.batch'
                  batch.write_text(f'put "{package.as_posix()}" "/{folder}/package.zip"\n')
                  transferred = subprocess.run([
                      'sftp', '-q', '-b', str(batch), '-i', str(keyfile), '-P', port,
                      '-o', 'BatchMode=yes', '-o', 'IdentitiesOnly=yes', '-o', 'ConnectTimeout=20',
                      '-o', 'PasswordAuthentication=no', '-o', 'KbdInteractiveAuthentication=no',
                      '-o', 'StrictHostKeyChecking=yes', '-o', 'HostKeyAlgorithms=ssh-ed25519',
                      '-o', f'UserKnownHostsFile={hosts}', '-o', 'GlobalKnownHostsFile=/dev/null',
                      f'{username}@{host}'
                  ], capture_output=True, timeout=1800, check=False)
                  keyfile.unlink()
                  if transferred.returncode:
                      raise StageError('SFTP staging upload failed; live files are unchanged.')
                  uploaded = listing('/' + folder).get('package.zip', {})
                  if uploaded.get('size') != package.stat().st_size:
                      raise StageError('Uploaded archive size does not match.')
                  print('Upload complete; unpacking only inside staging folder.', flush=True)
                  api('/files/decompress', 'POST', {'root': '/' + folder, 'file': 'package.zip'}, timeout=330)
                  staged = listing('/' + folder)
                  for name, size in expected.items():
                      if '/' not in name:
                          entry = staged.get(name, {})
                          if entry.get('size') != size or not entry.get('is_file') or entry.get('is_symlink'):
                              raise StageError('A staged root file is missing, unexpected, or the wrong size.')
                  resources = staged.get('Resources', {})
                  if not resources or resources.get('is_file') or resources.get('is_symlink'):
                      raise StageError('Staged Resources directory is missing or invalid.')
                  for name in ('server_config.toml', 'data', 'logs'):
                      if name in staged:
                          raise StageError('Protected live paths unexpectedly appear in staging.')
                  api('/files/chmod', 'POST', {
                      'root': '/' + folder, 'files': [{'file': 'Robust.Server', 'mode': '755'}]
                  })
                  executable_mode = str(listing('/' + folder)['Robust.Server'].get('mode_bits', ''))
                  if executable_mode.lstrip('0') != '755':
                      raise StageError('Could not verify staged executable permission.')
                  print('Staging passed. Live server files and power state were not modified.', flush=True)
                  summary = os.environ.get('GITHUB_STEP_SUMMARY')
                  if summary:
                      with open(summary, 'a', encoding='utf-8') as out:
                          out.write(f'### OXY staging passed\n\nFolder: `{folder}`\n\n')
                          out.write(f'Built revision: `{os.environ["GITHUB_SHA"]}`\n\n')
                          out.write('Server package uploaded and unpacked; executable permission verified. '
                                    'Live configuration, data, logs, and server power were unchanged.\n')
                  if mode == 'deploy':
                      promote(api, listing, folder, expected, run, attempt)
          
          
          if __name__ == '__main__':
              try:
                  main()
              except StageError as error:
                  raise SystemExit(str(error)) from None
              except Exception:
                  raise SystemExit('OXY workflow failed; unexpected details withheld. Inspect the job log and summary.') from None
          PY
