author: BluCottonCandy
changes:
- type: Add
  message: Added Lucky 38 slots with animated reels, five payouts, and new spin, win, jackpot, and loss sounds.
- type: Add
  message: The Don starts with 1,000 caps. Triggermen leadership can fund casino games and collect their house balances.
- type: Add
  message: Added blackjack with a Urist dealer, a shuffled 52-card deck, visible hand totals, and refunds on ties.
- type: Add
  message: Added six-pocket pool for solo practice and two-player 8-ball, with aiming, shot power, fouls, and cue-ball placement.
- type: Add
  message: Added double-zero roulette with random spins, small wager limits, result history, and a 5.26% house edge.
