- type: entity
  parent: ClothingBeltStorageBase
  id: ClothingBeltQuiver
  name: quiver
  description: A belt quiver that supplies arrows to bows automatically. Its toggleable magnet gathers nearby arrows.
  components:
  - type: BowQuiver
  - type: Sprite
    sprite: Clothing/Belt/quiver.rsi
    layers:
    - state: icon
    - map: [ "enum.StorageContainerVisualLayers.Fill" ]
      visible: false
    - sprite: _ReclamationProject/Objects/Weapons/Pack/quiver.rsi
      state: magnet-on
      map: [magnet]
  - type: ItemToggle
    onActivate: false
    predictable: false
    activated: true
  - type: ComponentToggler
    components:
    - type: MagnetPickup
      range: 1.5
      slotFlags: BELT
      whitelist:
        tags: [Arrow]
  - type: Clothing
  - type: Storage
    grid:
    - 0,0,7,3
    maxItemSize: Small
    whitelist:
      tags:
      - Arrow
      - Plunger
  - type: Appearance
  - type: StorageContainerVisuals
    maxFillLevels: 3
    fillBaseName: fill-
  - type: GenericVisualizer
    visuals:
      enum.ToggleVisuals.Toggled:
        magnet:
          True: {state: magnet-on}
          False: {state: magnet-off}
  - type: Construction
    graph: Quiver
    node: Quiver
