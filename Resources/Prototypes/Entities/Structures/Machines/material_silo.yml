- type: entity
  id: BaseMaterialSilo
  abstract: true
  components:
  - type: DeviceNetwork
    deviceNetId: Wireless
  - type: WirelessNetworkConnection
    range: 1000
  - type: DeviceLinkSource
    range: 1000
    ports:
    - MaterialSilo
  - type: MaterialStorage
    ignoreColor: true
  - type: MaterialSilo

- type: entity
  id: MaterialSilo
  parent: [ BaseMachinePowered, ConstructibleMachine, BaseMaterialSilo ]
  name: material silo
  description: Bluespace storage connected to most lathes on the station.
  components:
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
    noRot: true
  - type: Sprite
    sprite: Structures/Machines/material_silo.rsi
    layers:
    - state: material_silo
    - state: inserting
      visible: false
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
  - type: Machine
    board: MaterialSiloCircuitboard
  - type: Appearance

- type: entity
  id: BaseMaterialSiloUtilizer
  abstract: true
  components:
  - type: DeviceNetwork
    deviceNetId: Wireless
  - type: WirelessNetworkConnection
    range: 1000
  - type: DeviceLinkSink
    ports:
      - MaterialSiloUtilizer
  - type: MaterialSiloUtilizer
