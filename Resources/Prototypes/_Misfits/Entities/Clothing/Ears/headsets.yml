# #Misfits Add - Vault-assigned robot headset: wasteland + vault comms
- type: entity
  parent: N14ClothingHeadsetAlt
  id: MisfitsClothingHeadsetRobotVault
  name: integrated vault comms module
  description: A hardwired communications module with Vault encryption and a tunable radio.
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyVaultUR
  - type: Sprite
    sprite: _Misfits/Clothing/Ears/Headsets/scrap.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/Ears/Headsets/scrap.rsi

# #Misfits Change - Wasteland scrap headset for junk pile loot drops
- type: entity
  parent: N14ClothingHeadsetAlt
  id: MisfitsClothingHeadsetWastelandScrap
  name: scrap headset
  description: A battered, jury-rigged headset salvaged from the wastes. Its tunable radio still works, but encryption keys must be found separately.
  components:
  - type: ContainerFill
    containers:
      key_slots: []
  - type: Sprite
    sprite: _Misfits/Clothing/Ears/Headsets/scrap.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/Ears/Headsets/scrap.rsi

# Misfits Add - Town Bazaar radio
- type: entity
  parent: MisfitsClothingHeadsetWastelandScrap
