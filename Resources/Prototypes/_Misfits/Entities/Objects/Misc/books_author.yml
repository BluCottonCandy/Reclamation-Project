- type: entity
  parent: FalloutBookBase
  id: BookMinutemen
  name: Minutemen Doctrine
  description: The militia doctrine of serving in the Minutemen.
  components:
    - type: Sprite
      sprite: "_Misfits/Objects/Misc/books.rsi"
      layers:
      - state: falloutpaper
      - state: fallout_cover_base
        color: "#193c7c"
      - state: fallout_decor_stripe
        color: "#ffffff"
      - state: fallout_icon_minutemen
        color: "#ffffff"
      - state: fallout_detail_leatherstrap
    - type: Paper
      content: book-text-minutemen

