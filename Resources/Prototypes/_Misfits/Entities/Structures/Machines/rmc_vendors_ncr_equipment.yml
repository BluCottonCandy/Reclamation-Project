    - NCRCadet
    - NCRSoldier
    - NCRPrivateFirstClass
    - NCRMedic
    - NCRDoctor
    - NCREngineer
    - NCRWS
    - NCRHeavyTrooper
    - NCRHeavyTrooperLead
    - NCRNCO
