- type: entity
  id: N14ExpeditionEntranceBase
  name: n14-expedition-entrance-name
  description: n14-expedition-entrance-desc
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: UserInterface
    interfaces:
      enum.N14ExpeditionBoardUiKey.Key:
        type: N14ExpeditionBoardBoundUserInterface
  - type: N14ExpeditionEntranceLandmark
  # Retain legacy prototype IDs so existing map placements and the automatic
  # entrance spawner all use authored expeditions instead of procedural runs.
  - type: FactoryDeparture
    duration: 1200
    gatherRadius: 3
    mapPool:
    - /Maps/Reclamation/Expeditions/Factory.yml
    - /Maps/Reclamation/Expeditions/Cave1.yml
    mediumMapPool:
    - /Maps/Reclamation/Expeditions/Factory2.yml
    hardMapPool:
    - /Maps/Reclamation/Expeditions/Factory3.yml

- type: entity
  parent: N14ExpeditionEntranceBase
  id: N14ExpeditionEntranceBunker
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Misc/laddersms13.rsi
    state: bunker_open
    noRot: true
    netsync: false
    offset: 0, 0.25

- type: entity
  parent: N14ExpeditionEntranceBase
  id: N14ExpeditionEntranceManhole
  components:
  - type: Sprite
    drawdepth: FloorTiles
    sprite: _Nuclear14/Structures/Misc/laddersms13.rsi
    state: manhole_open
    noRot: true
    netsync: false

- type: entity
  parent: N14ExpeditionEntranceBase
  id: N14ExpeditionEntranceSquareLadder
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Misc/laddersms13.rsi
    state: ladder01
    noRot: true
    netsync: false
    offset: 0, 0.25

- type: entity
  parent: N14ExpeditionEntranceBase
  id: N14ExpeditionEntranceBoardedWell
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Misc/well.rsi
    state: well
    noRot: true
    netsync: false
