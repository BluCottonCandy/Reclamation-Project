#Misfits Change /Add/: New consolidated Brotherhood Paladin job.
- type: job
  id: BoSPaladin
  setPreference: true
  hideIfPlaytimeRequirementsNotMet: false # #Misfits Tweak - all jobs visible in selection
  jobWhitelistBypassesRoleTimers: false # Whitelisting does not waive rank progression.
  weight: 50
  showBorder: true
  overrideConsoleVisibility: true
  canBeAntag: false
  name: job-name-bos-paladin
  overwatchCategory: OverwatchBosPaladin
  description: job-description-bos-paladin
  playTimeTracker: BoSPaladin
  requirements:
    - !type:CharacterSpeciesRequirement # BoS does not accept Ghouls or Glowing Ghouls
      species:
      - Human
      - Courser
    - !type:CharacterPlaytimeRequirement
      tracker: BoSKnight
      min: 18000 # 5 hours in the preceding role.
  startingGear: BoSPaladinGear
  alwaysUseSpawner: true
  icon: "JobIconBosMPaladin"
  supervisors: job-supervisors-bos-paladin
  accessGroups:
  - BOSPaladin
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - BrotherhoodOfSteel
      - type: PowerArmorProficiency # Paladins retain power armor training without starting armor.

- type: startingGear
  id: BoSPaladinGear
  equipment:
    wallet: N14Wallet
    jumpsuit: N14ClothingUniformBosRecon
    back: N14ClothingBackpackMilitary
    shoes: N14ClothingBootsLeatherFilled
    head: N14ClothingHeadHatCapkhighBoS
    outerClothing: N14ClothingOuterCombatArmorBOS
    hands: N14ClothingHandsGlovesCombat
    pocket1: BoSBrotherhoodPaladinKits
    id: N14IDBrotherhoodOfSteelHolotagPaladin
    ears: N14ClothingHeadsetBrotherhoodOfSteel
    belt: MisfitsClothingBeltPaladinWebbing
  storage:
    back:
    - N14BoxPlasticFilledMilitary
    - GrenadeShrapnel # #Misfits Add - faction council Paladin ordnance

- type: playTimeTracker
  id: BoSPaladin
