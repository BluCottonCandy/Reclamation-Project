- type: entity
  parent: BaseStructure
  id: ReclamationBaseBunkerAccess
  abstract: true
  components:
  - type: Sprite
    drawdepth: FloorObjects
  - type: Physics
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        hard: false
        layer: []
        mask: []

- type: entity
  parent: ReclamationBaseBunkerAccess
  id: N14CryoBunkerLadder
  name: bunker hatch
  description: A hatch and ladder leading down to safe spot where one could take some rest.
  components:
  - type: Sprite
    offset: 0, 0.25
    noRot: true
    sprite: _Nuclear14/Structures/Misc/laddersms13.rsi
    layers:
    - state: dasbunker_open
      map: ["base"]
  - type: InteractionOutline
  - type: PersonalBunkerEntrance
  - type: UserInterface
    interfaces:
      enum.PersonalBunkerUiKey.Key:
        type: PersonalBunkerBoundUserInterface
  - type: Cryostorage
  - type: DragInsertContainer
    containerId: storage
  - type: ExitContainerOnMove
    containerId: storage
  - type: ContainerContainer
    containers:
      storage: !type:ContainerSlot
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CryostorageVisuals.Full:
        base:
          True: { state: dasbunker }
          False: { state: dasbunker_open }

- type: entity
  parent: N14CryoBunkerLadder
  id: N14N14CryoBunkerLadderE
  name: bunker hatch
  description: A hatch and ladder leading down to safe spot where one could take some rest. The top of the door has a big E and stars painted on it.
  components:
  - type: Sprite
    offset: 0, 0.25
    noRot: true
    sprite: _Nuclear14/Structures/Misc/laddersms13.rsi
    layers:
    - state: enclave_open
      map: ["base"]
  - type: GenericVisualizer
    visuals:
      enum.CryostorageVisuals.Full:
        base:
          True: { state: enclave }
          False: { state: enclave_open }
- type: entity
  parent: ReclamationBaseBunkerAccess
  id: ReclamationPersonalBunkerExit
  name: bunker ladder
  description: Return to the hatch you entered through. Your room is saved when empty.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Misc/laddersms13.rsi
    state: dasbunker_open
    noRot: true
  - type: InteractionOutline
  - type: PersonalBunkerExit
  - type: PointLight
    radius: 8
    energy: 1.5
    color: "#ffd6a0"

- type: entity
  parent: N14WallConcreteLight
  id: ReclamationPersonalBunkerWall
  name: reinforced bunker wall
  components:
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds: []

- type: entity
  parent: [BaseStructure, BaseMaterialSilo]
  id: ReclamationBunkerMaterialLocker
  name: bunker material locker
  description: A permanent material silo shared by the bunker’s lathes. Holds 60 units of each crafting material and has a drawer for construction supplies.
  components:
  - type: BunkerMaterialLocker
  - type: NoPull
  - type: InteractionOutline
  - type: Sprite
    sprite: _Nuclear14/Structures/Storage/Closets/cabinet.rsi
    layers:
    - state: closet
    - state: closet_door
  - type: Appearance
  - type: MaterialStorage
    unitsPerMaterial: 60
    insertOnInteract: false
    dropOnDeconstruct: false
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Storage
    unitsPerStackType: 60
    clickInsert: false
    maxItemSize: Ginormous
    grid:
    - 0,0,11,11
  - type: FixedItemSizeStorage
    size: 1,1
  - type: ActivatableUI
    key: enum.BunkerMaterialLockerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.BunkerMaterialLockerUiKey.Key:
        type: BunkerMaterialLockerBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
