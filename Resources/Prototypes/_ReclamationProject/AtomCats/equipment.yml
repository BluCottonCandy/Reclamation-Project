- type: entity
  parent: N14ClothingUniformJumpsuitMechanic
  id: AtomCatsCoveralls
  name: Pit Crew coveralls
  description: Oil has worked its way into the knees of these teal coveralls. A broad brass zipper opens far enough to fish a dropped washer out of the lining.
  components:
  - type: Sprite
    sprite: _ReclamationProject/Clothing/AtomCats/jumpsuit.rsi
  - type: Clothing
    sprite: _ReclamationProject/Clothing/AtomCats/jumpsuit.rsi

- type: entity
  parent: N14ClothingOuterCoatLeatherJacket
  id: AtomCatsCut
  name: Whitewall leather jacket
  description: This close-fitting black leather jacket has long sleeves and a narrow band of white shearling at the collar and cuffs. A copper-thread cat looks out from between the shoulders.
  components:
  - type: Sprite
    sprite: _ReclamationProject/Clothing/AtomCats/jacket.rsi
  - type: Clothing
    sprite: _ReclamationProject/Clothing/AtomCats/jacket.rsi

- type: entity
  parent: N14ClothingEyesSunGlasses
  id: AtomCatsShades
  name: Quarter-Mile shades
  description: Smoked lenses keep the glare off the garage floor. Someone scratched a little checkered flag into the inside of one temple.

- type: entity
  parent: N14ClothingBootsCombat
  id: AtomCatsBoots
  name: Curb-Kicker Mk I combat boots
  description: Scuffed steel toes, oxblood laces, and a buckle that a mechanic can undo with greasy fingers. These are the original Mk I pattern.
  components:
  - type: Sprite
    sprite: _ReclamationProject/Clothing/AtomCats/boots.rsi
  - type: Clothing
    sprite: _ReclamationProject/Clothing/AtomCats/boots.rsi

- type: entity
  parent: N14IDCard
  id: AtomCatsGaragePass
  name: Atom Cats switchblade ID
  description: A cherry-red garage pass with the Cat's name and rank stamped into the brass. Work the switch in hand to draw the blade, flip out the barber comb, then fold it shut.
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Misc/atom_cats_switchblade.rsi
    layers:
    - state: folded
      map: [switchblade]
  - type: Item
    sprite: _ReclamationProject/Objects/Misc/atom_cats_switchblade.rsi
    heldPrefix: folded
  - type: Clothing
    sprite: _ReclamationProject/Objects/Misc/atom_cats_switchblade.rsi
  - type: IdCard
    nameLocId: atom-cats-switchblade-name
    fullNameLocId: atom-cats-switchblade-full-name
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.AtomCatsSwitchbladeVisuals.Mode:
        switchblade:
          folded: { state: folded }
          blade: { state: blade }
          comb: { state: comb }
  - type: UserInterface
    interfaces:
      enum.MagicMirrorUiKey.Key:
        type: MagicMirrorBoundUserInterface
  - type: ActivatableUI
    key: enum.MagicMirrorUiKey.Key
    inHandsOnly: true
    requireActiveHand: true
    verbText: atom-cats-switchblade-style
  - type: AtomCatsSwitchblade
    blade:
    - type: MeleeWeapon
      damage:
        types:
          Slash: 25
      soundHit:
        path: /Audio/Weapons/bladeslice.ogg
    comb:
    - type: MagicMirror
      addSlotTime: 20
      removeSlotTime: 20
      selectSlotTime: 20
      changeSlotTime: 20
      requireConfirm: true

- type: startingGear
  id: AtomCatsGarageGear
  abstract: true
  equipment:
    jumpsuit: AtomCatsCoveralls
    eyes: AtomCatsShades
    shoes: AtomCatsBoots
    back: N14ClothingBackpackSatchelExplorer
    id: AtomCatsGaragePass
  storage:
    back:
    - AtomCatsCut
    - Welder
    - AtomCatsStencilCan

- type: startingGear
  parent: AtomCatsGarageGear
  id: AtomCatsRedGear
  equipment:
    outerClothing: AtomCatsT45Red

- type: startingGear
  parent: AtomCatsGarageGear
  id: AtomCatsBlueGear
  equipment:
    outerClothing: AtomCatsT45Blue
