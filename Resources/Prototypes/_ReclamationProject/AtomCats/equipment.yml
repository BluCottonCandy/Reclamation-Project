- type: entity
  parent: N14WelderIndustrial
  id: AtomCatsBossWelder
  name: Old Reliable
  description: An industrial welder with the names of past garage bosses engraved on its grip.

- type: entity
  parent: RubberStampApproved
  id: AtomCatsGarageStamp
  name: Atom Cats garage stamp
  description: The handle is a gearshift knob. The face stamps the garage name in teal ink.
  components:
  - type: Stamp
    stampedName: atom-cats-garage-stamp
    stampedColor: "#50B8B0"

- type: entity
  parent: RollerBedSpawnFolded
  id: AtomCatsCompactStretcher
  name: compact stretcher
  description: An oilcloth sling on folding steel rails. A Tattoo Artist can carry it in a pocket between calls.
  components:
  - type: Item
    size: Small

- type: entity
  parent: ClothingBeltNCRBandolier
  id: AtomCatsMedicalBandolier
  name: Atom Cats medical bandolier
  description: A worn leather bandolier with a copper cat stitched into the strap.

- type: entity
  parent: N14WeaponPistolM1911Custom
  id: AtomCatsEngravedPistol
  name: engraved garage .45
  description: The Boss's custom M1911 bears a pair of pointed cat ears engraved in the slide.

