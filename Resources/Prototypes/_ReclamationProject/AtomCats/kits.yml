  id: AtomCatsKitReliefChief
  name: Relief Chief kit
  description: 7.62mm marksman carbine and 9mm pistol. Includes two reloads per gun, boxed ammo, an MRE, and clean gauze. Also carries two stimpaks and a folding stretcher.
  components:
  - type: Sprite
    state: marksman
  - type: SpawnItemsOnUse
    items:
    - id: N14WeaponRifle762Marksman
    - id: N14WeaponPistol9mm
    - id: Magazine762Rifle
      amount: 2
    - id: N14MagazinePistol9mm
      amount: 2
    - id: MagazineBox762
    - id: MagazineBox9mm
    - id: N14BoxCardboardMREBoxCFilled
    - id: N14CleanGauze10
    - id: N14Stimpak
      amount: 2
    - id: RollerBedSpawnFolded

- type: UndecidedLoadoutBackpackSet
  id: AtomCatsKitReliefChiefSet
  name: atom-cats-kit-relief-chief-name
  description: atom-cats-kit-relief-chief-description
  sprite:
    sprite: _Nuclear14/Objects/Misc/kits.rsi
    state: marksman
  content: [AtomCatsKitReliefChief]

