- type: entity
  parent: BaseItem
  id: AtomCatsStencilCan
  name: Atom Cats bottomless stencil can
  description: A garage sprayer with a carousel of stencils and a paint feed that never runs dry. Use it on T-45 or Raider plates, loose or mounted, and pick a finish.
  components:
  - type: Sprite
    sprite: Objects/Fun/spraycans.rsi
    state: rainbow
  - type: Item
    size: Small
    sprite: Objects/Tools/Hydroponics/sprays.rsi
  - type: ArmorStencilCan
    stencils:
    - AtomCatsPaintCherry
    - AtomCatsPaintCobalt
    - AtomCatsPaintMedic
    - AtomCatsPaintLowrider
    - AtomCatsPaintChecker
    - AtomCatsPaintVoltage
    - AtomCatsPaintSunliner
  - type: UserInterface
    interfaces:
      enum.RadialSelectorUiKey.Key:
        type: RadialSelectorMenuBUI
