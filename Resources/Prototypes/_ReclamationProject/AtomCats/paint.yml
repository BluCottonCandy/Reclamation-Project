- type: entity
  parent: SprayPaintWhite
  id: AtomCatsPaintMedic
  name: Blue Cross rescue stencil spray
  description: Ivory enamel and a cobalt cross for a rescue crew's armor. The stencil fits T-45 and Raider plates, loose or mounted.
  components:
  - type: Paint
    armorFinish: _ReclamationProject/Clothing/AtomCats/medic.rsi
    whitelist:
      components: [ModularPowerArmor, PowerArmorPlate]

