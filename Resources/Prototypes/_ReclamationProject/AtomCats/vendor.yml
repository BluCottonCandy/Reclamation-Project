- type: entity
  parent: Trademachine
  id: ReclamationSupplyAtomCatsVendor
  name: Atom Cats garage supply vendor
  description: A teal requisitions machine with a Cherry Bomb helmet on its door. The garage shares a 200-point account, starts with 50 points, and earns three per minute. Redeem supply crates here for 20, 50, or 100 points.
  components:
  - type: Sprite
    sprite: Structures/Machines/VendingMachines/ammo.rsi
    layers:
    - state: 'off'
      color: '#50b8b0'
    - sprite: _ReclamationProject/Clothing/AtomCats/red.rsi
      state: helmet-item
      offset: 0,0.18
  - type: AccessReader
    access:
    - - AtomCats
  - type: FactionSupplyVendor
    requireFactionJob: true
    jobRanks:
      AtomCatsLookout: 10
      AtomCatsGreaser: 20
      AtomCatsMuscle: 30
      AtomCatsTattooArtist: 35
      AtomCatsRocker: 40
      AtomCatsHotRod: 50
      AtomCatsUnderboss: 60
      AtomCatsBoss: 70
    equipmentRanks:
      N14WeaponSMG10mm: 20
      N14WeaponRevolver10mm: 20
      N14WeaponPistol10mm: 30
      N14WeaponShotgun: 30
      N14WeaponShotgunAuto: 30
      N14WeaponSMGAmerican180: 35
      N14WeaponSMG10mmSuppressed: 40
      N14WeaponRifle762Marksman: 40
      N14WeaponRevolver45-70Handcannon: 40
      AtomCatsRailroadRifle: 50
      N14WeaponSniper44LeverCarbine: 60
      N14WeaponRevolver44Magnum: 70
      AtomCatsEngravedPistol: 70
      N14WelderIndustrial: 20
      N14FireAxe: 20
      N14SledgeHammer: 30
      ClothingHandsGlovesColorYellow: 20
      AtomCatsCompactStretcher: 35
      AtomCatsMedicalBandolier: 35
      N14HandheldHealthAnalyzer: 35
      ReclamationTrainingManualCPR: 35
      ReclamationClothingBeltSurgicalFilled: 35
  - type: NcStore
    currencyWhitelist: ['Supply points: Atom Cats']
    buyPresets: [ReclamationSupplyAtomCatsBuy]
    sellPresets: [ReclamationSupplyAtomCatsSell]

