- type: construction
  id: ReclamationWoodenRoof
  name: wooden roof tile
  description: A roof tile made from two wood planks. Connected roof tiles need an anchored wooden support beside or beneath at least one tile. Unsupported tiles collapse after 30 seconds and return their wood. Requires a laid floor; prying up that floor also removes the roof.
  graph: ReclamationWoodenRoof
  startNode: start
  targetNode: roof
  category: construction-category-structures
  hide: false
  icon:
    sprite: Decals/Overlays/markups.rsi
    state: square
  objectType: Structure
  placementMode: SnapgridCenter
  canRotate: false
  canBuildInImpassable: true
  conditions:
  - !type:RoofFloorCondition

- type: constructionGraph
  id: ReclamationWoodenRoof
  start: start
  graph:
  - node: start
    edges:
    - to: roof
      steps:
      - material: WoodPlank
        amount: 2
        doAfter: 2
  - node: roof
    entity: ReclamationWoodenRoof

- type: entity
  parent: BaseStructure
  id: ReclamationWoodenRoof
  name: wooden roof tile
  description: A wooden roof supported by connected tiles and wooden support beams.
  components:
  - type: Sprite
    visible: false
    layers:
    - sprite: Decals/Overlays/markups.rsi
      state: square
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        layer: []
        mask: []
  - type: ConstructedRoof
  - type: IsRoof
  - type: Construction
    graph: ReclamationWoodenRoof
    node: roof
