# ---------------------------------------------------------------- Takahashi

# Diamond City's noodle-stand Protectron. Anyone can take it, whatever character they picked:
# jobEntity always spawns them as a Protectron, keeping their character's name (the cap wallet
# is saved under that name). The job is also in the Protectron species' restrictedJobs
# (_Misfits/Species/robot.yml) so Protectron characters can pick it too.
# He can only ever say "Nan-ni shimasho-ka?" and has a "Make Noodle Cup" power that costs 2 caps.
# jobEntity skips starting gear, so the noodle box comes from NoodleCupMaker.startingItem and
# the door access sits on his body (an entity's own Access counts for doors).
- type: job
  id: DiamondCityTakahashi
  setPreference: true
  weight: 60
  displayWeight: 60
  canBeAntag: false
  name: job-name-diamond-city-takahashi
  description: job-description-diamond-city-takahashi
  playTimeTracker: DiamondCityTakahashi
  icon: JobIconBorg
  supervisors: job-supervisors-diamond-city-mayor
  overwatchCategory: OverwatchRobotics
  jobEntity: N14PlayerSyntheticProtectron
  spawnLoadout: false
  applyTraits: false # robot accent traits would garble his one line
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - PlayerRobot
          - Wastelander
          - Townsfolk
      - type: ReplacementAccent
        accent: takahashi
      - type: NoodleCupMaker
        startingItem: RPBoxTakahashiNoodles
      - type: Access
        tags:
        - DiamondCity

- type: playTimeTracker
  id: DiamondCityTakahashi

