# #Reclamation Project - Diamond City jobs.
# Built fresh from the old Nuclear 14 Townsfolk jobs (which stay untouched).
# Security is a rank ladder: Recruit -> Guard -> Sergeant -> Chief. Each rank needs hours in
# the rank below OR enough total Diamond City time. Pins: diamond_city_rank_pins.yml.

# ---------------------------------------------------------------- Mayor

- type: job
  id: DiamondCityMayor
  setPreference: true
  weight: 100
  displayWeight: 100
  showBorderBelow: true
  canBeAntag: false
  name: job-name-diamond-city-mayor
  description: job-description-diamond-city-mayor
  playTimeTracker: DiamondCityMayor
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
      - Human
      - Courser
      - Ghoul
      - GhoulGlowing
    - !type:CharacterDepartmentTimeRequirement
      department: DiamondCity
      min: 54000 # 15 hours in Diamond City
  startingGear: DiamondCityMayorGear
  icon: "JobIconTownMayor"
  supervisors: job-supervisors-diamond-city-people
  access:
  - DiamondCity
  - DiamondCitySecurity
  - DiamondCityMayor
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Wastelander
          - Townsfolk

- type: startingGear
  id: DiamondCityMayorGear
  equipment:
    jumpsuit: N14ClothingUniformJumpsuitCheckered
    ears: DiamondCityClothingHeadset
    back: N14ClothingBackpackExplorer
    shoes: N14ClothingShoesBrown
    id: DiamondCityIDMayor
    pocket1: RadioHandheld
    wallet: N14WalletLottaCash
  innerClothingSkirt: N14ClothingUniformJumpskirtFalloutBlack
  storage:
    back:
    - N14BoxPlasticFilledWastelander

- type: playTimeTracker
  id: DiamondCityMayor

