# #Reclamation Project - Diamond City job spawn points, one per job.
# Diamond City is not mapped yet. Until these are placed, the jobs use the station fallback spawn.
# Once they are on the map, add alwaysUseSpawner: true to the jobs so late joiners use them too.

- type: entity
  parent: SpawnPointJobBase
  id: DiamondCitySpawnPointMayor
  name: Diamond City Mayor
  components:
  - type: SpawnPoint
    job_id: DiamondCityMayor
  - type: Sprite
    sprite: _Nuclear14/Markers/Jobs/town.rsi
    layers:
      - state: green
      - state: mayor

