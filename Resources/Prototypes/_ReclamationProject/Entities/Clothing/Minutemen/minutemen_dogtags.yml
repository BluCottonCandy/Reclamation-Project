# #Reclamation Project Add - One set of dogtags per Minutemen rank.
# They look the same as MinutemenIDDogtags (the Recruit set). Each is preset to its own rank because
# PresetIdCardSystem re-applies the preset job to every preset ID at round start on extended-access
# (low-pop) rounds. With one shared set, every rank would drop to Recruit access and title.

- type: entity
  parent: MinutemenIDDogtags
  id: MinutemenIDDogtagsPrivate
  suffix: Private
  components:
  - type: PresetIdCard
    job: MinutemenPrivate

- type: entity
  parent: MinutemenIDDogtags
  id: MinutemenIDDogtagsCorporal
  suffix: Corporal
  components:
