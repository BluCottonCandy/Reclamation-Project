# #Reclamation Project - Minutemen rank pins.
# NCR rank names and NCR pin art (state choices match the NCR pins), handed out by
# minutemen_rank_pin_progressions.yml on the Enclave-style 20 hour ladder.
# pins.rsi has no Lt Colonel, Colonel or General art, so those borrow major/captain like the Enclave pins.

# Base Minutemen pin — all others inherit from this.
- type: entity
  parent: ClothingNeckPinBase
  id: ClothingNeckPinMinutemenRecruit
  name: Minutemen recruit pin
  description: A Commonwealth Minutemen badge showing the wearer's rank.
  components:
  - type: RankTitle
    rankTitle: Recruit
  - type: Sprite
    sprite: _Nuclear14/Clothing/Neck/Misc/pins.rsi
    layers:
    - state: recruit
  - type: Clothing
    sprite: _Nuclear14/Clothing/Neck/Misc/pins.rsi
    clothingVisuals:
      neck:
      - state: empty-equipped
  # The supermutant neck slot only accepts SuperMutantWearable; tagging the base covers the whole set.
  - type: Tag
    tags:
    - SuperMutantWearable

