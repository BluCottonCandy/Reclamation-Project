# #Reclamation Project Add - Minutemen job spawn points, one per rank.
# On Wendover they sit at the old NCR base for now; map them into the Castle when it exists.
# The Minutemen jobs use alwaysUseSpawner, so late joiners spawn here too.

- type: entity
  parent: SpawnPointJobBase
  id: MinutemenSpawnPointRecruit
  name: Minutemen Recruit
  components:
  - type: SpawnPoint
    job_id: MinutemenRecruit
  - type: Sprite
    sprite: _Nuclear14/Markers/Jobs/mounties.rsi
    layers:
      - state: green
      - state: skirmisher

