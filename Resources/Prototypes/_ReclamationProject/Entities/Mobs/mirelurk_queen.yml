- type: damageModifierSet
  id: ReclamationMirelurkQueenShell
  coefficients:
    Blunt: 0.5
    Slash: 0.5
    Piercing: 0.5
    Heat: 0.5

- type: entity
  parent: N14MobMirelurk
  id: ReclamationMobMirelurkQueen
  name: mirelurk queen
  description: An enormous, relentless mirelurk with a dark, spiked shell and vicious claws.
  components:
  - type: Sprite
    scale: 1.7, 1.7
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: mirelurk
      sprite: _ReclamationProject/Mobs/mirelurk_queen.rsi
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 5.5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.5
        density: 20
        mask: [MobMask]
        layer: [MobLayer]
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Dead
  - type: Ungibbable
  - type: Damageable
    damageModifierSet: ReclamationMirelurkQueenShell
  - type: Reflect
    reflects: [SmallCaliber, MediumCaliber, Energy]
    reflectProb: 0.3
    reflectProbByType:
      SmallCaliber: 0.5
      MediumCaliber: 0.4
      Energy: 0.5
    innate: true
  - type: SlowOnDamage
    speedModifierThresholds: {}
  - type: MirelurkQueenCharge
    cooldown: 4
    windup: 1
    staminaDamage: 100
  - type: MeleeChargeAudio
  - type: HTN
    rootTask:
      task: ReclamationMirelurkQueenCombatCompound
    blackboard:
      MeleeWideAttack: !type:Bool true
      MeleeMissChance: !type:Single 0
      MeleeRange: !type:Single 3
  - type: MeleeWeapon
    attackRate: 0.6666667 # 1.5 attacks per second: 25% slower than two per second.
    range: 1.5
    heavyRangeModifier: 2
    heavyRateModifier: 1
    heavyStaminaCost: 0
    damage:
      types:
        Blunt: 20
        Slash: 30
        Piercing: 0
  - type: Butcherable
    spawned:
    - id: ReclamationMobBabyMirelurk
      amount: 4
      prob: 1.0
    - id: N14FoodMeatMirelurkClaw
      amount: 2
      prob: 0.8
    - id: ReclamationMirelurkQueenCarapace
      amount: 1
      prob: 1.0

- type: Tag
  id: ReclamationMirelurkQueenCarapace

- type: entity
  parent: ReclamationMirelurkCarapace
  id: ReclamationMirelurkQueenCarapace
  name: mirelurk queen carapace
  description: A large, dark shell plate covered in tough spikes. Required for crafting mirelurk shell armor.
  components:
  - type: Sprite
    sprite: _ReclamationProject/Mobs/queen_carapace.rsi
    state: icon
  - type: Item
    sprite: _ReclamationProject/Mobs/queen_carapace.rsi
  - type: Tag
    tags: [ReclamationMirelurkQueenCarapace]

- type: entity
  parent: N14MobMirelurk
  id: ReclamationMobBabyMirelurk
  name: baby mirelurk
  description: A pale pink mirelurk hatchling. Small, surprisingly tough, and alarmingly quick.
  components:
  - type: Sprite
    sprite: Mobs/Animals/mothroach.rsi
    scale: 0.5, 0.5
    color: "#FFD0DF"
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: mothroach
      sprite: Mobs/Animals/mothroach.rsi
  - type: SpriteMovement
    movementLayers:
      movement:
        state: mothroach-moving
    noMovementLayers:
      movement:
        state: mothroach
  - type: DamageStateVisuals
    states:
      Alive:
        Base: mothroach
      Critical:
        Base: mothroach_dead
      Dead:
        Base: mothroach_dead
  - type: Reflect
    reflects: [None]
    reflectProb: 0
    reflectProbByType:
      SmallCaliber: 0
      MediumCaliber: 0
      Energy: 0
  - type: MovementSpeedModifier
    baseWalkSpeed: 6
    baseSprintSpeed: 8
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.15
        density: 20
        mask: [SmallMobMask]
        layer: [SmallMobLayer]
  - type: MobThresholds
    thresholds:
      0: Alive
      160: Dead
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 0
        Slash: 2
        Piercing: 8
  - type: Butcherable
    spawned:
    - id: N14FoodMeatMirelurkClaw
      amount: 1
      prob: 0.8

# The queen pursues her target without the normal melee NPC juking task.
- type: htnCompound
  id: ReclamationMirelurkQueenCombatCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: NearbyMeleeTargets
    - !type:HTNCompoundTask
      task: ReclamationMirelurkQueenAttackTargetCompound

- type: htnCompound
  id: ReclamationMirelurkQueenAttackTargetCompound
  branches:
  - preconditions:
    - !type:KeyExistsPrecondition
      key: Target
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        shutdownState: PlanFinished
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: TargetCoordinates
        pathfindKey: TargetPathfind
        rangeKey: MeleeRange
    - !type:HTNPrimitiveTask
      operator: !type:MeleeOperator
        targetKey: Target
      preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      - !type:TargetInRangePrecondition
        targetKey: Target
        rangeKey: MeleeRange
      services:
      - !type:UtilityService
        id: MeleeService
        proto: NearbyMeleeTargets
        key: Target
