- type: entity
  parent: PaintBase
  id: SprayPaintSageGreen
  name: sage green spray paint
  description: A tin of muted sage green spray paint.
  components:
  - type: Sprite
    sprite: Objects/Fun/spraycans.rsi
    layers:
    - state: spray
      map: ["Base"]
    - state: spray_cap_colors
      map: ["enum.OpenableVisuals.Layer"]
      color: "#9CAF88"
  - type: Paint
    color: "#9CAF88"
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {state: "spray_colors", color: "#9CAF88"}
          False: {state: "spray_cap_colors", color: "#9CAF88"}

