  name: Minute Men heavy pistol kit
  description: "A pistol for when you need something with a bit more punch. Contains 1 loaded 12.7mm pistol, 2 spare 12.7mm magazines, 1 MRE kit, 1 stimpak, 1 roll of clean gauze (10 uses), and 1 military carrier."
