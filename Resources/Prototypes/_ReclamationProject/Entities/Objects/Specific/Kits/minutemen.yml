- type: entity
  parent: KitBase
  id: MinutemenKitMedic
  name: Minute Men field medic kit
  description: "Keep your men alive. Contains 1 MRE kit, 1 military carrier, 1 compact defibrillator, and 1 stocked medical belt. The belt holds 2 rolls of clean gauze (10 uses each), 1 ointment stack (10 uses), 1 stimpak, 1 antidote syringe, 1 RadAway blood bag, and 1 blood pack."
  components:
  - type: Sprite
    state: medic
  - type: SpawnItemsOnUse
    items:
    - id: N14BoxCardboardMREBoxCFilled
    - id: ClothingBeltMilitary
    - id: N14ClothingBeltMedicalFilled
    - id: DefibrillatorCompact
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: UndecidedLoadoutBackpackSet
  id: MinutemenKitSetMedic
  name: minutemen-kit-medic-name
  description: minutemen-kit-medic-description
  sprite:
    sprite: _Nuclear14/Objects/Misc/kits.rsi
    state: medic
  content:
  - MinutemenKitMedic

