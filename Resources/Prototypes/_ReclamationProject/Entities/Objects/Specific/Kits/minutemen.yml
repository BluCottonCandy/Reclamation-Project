# Minute Men physical equipment kits. Choose one kit; opening it consumes the box.

- type: entity
  parent: KitBase
  id: MinutemenKitLaser
  name: Minute Men basic laser kit
  description: "The basics of the basics: enough to get you through and keep you alive. Standard issue for all Minute Men. Contains 1 makeshift laser revolver with a loaded energy cell, 2 spare small energy cells, 1 MRE kit, 1 stimpak, 1 roll of clean gauze (10 uses), and 1 military carrier."
  components:
  - type: Sprite
    state: rifleman
  - type: SpawnItemsOnUse
    items:
    - id: N14BoxCardboardMREBoxCFilled
    - id: N14Stimpak
    - id: N14CleanGauze10
    - id: ClothingBeltMilitary
    - id: N14WeaponLaserRevolver
    - id: N14PowerCellSmall
    - id: N14PowerCellSmall
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: UndecidedLoadoutBackpackSet
  id: MinutemenKitSetLaser
  name: minutemen-kit-laser-name
  description: minutemen-kit-laser-description
  sprite:
    sprite: _Nuclear14/Objects/Misc/kits.rsi
    state: rifleman
  content:
  - MinutemenKitLaser

