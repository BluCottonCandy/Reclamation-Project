- type: entity
  parent: KitBase
  id: MinutemenKitRiotSpecialist
  name: Riot Specialist
  description: 'You know how to handle large groups. Push them back! Contains: a paladin shield, a Minutemen trooper cutlass,
    a loaded blowback shotgun, two boxes of 12-gauge shells, medium trooper armor, two stimpaks, a smoke grenade, a tear gas grenade,
    and an MRE box. Also includes a night-vision trooper helmet.'
