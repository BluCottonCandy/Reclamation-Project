- type: entity
  parent: KitBase
  id: ReclamationWastelanderKitHunter
  name: Hunter
  description: "You are skilled at finding and eating about anything in the Wastes. Contains a makeshift hunting rifle, one box of .308 ammunition, one bottle of water, and one can of tuna."
  components:
  - type: Sprite
    state: marksman
  - type: SpawnItemsOnUse
    items:
    - id: N14WeaponSniperHuntingMakeshift
    - id: MagazineBox308
    - id: DrinkWaterBottleFull
    - id: ReclamationFoodCannedTuna
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: UndecidedLoadoutBackpackSet
  id: ReclamationWastelanderSetHunter
  name: wastelander-kit-hunter-name
  description: wastelander-kit-hunter-description
  sprite:
    sprite: _Nuclear14/Objects/Misc/kits.rsi
    state: marksman
  content:
  - ReclamationWastelanderKitHunter

- type: entity
  parent: KitBase
  id: ReclamationWastelanderKitDoc
  name: Wasteland Doc
  description: "You are the only thing that stands between death and your patient. Contains a single-use CPR training manual, a makeshift 9mm pistol, one box of 9mm ammunition, a surgical duffel bag filled with surgical tools, one bottle of ethanol, and sterile latex gloves."
  components:
  - type: Sprite
    state: medic
  - type: SpawnItemsOnUse
    items:
    - id: ReclamationTrainingManualCPR
    - id: N14WeaponPistol9mmMakeshift
    - id: MagazineBox9mm
    - id: ClothingBackpackDuffelSurgeryFilled
    - id: N14Ethanol
    - id: ClothingHandsGlovesLatex
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: UndecidedLoadoutBackpackSet
  id: ReclamationWastelanderSetDoc
  name: wastelander-kit-doc-name
  description: wastelander-kit-doc-description
  sprite:
    sprite: _Nuclear14/Objects/Misc/kits.rsi
    state: medic
  content:
  - ReclamationWastelanderKitDoc

- type: entity
  parent: KitBase
  id: ReclamationWastelanderKitSurvivalist
  name: Survivalist
  description: "You know a thing or two, because you've survived a thing or two. Contains a makeshift .45-70 Gov revolver, one .45-70 speedloader, one box of .45-70 ammunition, one MRE box, and one folded bedroll."
  components:
  - type: Sprite
    state: rifleman
  - type: SpawnItemsOnUse
    items:
    - id: ReclamationWeaponRevolver4570Makeshift
    - id: SpeedLoader45-70
    - id: MagazineBox45-70
    - id: N14BoxCardboardMREBoxCFilled
    - id: N14BedrollFolded
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: UndecidedLoadoutBackpackSet
  id: ReclamationWastelanderSetSurvivalist
  name: wastelander-kit-survivalist-name
  description: wastelander-kit-survivalist-description
  sprite:
    sprite: _Nuclear14/Objects/Misc/kits.rsi
    state: rifleman
  content:
  - ReclamationWastelanderKitSurvivalist

- type: entity
  parent: KitBase
  id: ReclamationWastelanderKitMilitarySurplus
  name: Military Surplus
  description: "You found a treasure trove of guns, now it's time to use em. Contains a weapon choice box: choose two different makeshift guns, each supplied with one matching ammunition box. Makeshift laser weapons receive a matching energy cell box instead."
  components:
  - type: Sprite
    state: rifleman
  - type: SpawnItemsOnUse
    items:
    - id: ReclamationMilitarySurplusSelector
    sound:
      path: /Audio/Effects/unwrap.ogg

