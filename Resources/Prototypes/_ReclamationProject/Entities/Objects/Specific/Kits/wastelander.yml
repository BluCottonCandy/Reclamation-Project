  sprite:
    sprite: _Nuclear14/Objects/Misc/kits.rsi
    state: rifleman
  content:
  - ReclamationWastelanderKitMilitarySurplus

- type: entity
  parent: KitBase
  id: ReclamationWastelanderKitOutOfLuck
  name: Shit out of luck
