# Fuel magazines use the existing solution-ammunition provider, not batteries.
- type: entity
  name: base flamer fuel canister
  description: A refillable weapon canister holding 100 units of welding fuel.
  id: N14BaseFlamerFuel
  abstract: true
  parent: BaseItem
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Guns/Ammunition/Battery/Flame/flamerfuel.rsi
  - type: SolutionContainerManager
    solutions:
      fuel:
        maxVol: 100
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 100
  - type: RefillableSolution
    solution: fuel
  - type: DrawableSolution
    solution: fuel
  - type: DrainableSolution
    solution: fuel
  - type: ExaminableSolution
    solution: fuel
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.AmmoVisuals.HasAmmo:
        enum.PowerCellVisualLayers.Unshaded:
          True: { visible: true }
          False: { visible: false }

- type: entity
  name: flamer fuel canister
  description: A refillable weapon fuel canister. Fill with welding fuel.
  id: N14FlamerFuel
  suffix: Full
  parent: N14BaseFlamerFuel
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Guns/Ammunition/Battery/Flame/flamerfuel.rsi
    scale: 0.45, 0.45
    layers:
    - map: ["enum.PowerCellVisualLayers.Base"]
      state: empty
    - map: ["enum.PowerCellVisualLayers.Unshaded"]
      state: o3
      shader: unshaded
  - type: Tag
    tags: [N14FlamerFuel, N14AmmoCell]
  - type: SolutionAmmoProvider
    solutionId: fuel
    requiredReagent: WeldingFuel
    proto: BulletFlame
    fireCost: 1

- type: entity
  name: Incinerator fuel canister
  description: A refillable weapon fuel canister. Fill with welding fuel.
  id: N14EnrichedFlamerFuel
  suffix: Full
  parent: N14BaseFlamerFuel
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Guns/Ammunition/Battery/Flame/enrichedflamerfuel.rsi
    scale: 0.45, 0.45
    layers:
    - map: ["enum.PowerCellVisualLayers.Base"]
      state: empty
    - map: ["enum.PowerCellVisualLayers.Unshaded"]
      state: o3
      shader: unshaded
  - type: Tag
    tags: [N14EnrichedFlamerFuel, N14AmmoCell]
  - type: SolutionAmmoProvider
    solutionId: fuel
    requiredReagent: WeldingFuel
    proto: BulletIncinerator
    fireCost: 1
