  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Guns/Battery/heavy_laser_musket_icon.rsi
  - type: Item
    sprite: _ReclamationProject/Objects/Weapons/Guns/Battery/heavy_laser_musket.rsi
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/Guns/Battery/heavy_laser_musket.rsi
  - type: Gun
    minAngle: 6
    maxAngle: 10
  - type: GunWieldBonus
    minAngle: -5
    maxAngle: -9
  - type: GunDamageBonus
    hitscanProtoOverride: MinutemenHeavyLaserMusketBeam
  - type: CrankCharge
    maxCharges: 1
    crankDelay: 3
    crankCostFraction: 1
    bonusByCharge: [55]
