# #Reclamation Project Add - Minutemen laser musket.
# Six cranks take five seconds and cost half a shot of cell energy each.
# Damage by crank count (0–6): 22, 32, 42, 52, 62, 72, 122 Heat.

# Keep timed winding and firing settings local to this entity ID. The heavy
# musket and crank shotgun inherit the entity below.
- type: timedCrankCharge
  id: MinutemenWeaponLaserMusket
  crankDelay: 0.8333333
  fireRate: 2
  holdTime: 8

- type: hitscan
  id: MinutemenLaserMusketBeam
  damage:
    types:
      Heat: 22
  muzzleFlash:
    sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
    state: muzzle_beam_heavy
  travelFlash:
    sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
    state: beam_heavy
  impactFlash:
    sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
    state: impact_beam_heavy

- type: entity
  name: laser musket
  parent: N14BaseWeaponPowerCellMedium
  id: MinutemenWeaponLaserMusket
  description: A hand-cranked laser rifle the Minutemen build from salvage. Every turn of the crank packs more charge into the next shot, up to six turns.
  components:
  - type: Wieldable
  - type: GunWieldBonus
    minAngle: -24
    maxAngle: -50
  # World icon is a wider 40x32 RSI; held and worn art is the 32x32 RSI.
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Guns/Battery/laser_musket_icon.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Item
    sprite: _ReclamationProject/Objects/Weapons/Guns/Battery/laser_musket.rsi
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/Guns/Battery/laser_musket.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: N14MicrofusionCellRed
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
            - N14MicrofusionCell
  - type: Gun
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_ReclamationProject/Weapons/Guns/LaserMusket/laser_musket_fire.ogg
  # The beam sets the uncranked damage (22) and the heavy beam look; the cell only supplies charge.
  - type: GunDamageBonus
    hitscanProtoOverride: MinutemenLaserMusketBeam
  - type: CrankCharge
    maxCharges: 6
    crankDelay: 1.8
    crankCostFraction: 0.5
    bonusDamageType: Heat
    # Added to the beam's 22 for 1..6 cranks: 32, 42, 52, 62, 72, 122.
    bonusByCharge: [10, 20, 30, 40, 50, 100]
    crankSound:
      path: /Audio/_ReclamationProject/Weapons/Guns/LaserMusket/laser_musket_crank.ogg
  - type: FollowDistance
    backStrength: 5
  - type: StaticPrice
    price: 150
