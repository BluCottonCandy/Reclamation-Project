# #Reclamation Project - medieval weapons (RogueTown sprites provided by Chermaity)

- type: entity
  parent: RPMedievalBaseWeapon
  id: RPMedievalStoneAxe
  name: "stone axe"
  description: "A shaped stone head lashed to a wooden haft."
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Medieval/stone_axe.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: _ReclamationProject/Objects/Weapons/Medieval/stone_axe_held.rsi
  - type: MedievalHiRes
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/Medieval/stone_axe_held.rsi
    quickEquip: false
    slots:
    - Belt
  - type: MeleeWeapon
    attackRate: 1.0
    damage:
      types:
        Slash: 17
        Blunt: 6
        Structural: 7
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Sharp
  - type: StaticPrice
    price: 15

