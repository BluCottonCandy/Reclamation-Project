- type: entity
  parent: RPMedievalBaseWeapon
  id: RPMedievalNavaja
  name: "navaja"
  description: "A Spanish folding knife with a locking blade. Use it in hand to flick it open or shut. Open, a heavy slash leaves deep, bleeding cuts."
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Medieval/navaja.rsi
    layers:
    - state: icon
      map: [ base ]
  - type: Item
    size: Small
    sprite: _ReclamationProject/Objects/Weapons/Medieval/navaja_held.rsi
  - type: MedievalHiRes
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/Medieval/navaja_held.rsi
    quickEquip: false
    slots:
    - Belt
  - type: MeleeWeapon
    attackRate: 1.25
    damage:
      types:
        Blunt: 2
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Sharp
  - type: Tag
    tags:
    - Knife
  - type: ItemToggle
    soundActivate:
      path: /Audio/Weapons/Guns/Cock/sf_rifle_cock.ogg
    soundDeactivate:
      path: /Audio/Weapons/Guns/Cock/sf_rifle_cock.ogg
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Slash: 14
        Piercing: 8
    activatedSoundOnHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: MedievalLook
    onState: open
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MedievalLookVisuals.State:
        base:
          icon: { state: icon }
          open: { state: open }
  - type: MedievalHeavyAttack
    bleed: 4
  - type: StaticPrice
    price: 100

