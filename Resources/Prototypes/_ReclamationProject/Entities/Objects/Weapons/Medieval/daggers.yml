# #Reclamation Project - medieval weapons (RogueTown sprites provided by Chermaity)

- type: entity
  parent: RPMedievalBaseWeapon
  id: RPMedievalFlintKnife
  name: "flint knife"
  description: "A knapped stone blade lashed to a handle. The oldest tool there is."
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Medieval/flint_knife.rsi
    state: icon
  - type: Item
    size: Small
    sprite: _ReclamationProject/Objects/Weapons/Medieval/flint_knife_held.rsi
  - type: MedievalHiRes
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/Medieval/flint_knife_held.rsi
    quickEquip: false
    slots:
    - Belt
  - type: MeleeWeapon
    attackRate: 1.25
    damage:
      types:
        Slash: 10
        Piercing: 6
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Sharp
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 8
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: EmbedPassiveDamage
  - type: ThrowingAngle
    angle: 45
  - type: Tag
    tags:
    - Knife
  - type: StaticPrice
    price: 15

