# #Reclamation Project - medieval weapons (RogueTown sprites provided by Chermaity)

- type: entity
  parent: RPMedievalBaseWeapon
  id: RPMedievalMilitaryFlail
  name: "military flail"
  description: "A threshing flail turned weapon: a hafted bar with a studded iron striker on a chain."
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Medieval/military_flail.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: _ReclamationProject/Objects/Weapons/Medieval/military_flail_held.rsi
  - type: MedievalHiRes
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/Medieval/military_flail_held.rsi
    quickEquip: false
    slots:
    - Belt
  - type: MeleeWeapon
    attackRate: 0.85
    damage:
      types:
        Blunt: 29
    soundHit:
      path: /Audio/Weapons/genhit3.ogg
  - type: StaticPrice
    price: 60

