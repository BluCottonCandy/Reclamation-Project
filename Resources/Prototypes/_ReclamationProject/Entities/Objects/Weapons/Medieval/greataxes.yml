# #Reclamation Project - medieval weapons (RogueTown sprites provided by Chermaity)

- type: entity
  parent: RPMedievalBaseTwoHanded
  id: RPMedievalPollaxe
  name: "pollaxe"
  description: "An axe blade, a hammer back and a spike on a long haft. A knight's favourite."
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Medieval/pollaxe.rsi
    scale: 0.6, 0.6
    state: icon
  - type: Item
    size: Large
    sprite: _ReclamationProject/Objects/Weapons/Medieval/pollaxe_held.rsi
  - type: MedievalHiRes
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/Medieval/pollaxe_held.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: MeleeWeapon
    attackRate: 0.75
    range: 1.75
    damage:
      types:
        Slash: 13
        Blunt: 7
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Sharp
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 42
        Blunt: 11
        Structural: 44
  - type: StaticPrice
    price: 200

