# #Reclamation Project - medieval weapons (RogueTown sprites provided by Chermaity)

- type: entity
  parent: RPMedievalBaseTwoHanded
  id: RPMedievalLongsword
  name: "longsword"
  description: "A straight double-edged sword with a long grip for both hands."
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Medieval/longsword.rsi
    scale: 0.75, 0.75
    state: icon
  - type: Item
    size: Large
    sprite: _ReclamationProject/Objects/Weapons/Medieval/longsword_held.rsi
  - type: MedievalHiRes
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/Medieval/longsword_held.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: MeleeWeapon
    attackRate: 0.9
    range: 1.6
    damage:
      types:
        Slash: 16
        Piercing: 4
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Sharp
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 26
        Piercing: 8
  - type: StaticPrice
    price: 100

