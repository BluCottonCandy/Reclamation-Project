# #Reclamation Project - medieval weapons (RogueTown sprites provided by Chermaity)

- type: entity
  parent: RPMedievalBaseTwoHanded
  id: RPMedievalPoleMace
  name: "pole mace"
  description: "A flanged mace head on a long pole."
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Medieval/pole_mace.rsi
    scale: 0.605, 0.605
    state: icon
  - type: Item
    size: Large
    sprite: _ReclamationProject/Objects/Weapons/Medieval/pole_mace_held.rsi
  - type: MedievalHiRes
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/Medieval/pole_mace_held.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: MeleeWeapon
    attackRate: 0.8
    range: 2.0
    damage:
      types:
        Blunt: 12
        Piercing: 4
    soundHit:
      path: /Audio/Weapons/genhit3.ogg
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 34
        Piercing: 14
        Structural: 30
  - type: StaticPrice
    price: 100

