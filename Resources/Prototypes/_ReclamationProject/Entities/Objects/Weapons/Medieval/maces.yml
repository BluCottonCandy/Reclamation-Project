- type: entity
  parent: RPMedievalBaseWeapon
  id: RPMedievalElectrifiedMace
  name: "electrified mace"
  description: "A pre-war riot mace rebuilt with a wasteland battery pack. Use it in hand to switch the charge on; charged hits stun. While charged, a heavy swing knocks everyone it hits to the ground."
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Medieval/electrified_mace.rsi
    layers:
    - state: icon
      map: [ base ]
  - type: Item
    size: Normal
    sprite: _ReclamationProject/Objects/Weapons/Medieval/electrified_mace_held.rsi
  - type: MedievalHiRes
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/Medieval/electrified_mace_held.rsi
    quickEquip: false
    slots:
    - Belt
  - type: MeleeWeapon
    attackRate: 0.9
    damage:
      types:
        Blunt: 24
    soundHit:
      path: /Audio/Weapons/genhit3.ogg
  - type: ItemToggle
    soundActivate:
      path: /Audio/Weapons/egloves.ogg
    soundDeactivate:
      path: /Audio/Weapons/egloves.ogg
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Blunt: 20
        Shock: 6
    activatedSoundOnHit:
      path: /Audio/Weapons/egloves.ogg
  - type: ComponentToggler
    components:
    - type: StaminaDamageOnHit
      damage: 35
  - type: ItemTogglePointLight
  - type: PointLight
    enabled: false
    radius: 1.5
    energy: 1.5
    color: "#4cff4c"
  - type: MedievalLook
    onState: "on"
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MedievalLookVisuals.State:
        base:
          icon: { state: icon }
          "on": { state: "on" }
  - type: MedievalHeavyAttack
    knockdown: 2
  - type: StaticPrice
    price: 100
