# #Reclamation Project - medieval weapons (RogueTown sprites provided by Chermaity)

- type: entity
  parent: RPMedievalBaseWeapon
  id: RPMedievalSpikedClub
  name: "spiked club"
  description: "A club with nails driven through the head."
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Medieval/spiked_club.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: _ReclamationProject/Objects/Weapons/Medieval/spiked_club_held.rsi
  - type: MedievalHiRes
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/Medieval/spiked_club_held.rsi
    quickEquip: false
    slots:
    - Belt
  - type: MeleeWeapon
    attackRate: 1.0
    damage:
      types:
        Blunt: 15
    soundHit:
      path: /Audio/Weapons/genhit3.ogg
  - type: StaticPrice
    price: 15

