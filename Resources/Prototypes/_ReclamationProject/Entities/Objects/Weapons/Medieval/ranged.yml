    quickEquip: false
    slots:
    - Belt
  - type: MeleeWeapon
    attackRate: 1.0
    damage:
      types:
        Blunt: 2
    soundHit:
      path: /Audio/Weapons/genhit3.ogg
  - type: Gun
    fireRate: 0.8
    projectileSpeed: 20
    minAngle: 0
    maxAngle: 6
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/bolathrow.ogg
    soundEmpty: null
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,9,5
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
