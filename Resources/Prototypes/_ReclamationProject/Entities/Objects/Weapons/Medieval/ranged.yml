- type: entity
  parent: RPMedievalBaseWeapon
  id: RPMedievalArquebus
  name: "matchlock arquebus"
  description: "An early long gun fired by touching a smouldering match to the powder pan. Loud, slow and deadly. Loads lead musket balls. Fires from the hip, but wield it for a steady aim."
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Medieval/arquebus.rsi
    scale: 0.6, 0.6
    state: icon
  - type: Item
    size: Large
    sprite: _ReclamationProject/Objects/Weapons/Medieval/arquebus_held.rsi
  - type: MedievalHiRes
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/Medieval/arquebus_held.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: MeleeWeapon
    attackRate: 0.9
    damage:
      types:
        Blunt: 10
    soundHit:
      path: /Audio/Weapons/genhit3.ogg
  - type: Gun
    fireRate: 1
    minAngle: 0
    maxAngle: 20
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/sniper.ogg
  - type: UseDelayOnShoot
  - type: UseDelay
    delay: 6
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - RPMusketBall
    capacity: 1
    proto: null
    unspawnedCount: 0
    cycleable: false
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: GunWieldBonus
    minAngle: 0
    maxAngle: -14
  - type: Wieldable
    wieldedSpeedModifier: 0.85
  - type: StaticPrice
    price: 100

