# #Reclamation Project - medieval weapons (RogueTown sprites provided by Chermaity)

- type: entity
  parent: RPMedievalBaseTwoHanded
  id: RPMedievalSteelSpear
  name: "steel spear"
  description: "A leaf-bladed steel spear on an ash shaft."
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Medieval/steel_spear.rsi
    scale: 0.65, 0.65
    state: icon
  - type: Item
    size: Large
    sprite: _ReclamationProject/Objects/Weapons/Medieval/steel_spear_held.rsi
  - type: MedievalHiRes
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/Medieval/steel_spear_held.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: MeleeWeapon
    attackRate: 1.0
    range: 2.0
    damage:
      types:
        Piercing: 14
        Slash: 4
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Sharp
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 26
        Slash: 6
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 30
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: EmbedPassiveDamage
  - type: ThrowingAngle
    angle: 225
  - type: StaticPrice
    price: 100

