- type: entity
  parent: RPMedievalBaseTwoHanded
  id: RPMedievalLuggedSpear
  name: "ornate lugged spear"
  description: "An ornate spear with a pre-war capacitor in the shaft. Use it in hand to charge it, then it fires bolts of light."
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Medieval/lugged_spear.rsi
    scale: 0.6, 0.6
    layers:
    - state: icon
      map: [ base ]
  - type: Item
    size: Large
    sprite: _ReclamationProject/Objects/Weapons/Medieval/lugged_spear_held.rsi
  - type: MedievalHiRes
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/Medieval/lugged_spear_held.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: MeleeWeapon
    attackRate: 1.0
    range: 2.0
    damage:
      types:
        Piercing: 15
        Slash: 4
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Sharp
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 29
        Slash: 7
  - type: ItemToggle
    soundActivate:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: ItemTogglePointLight
  - type: PointLight
    enabled: false
    radius: 2
    energy: 1.5
    color: "#5ff0ff"
  - type: ComponentToggler
    components:
    - type: Gun
      fireRate: 0.75
      selectedMode: SemiAuto
      availableModes:
      - SemiAuto
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
    - type: BasicEntityAmmoProvider
      proto: RPMedievalLuggedSpearBolt
      capacity: 3
      count: 3
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 6
  - type: MedievalLook
    onState: "on"
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MedievalLookVisuals.State:
        base:
          icon: { state: icon }
          "on": { state: "on" }
  - type: StaticPrice
    price: 200

- type: entity
  parent: RPMedievalBaseTwoHanded
  id: RPMedievalFireLance
  name: "fire lance"
  description: "A spear with a bundle of oil-soaked straw tied below the head. Use it in hand to light it. While lit, a heavy swing sets everyone it hits on fire."
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Medieval/fire_lance.rsi
    scale: 0.619, 0.619
    layers:
    - state: icon
      map: [ base ]
  - type: Item
    size: Large
    sprite: _ReclamationProject/Objects/Weapons/Medieval/fire_lance_held.rsi
  - type: MedievalHiRes
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/Medieval/fire_lance_held.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: MeleeWeapon
    attackRate: 1.0
    range: 2.0
    damage:
      types:
        Piercing: 13
        Slash: 4
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Sharp
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 23
        Slash: 5
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 23
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: EmbedPassiveDamage
  - type: ThrowingAngle
    angle: 225
  - type: ItemToggle
    soundActivate:
      path: /Audio/Items/Lighters/lighter1.ogg
    soundDeactivate:
      path: /Audio/Items/Lighters/lighter_off.ogg
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Piercing: 13
        Slash: 4
        Heat: 11
  - type: ComponentToggler
    components:
    - type: IgniteOnMeleeHit
      fireStacks: 1
  - type: ItemTogglePointLight
  - type: PointLight
    enabled: false
    radius: 2.5
    energy: 2
    color: "#ff9a3c"
  - type: MedievalLook
    onState: lit
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MedievalLookVisuals.State:
        base:
          icon: { state: icon }
          lit: { state: lit }
  - type: MedievalHeavyAttack
    igniteStacks: 2
  - type: StaticPrice
    price: 60

