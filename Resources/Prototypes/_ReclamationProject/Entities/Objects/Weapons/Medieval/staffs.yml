# #Reclamation Project - medieval weapons (RogueTown sprites provided by Chermaity)

- type: entity
  parent: RPMedievalBaseTwoHanded
  id: RPMedievalWalkingStaff
  name: "knobbed walking staff"
  description: "A sturdy knobbed staff for walking, and for hitting things."
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Medieval/walking_staff.rsi
    scale: 0.684, 0.684
    state: icon
  - type: Item
    size: Large
    sprite: _ReclamationProject/Objects/Weapons/Medieval/walking_staff_held.rsi
  - type: MedievalHiRes
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/Medieval/walking_staff_held.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: MeleeWeapon
    attackRate: 1.3
    range: 1.75
    damage:
      types:
        Blunt: 8
    soundHit:
      path: /Audio/Weapons/genhit3.ogg
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 11
  - type: StaminaDamageOnHit
    damage: 10
  - type: StaticPrice
    price: 15

