# #Reclamation Project - medieval weapons (RogueTown sprites provided by Chermaity)

- type: entity
  parent: RPMedievalBaseWeapon
  id: RPMedievalY0KRapier
  name: "Y0K's rapier"
  description: "A slim blacksteel rapier, companion to Y0K's zweihänder. Light in the hand, for the days the big sword feels too heavy. Bent a hundred times, it always springs back true, just like the one who carries it."
  suffix: Y0K, unique
  categories: [ HideSpawnMenu ] # spawned through RPMedievalY0KCrate
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Medieval/y0_k_rapier.rsi
    scale: 0.6, 0.6
    state: icon
  - type: Item
    size: Normal
    sprite: _ReclamationProject/Objects/Weapons/Medieval/y0_k_rapier_held.rsi
  - type: MedievalHiRes
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/Medieval/y0_k_rapier_held.rsi
    quickEquip: false
    slots:
    - Belt
  - type: MeleeWeapon
    attackRate: 1.15
    range: 1.6
    damage:
      types:
        Piercing: 31
        Slash: 7
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Sharp
  - type: StaticPrice
    price: 600

