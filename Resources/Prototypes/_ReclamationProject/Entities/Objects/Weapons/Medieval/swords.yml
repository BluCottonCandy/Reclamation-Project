- type: entity
  parent: RPMedievalBaseWeapon
  id: RPMedievalCavalrySabre
  name: "cavalry sabre"
  description: "A curved trooper's sabre. This one has a coolant line run up the spine; use it in hand to frost the blade. While frosted, a heavy swing chills targets to half speed for a few seconds."
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Medieval/cavalry_sabre.rsi
    layers:
    - state: icon
      map: [ base ]
  - type: Item
    size: Normal
    sprite: _ReclamationProject/Objects/Weapons/Medieval/cavalry_sabre_held.rsi
  - type: MedievalHiRes
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/Medieval/cavalry_sabre_held.rsi
    quickEquip: false
    slots:
    - Belt
  - type: MeleeWeapon
    attackRate: 1.0
    damage:
      types:
        Slash: 33
        Piercing: 7
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Sharp
  - type: ItemToggle
    soundActivate:
      path: /Audio/Effects/spray2.ogg
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Slash: 29
        Piercing: 4
        Cold: 13
  - type: ItemTogglePointLight
  - type: PointLight
    enabled: false
    radius: 1.5
    energy: 1
    color: "#9fdcff"
  - type: MedievalLook
    onState: frost
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MedievalLookVisuals.State:
        base:
          icon: { state: icon }
          frost: { state: frost }
  - type: MedievalHeavyAttack
    slow: 4
    slowMultiplier: 0.5
  - type: StaticPrice
    price: 200

