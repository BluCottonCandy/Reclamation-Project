# #Reclamation Project - medieval weapons (RogueTown sprites provided by Chermaity)

- type: entity
  parent: RPMedievalBaseWeapon
  id: RPMedievalHurlbat
  name: "hurlbat"
  description: "An all-metal throwing axe, spiked on every end so something sharp always lands first."
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Medieval/hurlbat.rsi
    state: icon
  - type: Item
    size: Small
    sprite: _ReclamationProject/Objects/Weapons/Medieval/hurlbat_held.rsi
  - type: MedievalHiRes
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/Medieval/hurlbat_held.rsi
    quickEquip: false
    slots:
    - Belt
  - type: MeleeWeapon
    attackRate: 1.0
    damage:
      types:
        Slash: 12
        Blunt: 4
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Sharp
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 26
        Piercing: 8
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: EmbedPassiveDamage
  - type: ThrowingAngle
    angle: 45
  - type: StaticPrice
    price: 100

