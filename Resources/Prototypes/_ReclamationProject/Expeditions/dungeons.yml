- type: dungeonConfig
  id: ReclamationExperiment
  generator: !type:PrefabDunGen
    tile: FloorMS13WoodWide
    roomWhitelist: [ReclamationExperiment]
    presets: [Bucket, Wow, SpaceShip, Tall]
  postGeneration:
  - !type:CorridorPostGen
    tile: FloorMS13WoodWide
    width: 3
  - !type:RoomEntrancePostGen
    tile: FloorMS13WoodWide
    entities: [N14DoorWoodSecure]
  - !type:BoundaryWallPostGen
    tile: FloorMS13WoodWide
    wall: N14WallBrickSlanted
    cornerWall: N14WallBrickSlanted
  - !type:JunctionPostGen
    tile: FloorMS13WoodWide
    entities: [N14DoorWoodSecure]
    width: 1
  - !type:JunctionPostGen
    tile: FloorMS13WoodWide
    entities: [N14DoorWoodSecure]

