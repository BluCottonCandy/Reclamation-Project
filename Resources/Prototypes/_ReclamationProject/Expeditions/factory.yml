- type: entity
  parent: BaseItem
  id: FactoryRustyGear
  name: heavy rusty gear
  description: A massive corroded generator gear. Requires two free hands to carry and cannot be stored in bags or crates. Insert it into the generator.
  components:
  - type: Sprite
    sprite: _ReclamationProject/Expeditions/factory_gear.rsi
    state: icon
  - type: Item
    size: Ginormous
    sprite: _ReclamationProject/Expeditions/factory_gear.rsi
  - type: MultiHandedItem
    handsNeeded: 2
  - type: HeldSpeedModifier
    walkModifier: 0.5
    sprintModifier: 0.5
    applyWhenPulled: true
  - type: Physics
    bodyType: Dynamic
  - type: Pullable
  - type: FactoryGear

- type: entity
  parent: BaseStructure
  id: FactoryHugeGenerator
  name: pre-war generator
  description: A long-abandoned generator with an empty drive-gear socket. Insert the heavy rusty gear to open the secured vault.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Power/generator.rsi
    offset: 0.5, 0
    layers:
    - state: generator_off
      map: ["enum.GeneratorVisualLayers.Body"]
    - sprite: _ReclamationProject/Expeditions/factory_generator_belt.rsi
      state: moving
      visible: false
      map: ["installed-belt"]
    - sprite: _ReclamationProject/Expeditions/factory_generator_gear.rsi
      state: driven-idle
      map: ["driven-gear"]
    - sprite: _ReclamationProject/Expeditions/factory_generator_gear.rsi
      state: spinning
      visible: false
      map: ["installed-gear"]
    drawdepth: Mobs
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.GeneratorVisuals.Running:
        enum.GeneratorVisualLayers.Body:
          True: { state: generator_on }
          False: { state: generator_off }
        installed-gear:
          True: { visible: true }
          False: { visible: false }
        installed-belt:
          True: { visible: true }
          False: { visible: false }
        driven-gear:
          True: { state: driven-spinning }
          False: { state: driven-idle }
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      machine:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.1,1.2,0.5"
        density: 1000
        layer: [Impassable]
  - type: FactoryGenerator

- type: entity
  parent: N14DoorVault
  id: FactoryVaultDoor
  name: secured vault door
  description: Its motor will not move until the pre-war generator is running.
  components:
  - type: FactoryVaultDoor

- type: entity
  parent: MarkerBase
  id: FactoryGunLootSpawner
  name: expedition gun loot
  suffix: Random gun, 5% advanced expedition reward
  components:
  - type: Sprite
    layers:
    - state: blue
  - type: RandomSpawner
    offset: 0
    chance: 1
    rareChance: 0.05
    rarePrototypes:
    - N14WeaponRifle762Marksman
    - N14WeaponSMG12mmAdvanced
    - N14WeaponSMGGreaseGun
    - N14WeaponLaserRifle
    - N14WeaponLaserRifleAuto
    - N14WeaponLauncherMissile
    - N14WeaponMinigun
    - N14WeaponLaserGatling
    - N14WeaponRifleGrenade
    prototypes:
    - N14WeaponPistol9mm
    - N14WeaponPistol45Colt
    - N14WeaponSMG9mm
    - N14WeaponRifle556Carbine
    - N14WeaponRifle762M14

- type: entity
  parent: MarkerBase
  id: FactoryAdvancedGunLootSpawner
  name: expedition advanced gun loot
  suffix: Guaranteed advanced gun, old expedition reward pool
  components:
  - type: Sprite
    layers:
    - state: pink
  - type: RandomSpawner
    offset: 0
    rareChance: 0
    prototypes:
    - N14WeaponRifle762Marksman
    - N14WeaponSMG12mmAdvanced
    - N14WeaponSMGGreaseGun
    - N14WeaponLaserRifle
    - N14WeaponLaserRifleAuto
    - N14WeaponLauncherMissile
    - N14WeaponMinigun
    - N14WeaponLaserGatling
    - N14WeaponRifleGrenade

- type: entity
  parent: MarkerBase
  id: FactoryArmorLootSpawner
  name: expedition armor loot
  suffix: Random armor, old expedition armory pool
  components:
  - type: Sprite
    layers:
    - state: green
  - type: RandomSpawner
    offset: 0
    chance: 1
    rareChance: 0
    prototypes:
    - N14ClothingOuterLeatherArmor
    - N14ClothingOuterVestLeather
    - N14ClothingOuterMetalArmor
    - N14ClothingOuterCombatArmor
    - N14ClothingOuterRaiderBadlands
    - N14ClothingOuterRaiderBlastmaster
    - N14ClothingOuterRaiderCombat1
    - N14ClothingOuterRaiderCombat2

- type: entity
  parent: MarkerBase
  id: FactoryArrival
  name: expedition arrival
  components:
  - type: Sprite
    layers:
    - state: blue
  - type: FactoryArrival

- type: entity
  parent: MarkerBase
  id: FactoryReturnMarker
  name: expedition return destination
  components:
  - type: Sprite
    layers:
    - state: green

- type: entity
  parent: BaseStructure
  id: FactoryExtraction
  name: rusted escape ladder
  description: A weathered escape ladder. Use it to leave the expedition. Examine it to read the remaining mission time.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Misc/ladder.rsi
    noRot: true
    offset: 0, 0.25
    layers:
    - state: b_metal
    - state: b_rust
  - type: InteractionOutline
  - type: FactoryExit

- type: entity
  parent: FactoryExtraction
  id: FactoryDeparture
  name: expedition entrance
  description: An old expedition entrance. Choose a destination to begin a 20-minute expedition with everyone standing within three tiles.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Misc/laddersms13.rsi
    noRot: true
    offset: 0, 0.25
    layers:
    - state: ladder01
  - type: UserInterface
    interfaces:
      enum.N14ExpeditionBoardUiKey.Key:
        type: N14ExpeditionBoardBoundUserInterface
  - type: FactoryDeparture
    duration: 1200
    mapPool:
    - /Maps/Reclamation/Expeditions/Factory.yml
    - /Maps/Reclamation/Expeditions/Cave1.yml
    mediumMapPool:
    - /Maps/Reclamation/Expeditions/Factory2.yml
    hardMapPool:
    - /Maps/Reclamation/Expeditions/Factory3.yml

- type: entity
  parent: MarkerBase
  id: FactoryGlowingGhoulSpawner
  name: glowing ghoul boss spawner
  suffix: Guaranteed expedition leader
  components:
  - type: Sprite
    layers:
    - state: red
  - type: RandomSpawner
    offset: 0
    chance: 1
    rareChance: 0
    prototypes:
    - ReclamationExpeditionGlowingLeader
