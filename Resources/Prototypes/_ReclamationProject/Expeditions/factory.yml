- type: entity
  parent: BaseItem
  id: FactoryRustyGear
  name: heavy rusty gear
  description: A massive corroded generator gear. Requires two free hands to carry and cannot be stored in bags or crates. Insert it into the factory generator.
  components:
  - type: Sprite
    sprite: _ReclamationProject/Expeditions/factory_gear.rsi
    state: icon
  - type: Item
    size: Ginormous
    sprite: _ReclamationProject/Expeditions/factory_gear.rsi
  - type: MultiHandedItem
    handsNeeded: 2
  - type: HeldSpeedModifier
    walkModifier: 0.5
    sprintModifier: 0.5
  - type: PullSpeedModifier
    walkModifier: 0.5
    sprintModifier: 0.5
  - type: Physics
    bodyType: Dynamic
  - type: Pullable
  - type: FactoryGear

- type: entity
  parent: BaseStructure
  id: FactoryHugeGenerator
  name: huge rusted factory generator
  description: A long-abandoned generator with an empty drive-gear socket. Insert the heavy rusty gear to open the factory vault.
  components:
  - type: Sprite
    sprite: _ReclamationProject/Expeditions/factory_generator.rsi
    state: icon
    drawdepth: Mobs
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      machine:
        shape: !type:PhysShapeAabb
          bounds: "-0.8,-0.5,0.8,0.5"
        density: 1000
        layer: [Impassable]
  - type: FactoryGenerator

- type: entity
  parent: N14DoorVault
  id: FactoryVaultDoor
  name: factory vault door
  description: Its motor will not move until the huge generator is running.
  components:
  - type: FactoryVaultDoor

- type: entity
  parent: MarkerBase
  id: FactoryGunLootSpawner
  name: factory expedition gun loot
  suffix: Random gun, 5% advanced expedition reward
  components:
  - type: RandomSpawner
    offset: 0
    chance: 1
    rareChance: 0.05
    rarePrototypes:
    - N14WeaponRifle762Marksman
    - N14WeaponSMG12mmAdvanced
    - N14WeaponSMGGreaseGun
    - N14WeaponLaserRifle
    - N14WeaponLaserRifleAuto
    - N14WeaponLauncherMissile
    - N14WeaponMinigun
    - N14WeaponLaserGatling
    - N14WeaponRifleGrenade
    prototypes:
    - N14WeaponPistol9mm
    - N14WeaponPistol45Colt
    - N14WeaponSMG9mm
    - N14WeaponRifle556Carbine
    - N14WeaponRifle762M14

- type: entity
  parent: MarkerBase
  id: FactoryAdvancedGunLootSpawner
  name: factory expedition advanced gun loot
  suffix: Guaranteed advanced gun, old expedition reward pool
  components:
  - type: RandomSpawner
    offset: 0
    rareChance: 0
    prototypes:
    - N14WeaponRifle762Marksman
    - N14WeaponSMG12mmAdvanced
    - N14WeaponSMGGreaseGun
    - N14WeaponLaserRifle
    - N14WeaponLaserRifleAuto
    - N14WeaponLauncherMissile
    - N14WeaponMinigun
    - N14WeaponLaserGatling
    - N14WeaponRifleGrenade

- type: entity
  parent: MarkerBase
  id: FactoryArmorLootSpawner
  name: factory expedition armor loot
  suffix: Random armor, old expedition armory pool
  components:
  - type: RandomSpawner
    offset: 0
    chance: 1
    rareChance: 0
    prototypes:
    - N14ClothingOuterLeatherArmor
    - N14ClothingOuterVestLeather
    - N14ClothingOuterMetalArmor
    - N14ClothingOuterCombatArmor
    - N14ClothingOuterRaiderBadlands
    - N14ClothingOuterRaiderBlastmaster
    - N14ClothingOuterRaiderCombat1
    - N14ClothingOuterRaiderCombat2

- type: entity
  parent: MarkerBase
  id: FactoryArrival
  name: factory expedition arrival
  components:
  - type: FactoryArrival

- type: entity
  parent: MarkerBase
  id: FactoryReturnMarker
  name: factory return destination

- type: entity
  parent: BaseStructure
  id: FactoryExtraction
  name: rusted escape ladder
  description: A rusty ladder leading back outside. Use it to leave the factory. Examine it to read the remaining mission time.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Misc/ladder.rsi
    noRot: true
    offset: 0, 0.25
    layers:
    - state: b_metal
    - state: b_rust
  - type: InteractionOutline
  - type: FactoryExit

- type: entity
  parent: FactoryExtraction
  id: FactoryDeparture
  name: factory expedition departure
  description: An old expedition entrance. Choose a destination to begin a 20-minute expedition with everyone standing within three tiles.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Misc/laddersms13.rsi
    noRot: true
    offset: 0, 0.25
    layers:
    - state: ladder01
  - type: UserInterface
    interfaces:
      enum.N14ExpeditionBoardUiKey.Key:
        type: N14ExpeditionBoardBoundUserInterface
  - type: FactoryDeparture
    duration: 1200
