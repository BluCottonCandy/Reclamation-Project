# Expedition-only bodies fit one-tile passages; inherited sprites keep their full size.
- type: entity
  parent: N14MobSuperMutantNPC
  id: ReclamationExpeditionSuperMutantNPC
  suffix: Expedition, narrow collision
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.35
        density: 150
        mask:
        - MobMask
        layer:
        - MobLayer

