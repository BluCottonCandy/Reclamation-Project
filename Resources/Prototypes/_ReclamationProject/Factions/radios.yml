- type: radioChannel
  id: Forged
  name: chat-radio-forged
  keycode: 'q'
  frequency: 1518
  color: "#D4783B"
  longRange: true

- type: entity
  parent: EncryptionKeyEighties
  id: EncryptionKeyForged
  name: Forged encryption key
  description: A radio encryption key for private Forged communication.
  components:
  - type: EncryptionKey
    channels: [Forged]
    defaultChannel: Forged

- type: entity
  parent: MisfitsClothingHeadsetEighties
  id: ForgedHeadset
  name: Forged headset
  description: A salvaged headset fitted with a Forged encryption key and wasteland radio access.
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyWastelandGlobal
      - EncryptionKeyForged

- type: radioChannel
  id: Triggermen
  name: chat-radio-triggermen
  keycode: 'j'
  frequency: 1519
  color: "#B8B8B8"
  longRange: true

- type: entity
  parent: EncryptionKeyEighties
  id: EncryptionKeyTriggermen
  name: Triggermen encryption key
  description: A radio encryption key for private Triggermen communication.
  components:
  - type: EncryptionKey
    channels: [Triggermen]
    defaultChannel: Triggermen

- type: entity
  parent: MisfitsClothingHeadsetEighties
  id: TriggermenHeadset
  name: Triggermen headset
  description: A salvaged headset fitted with a Triggermen encryption key and wasteland radio access.
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyWastelandGlobal
      - EncryptionKeyTriggermen

