- type: Tag
  id: ForgedWorkerAutoAxe

- type: entity
  parent: BaseItem
  id: ForgedWorkerAutoAxe
  name: laborer's auto axe
  description: A worn industrial cutting and mining tool issued to captive workers. Its battered blade is deliberately poor at fighting. Requires two hands and slows movement by 10% while wielded. It can be rebuilt into a deadly auto axe through the crafting menu.
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Melee/auto_axe_worker.rsi
    state: icon
  - type: Item
    sprite: _ReclamationProject/Objects/Weapons/Melee/auto_axe_worker.rsi
    size: Huge
  - type: Wieldable
    freeHandsRequired: 1
    wieldedSpeedModifier: 0.9
    wieldSound:
      path: /Audio/Weapons/chainsawwield.ogg
      params:
        volume: -3
  - type: MeleeRequiresWield
  - type: Sharp
  - type: DamageExaminable
  - type: MeleeWeapon
    autoAttack: true
    disableHeavy: false
    angle: 100
    maxTargets: 3
    heavyRateModifier: 1
    heavyDamageBaseModifier: 1
    range: 1.5
    attackRate: 1
    damage:
      types:
        Slash: 5
        Blunt: 5
    soundHit:
      path: /Audio/Weapons/chainsaw.ogg
      params:
        volume: -3
  - type: DisarmMalus
  - type: Tool
    qualities: [Sawing]
    speedModifier: 3
  - type: Tag
    tags: [ForgedWorkerAutoAxe, Pickaxe]

- type: entity
  parent: ForgedWorkerAutoAxe
  id: ForgedDeadlyAutoAxe
  name: deadly auto axe
  description: A rebuilt industrial cutting and mining tool with an oversized toothed cutter, reinforced housing, and exposed blue coolant lines, jagged blades, and scrap reinforcement. Requires two hands and slows movement by 10% while wielded.
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Melee/auto_axe_deadly.rsi
    state: icon
  - type: Item
    sprite: _ReclamationProject/Objects/Weapons/Melee/auto_axe_deadly.rsi
  - type: Construction
    graph: ForgedDeadlyAutoAxe
    node: finished
  - type: MeleeWeapon
    attackRate: 2
    damage:
      types:
        Slash: 45
        Blunt: 20
        Structural: 50
  - type: Tag
    tags: [Pickaxe]

- type: construction
  id: ForgedDeadlyAutoAxe
  hide: false
  name: deadly auto axe
  description: Rebuild a laborer's auto axe with 50 steel and 10 iron bars.
  graph: ForgedDeadlyAutoAxe
  startNode: start
  targetNode: finished
  category: construction-category-weapons
  icon:
    sprite: _ReclamationProject/Objects/Weapons/Melee/auto_axe_deadly.rsi
    state: icon
  objectType: Item

- type: constructionGraph
  id: ForgedDeadlyAutoAxe
  start: start
  graph:
  - node: start
    edges:
    - to: finished
      steps:
      - tag: ForgedWorkerAutoAxe
        name: laborer's auto axe
        icon:
          sprite: _ReclamationProject/Objects/Weapons/Melee/auto_axe_worker.rsi
          state: icon
        doAfter: 2
      - material: Steel
        amount: 50
        doAfter: 5
      - material: N14Iron
        amount: 10
        doAfter: 3
  - node: finished
    entity: ForgedDeadlyAutoAxe
