# Unpowered Furnace Armor: ordinary protection, with no power-armor integrity pool.
- type: entity
  parent: ClothingOuterHardsuitBase
  id: ForgedFurnaceArmor
  name: Forged Furnace Armor
  description: A furnace-blackened suit of salvaged armor assembled by the Forged. Stripped-down servos and heavy flame-resistant plating make it slow but dependable. It needs neither power-armor training nor a fusion core. Its lining provides strong flame resistance, with modest protection from laser heat.
  categories: []
  components:
  - type: N14PowerArmor
    requiresProficiency: false
  - type: N14BosBackpackSlot
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: HeldSpeedModifier
    mirrorClothingModifier: false
    walkModifier: 0.5
    sprintModifier: 0.5
  - type: MultiHandedItem
  - type: UserInterface
    interfaces:
      enum.ToggleClothingUiKey.Key:
        type: ToggleableClothingBoundUserInterface
  - type: EmitsSoundOnMove
    soundCollection:
      collection: N14FootstepPowerArmor
      params:
        volume: -6
    requiresWorn: true
    distanceWalking: 2
    distanceSprinting: 3
  - type: Sprite
    sprite: _ReclamationProject/Clothing/OuterClothing/forged_furnace.rsi
  - type: Clothing
    sprite: _ReclamationProject/Clothing/OuterClothing/forged_furnace.rsi
    equipDelay: 6
    unequipDelay: 6
    equipSound:
      path: /Audio/_Nuclear14/Effects/PowerArmor/PowerArmor_Enter_01.ogg
      params:
        volume: -12
    unequipSound:
      path: /Audio/_Nuclear14/Effects/PowerArmor/PowerArmor_Enter_01.ogg
      params:
        volume: -12
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.65
        Heat: 0.85
        Caustic: 0.80
        Radiation: 0.70
  - type: ExplosionResistance
    damageCoefficient: 0.80
    modifiers:
      IncineratorExplosion: 0.05
  # Flame protection is separate from ordinary heat (laser) armor.
  - type: FireProtection
    reduction: 0.95
    maximumReduction: 0.95
  - type: TemperatureProtection
    coefficient: 0.25
  # No passive projectile reflection.
  - type: Reflect
    reflects: None
    reflectProb: 0
    minReflectProb: 0
    reflectProbByType: {}
    innate: false
  - type: ToggleableClothing
    requiredSlot: outerClothing
    blockUnequipWhenAttached: true
    replaceCurrentClothing: false
    clothingPrototypes:
      head: ForgedFurnaceHelmet
      gloves: N14ClothingPAGauntletsDark
      shoes: N14ClothingPABootsDark

- type: entity
  parent: N14ClothingHeadHelmetPowerArmorT45
  id: ForgedFurnaceHelmet
  name: Forged furnace helmet
  description: An enclosed T-45 helmet rebuilt for the Forged's furnace crews and raiding parties.
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.65
        Heat: 1
        Radiation: 0.695
  - type: ExplosionResistance
    damageCoefficient: 0.945

- type: entity
  parent: ForgedFurnaceArmor
  id: ForgedKeeperFurnaceArmor
  name: Forge Keeper's Furnace Armor
  description: Reinforced furnace-blackened armor reserved for the Forge Keeper. Its heavy plates provide protection without a separate integrity pool, fusion core, or training requirement. Its lining provides strong flame resistance, with modest protection from laser heat.
  components:
  - type: ClothingSpeedModifier
    walkModifier: 0.80
    sprintModifier: 0.80
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.55
        Slash: 0.55
        Piercing: 0.55
        Heat: 0.85
        Caustic: 0.80
        Radiation: 0.70
  - type: ExplosionResistance
    damageCoefficient: 0.70
  - type: ToggleableClothing
    clothingPrototypes:
      head: ForgedKeeperFurnaceHelmet
      gloves: N14ClothingPAGauntletsDark
      shoes: N14ClothingPABootsDark

- type: entity
  parent: ForgedFurnaceHelmet
  id: ForgedKeeperFurnaceHelmet
  name: Forge Keeper's furnace helmet
  description: A reinforced furnace helmet reserved for the Forge Keeper.
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.55
        Slash: 0.55
        Piercing: 0.55
        Heat: 1
        Radiation: 0.695
