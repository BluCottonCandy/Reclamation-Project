- type: entity
  parent: N14ClothingOuterFirefighterSuit
  id: ForgedTenderSuit
  name: reinforced furnace suit
  description: A reinforced fire-resistant suit worn by the Forged's furnace tenders.
  components:
  - type: FireProtection
    reduction: 0
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.70
        Slash: 0.80
        Piercing: 0.80
        Heat: 0.40
        Radiation: 0.25

# Local balance candidate: stronger floor fire, leaving other fire sources unchanged.
- type: entity
  parent: N14WeaponFlamer
  id: ForgedWeaponFlamer
  name: Forged flamer
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Guns/forged_flamer.rsi
    layers:
    - state: base
  - type: Item
    sprite: _ReclamationProject/Objects/Weapons/Guns/forged_flamer.rsi
    size: Large
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/Guns/forged_flamer.rsi
    quickEquip: false
    slots: [Back, suitStorage]
  - type: Gun
    soundGunshot:
      path: /Audio/_Nuclear14/Weapons/Guns/Flames/flamer.ogg
      params:
        volume: 3
  - type: Wieldable
  - type: GunRequiresWield
  # A sealed weapon tank must not detonate when its wielder catches their own fire.
  - type: VolatileFuelContainer
    igniteChance: 0
    shotChance: 0
  - type: FlamerAmmoProvider
    fireTilePrototype: ForgedFlamerFire

- type: entity
  parent: MisfitsTileFire
  id: ForgedFlamerFire
  categories: [HideSpawnMenu]
  components:
  - type: TileFire
    standingDamage: 5

- type: entity
  parent: BaseLoadoutKit
  id: ForgedRaiderWeaponSelector
  name: Forged raider weapon selection
  description: Choose an Unbranded specialty kit. Each kit includes one raider bandolier.
  categories: []
  components:
  - type: UndecidedLoadoutBackpack
    possibleSets: [ForgedKitUnbrandedBurnTenderSet, ForgedKitUnbrandedBrandBreakerSet, ForgedKitUnbrandedFurnaceBreacherSet]

- type: UndecidedLoadoutBackpackSet
  id: ForgedRaiderShotgunSet
  name: forged-shotgun-name
  description: forged-shotgun-description
  sprite:
    sprite: _Nuclear14/Objects/Misc/kits.rsi
    state: rifleman
  content: [N14WeaponShotgunMakeshift, DrinkBeerBottleFull, N14Jet, N14CleanGauze10, N14Ointment10]

- type: UndecidedLoadoutBackpackSet
  id: ForgedRaiderMeleeSet
  name: forged-melee-name
  description: forged-melee-description
  sprite:
    sprite: _Nuclear14/Objects/Misc/kits.rsi
    state: rifleman
  content: [N14SledgeHammer, N14Psycho, N14Ointment10, N14CleanGauze10, DrinkWhiskeyBottleFull]

