# Rank kit selectors reuse the existing loadout and SpawnItemsOnUse systems.
- type: entity
  parent: ClothingBeltNCRBandolier
  id: ForgedBandolier
  name: raider bandolier
  description: A battered ammunition bandolier favored by the Forged.

- type: entity
  parent: BaseItem
  id: ForgedKitMolotov
  name: Molotov
  description: A fuel-filled glass bottle with a fitted cloth wick. Ignite it before throwing.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Consumable/Drinks/milk.rsi
    state: icon
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 50
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 50
  - type: Molotov
    wickOffset: "0,-0.0625"

- type: entity
  parent: N14Machete
  id: ForgedEmbercleaver
  name: Embercleaver
  description: A furnace-blackened machete with copper fittings and a heat-bright cutting edge. Among the Forged, its scorched blade settles arguments that words cannot.
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Melee/embercleaver.rsi
  - type: Item
    sprite: _ReclamationProject/Objects/Weapons/Melee/embercleaver.rsi
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/Melee/embercleaver.rsi
  - type: MeleeWeapon
    damage:
      types:
        Slash: 40
        Heat: 10
        Piercing: 0

- type: entity
  parent: KitBase
  id: ForgedKitUnbrandedBurnTender
  name: "Unbranded Burn Tender"
  description: "Patch up the next recruit before the forge claims them. Contains 1 gauze stack, 1 burn ointment stack, 1 stimpak, 1 9mm pistol, 1 box of 9mm ammunition, 1 raider bandolier."
  components:
  - type: Sprite
    state: medic
  - type: SpawnItemsOnUse
    items:
    - id: N14CleanGauze10
    - id: N14Ointment10
    - id: N14Stimpak
    - id: N14WeaponPistol9mm
    - id: MagazineBox9mm
    - id: ForgedBandolier
