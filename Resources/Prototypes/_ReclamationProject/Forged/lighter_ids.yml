# Working rank lighters retain the existing ID, radio-chat and access components.

- type: entity
  parent: [N14IDCard, CheapLighter]
  id: ForgedWorkerID
  name: Captive Worker cheap lighter
  description: A cheap lighter marked with the rank of Captive Worker. It serves as identification as well as a working lighter.
  components:
  - type: Sprite
    sprite: Objects/Tools/lighters.rsi
  - type: Clothing
    quickEquip: false
    sprite: Objects/Tools/lighters.rsi
    slots: [idcard]
    clothingVisuals:
      idcard: []
  - type: IdCard
    nameLocId: forged-lighter-cheap-id-name
    fullNameLocId: forged-lighter-cheap-id-full-name
  - type: PresetIdCard
    job: ForgedWorker
  - type: Access
    tags: []
  - type: Tag
    tags: [Lighter, DoorBumpOpener]

