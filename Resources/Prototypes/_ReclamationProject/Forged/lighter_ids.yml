- type: entity
  parent: [N14IDCard, FlippoLighter]
  id: ForgedEnforcerID
  name: Tempered weathered metal lighter
  description: A weathered metal lighter marked with the rank of Tempered. It serves as identification as well as a working lighter.
  components:
  - type: Sprite
    sprite: Objects/Tools/lighters.rsi
    color: "#A09A90"
  - type: Clothing
    quickEquip: false
    sprite: Objects/Tools/lighters.rsi
    slots: [idcard]
    clothingVisuals:
      idcard: []
  - type: IdCard
    nameLocId: forged-lighter-weathered-id-name
    fullNameLocId: forged-lighter-weathered-id-full-name
  - type: PresetIdCard
    job: ForgedEnforcer
  - type: Access
    tags: [Forged]
  - type: Tag
    tags: [Lighter, DoorBumpOpener]
  - type: SolutionContainerManager
    solutions:
      Welder:
        maxVol: 10
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 10

