- type: entity
  id: ReclamationPhantomRaider
  name: Psycho Raider
  categories:
  - HideSpawnMenu
  components:
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    layers:
    - sprite: Mobs/Species/Human/parts.rsi
      state: full
      color: '#bd9274'
    - sprite: _Nuclear14/Clothing/Uniforms/FalloutSuits/wastelanderrags.rsi
      state: equipped-INNERCLOTHING
    - sprite: _Nuclear14/Clothing/Shoes/FalloutShoes/raider.rsi
      state: equipped-FEET
    - sprite: _Nuclear14/Clothing/Hands/Gloves/clothgloves.rsi
      state: equipped-HAND
    - sprite: _Nuclear14/Clothing/OuterClothing/Armor/falloutraiderbadlands.rsi
      state: equipped-OUTERCLOTHING
    - sprite: _Nuclear14/Clothing/Eyes/weldgoggles.rsi
      state: equipped-EYES
    - sprite: _Nuclear14/Clothing/Mask/brownbalaclava.rsi
      state: equipped-MASK
    - sprite: _Nuclear14/Objects/Weapons/Melee/kitchen_knife.rsi
      state: inhand-right
  - type: AnimationPlayer
  - type: HallucinationEnemy
    source: N14MobRaiderPsycho
    idleVoice:
      collection: ReclamationRaiderVoice
      params:
        volume: -6
        maxDistance: 12
    minVoiceDelay: 10
    maxVoiceDelay: 10
