# Private visual shells reuse existing enemy and gear artwork, voices and combat definitions.
- type: entity
  id: ReclamationPhantomGhoul
  name: Feral Ghoul
  categories:
  - HideSpawnMenu
  components:
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    layers:
    - map:
      - enum.DamageStateVisualLayers.Base
      state: alive
      sprite: _Nuclear14/Mobs/Ghouls/ghoul-feral.rsi
  - type: AnimationPlayer
  - type: HallucinationEnemy
    source: N14MobGhoulFeral
    aggroVoice:
      collection: N14GhoulAggro
      params:
        volume: -12
        maxDistance: 10
    idleVoice:
      collection: N14GhoulIdle
      params:
        volume: -15
        maxDistance: 5
    minVoiceDelay: 10
    maxVoiceDelay: 60
