- type: entity
  parent: MisfitsClothingHeadsetWastelandScrap
  id: InstituteChameleonScrapHeadset
  name: scrap headset
  suffix: Chameleon, Institute
  description: A disguised Institute headset fitted with Institute and Wasteland encryption keys.
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyInstitute
      - EncryptionKeyWastelandGlobal
  - type: Tag
    tags: []
  - type: ChameleonClothing
    slot: [ears]
    default: MisfitsClothingHeadsetWastelandScrap
  - type: UserInterface
    interfaces:
      enum.ChameleonUiKey.Key:
        type: ChameleonBoundUserInterface

- type: entity
  parent: LockerBaseSecure
  id: InstituteFieldLocker
  name: Institute field equipment locker
  description: A white locker with black accents, stocked with disguises for Institute personnel venturing into the Commonwealth.
  suffix: Filled
  components:
  - type: Sprite
    sprite: _ReclamationProject/Institute/field_locker.rsi
    layers:
    - state: secure
      map: ["enum.StorageVisualLayers.Base"]
    - state: secure_door
      map: ["enum.StorageVisualLayers.Door"]
    - state: locked
      sprite: Structures/Storage/closet.rsi
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
    - state: welded
      sprite: Structures/Storage/closet.rsi
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
  - type: EntityStorageVisuals
    stateBaseClosed: secure
    stateDoorOpen: secure_open
    stateDoorClosed: secure_door
  - type: AccessReader
    access: [[Institute]]
  - type: StorageFill
    contents:
    - id: ClothingBackpackChameleon
    - id: ClothingUniformJumpsuitChameleon
    - id: ClothingOuterChameleon
    - id: ClothingNeckChameleon
    - id: ClothingMaskGasChameleon
    - id: ClothingHeadHatChameleon
    - id: ClothingHandsChameleon
    - id: ClothingEyesChameleon
    - id: ClothingShoesChameleon
    - id: BarberScissors
    - id: InstituteChameleonDogtags
    - id: InstituteChameleonScrapHeadset
