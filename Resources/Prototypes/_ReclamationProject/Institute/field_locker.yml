- type: radioChannel
  id: InstituteRadio
  name: chat-radio-institute
  keycode: 'i'
  frequency: 1520
  color: "#eeeeee"
  longRange: true

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyInstitute
  name: Institute encryption key
  description: A cipher chip granting access to Institute communications.
  components:
  - type: EncryptionKey
    channels: [InstituteRadio]
    defaultChannel: InstituteRadio
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: common_label
      color: "#ffffff"

