      ungibbable: true
    - type: FlashImmunity
  # #Reclamation Project - Courser: fireman carry + Unnatural Regeneration at 2.5x the N14UnnaturalReg trait (0.5 HP/s per type)
  - !type:AddComponentSpecial
    components:
    - type: CanFiremanCarry
    - type: TraumaRegeneration
    - type: PassiveDamage
      allowedStates:
      - Alive
      - Critical
      damageCap: 300
      damage:
        types:
          Blunt: -0.50
          Slash: -0.50
          Piercing: -0.50
          Heat: -0.50
          Cold: -0.50
          Shock: -0.50
          Caustic: -0.50
          Asphyxiation: -0.875
