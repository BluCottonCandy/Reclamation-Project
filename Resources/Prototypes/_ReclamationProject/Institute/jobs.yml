- type: department
  id: Institute
  description: department-Institute-description
  color: "#e8e8e8"
  uiCategory: MajorFaction
  roles: [InstituteDirector, InstituteDivisionHead, InstituteScientist, InstituteCourser, InstituteSecurity]

- type: job
  id: InstituteDirector
  setPreference: true
  weight: 100
  displayWeight: 100
  canBeAntag: false
  name: job-name-institute-director
  description: job-description-institute-director
  playTimeTracker: InstituteDirector
  startingGear: InstituteDirectorGear
  alwaysUseSpawner: true
  access: [Institute, InstituteCommand, InstituteSecurity]
  icon: JobIconScientist
  supervisors: job-supervisors-institute
  whitelisted: true
  hideWithoutJobWhitelist: true
  jobWhitelistBypassesRoleTimers: true
  requireAdminNotify: true
  special:
  - !type:AddComponentSpecial
    components:
    - type: NpcFactionMember
      factions: [Institute]
  # #Reclamation Project - Institute relay brain implant
  - !type:AddInstituteRelayOrganSpecial
    implant: InstituteRelayImplantCommand
  # #Reclamation Project - Institute augments: 15% less damage (stacks with armour), Adamantium Skeleton, flash-immune eyes
  - !type:AddComponentSpecial
    components:
    - type: InstituteAugment
      damageMultiplier: 0.85
    - type: GibModifier
      ungibbable: true
    - type: FlashImmunity
  # #Reclamation Project - Director: fireman carry + Unnatural Regeneration at 2.5x the N14UnnaturalReg trait (0.5 HP/s per type)
  - !type:AddComponentSpecial
    components:
    - type: CanFiremanCarry
    - type: TraumaRegeneration
    - type: PassiveDamage
      allowedStates:
      - Alive
      - Critical
      damageCap: 300
      damage:
        types:
          Blunt: -0.50
          Slash: -0.50
          Piercing: -0.50
          Heat: -0.50
          Cold: -0.50
          Shock: -0.50
          Caustic: -0.50
          Asphyxiation: -0.875
          Bloodloss: -0.25
          Poison: -0.25
          Radiation: -0.25

- type: playTimeTracker
  id: InstituteDirector

