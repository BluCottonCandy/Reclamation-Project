- type: department
  id: Institute
  description: department-Institute-description
  color: "#e8e8e8"
  uiCategory: MajorFaction
  roles: [InstituteDirector, InstituteDivisionHead, InstituteScientist, InstituteCourser, InstituteSecurity, InstituteSynth] # #Reclamation Project - InstituteSynth (Gen 3 Synths)

- type: job
  id: InstituteDirector
  setPreference: true
  weight: 100
  displayWeight: 100
  canBeAntag: false
  name: job-name-institute-director
  description: job-description-institute-director
  playTimeTracker: InstituteDirector
  requirements:
  - !type:CharacterLogicOrRequirement
    requirements:
    - !type:CharacterPlaytimeRequirement
      tracker: InstituteDivisionHead
      min: 18000 # Five hours in the preceding rank.
    - !type:CharacterDepartmentTimeRequirement
      department: Institute
      min: 90000 # 1500 minutes across this faction.
  startingGear: InstituteDirectorGear
  alwaysUseSpawner: true
  access: [Institute, InstituteCommand, InstituteSecurity]
  icon: JobIconScientist
  supervisors: job-supervisors-institute
  whitelisted: true
  hideWithoutJobWhitelist: true
  jobWhitelistBypassesRoleTimers: true # #Reclamation Project - faction head: a job-whitelisted player can take it without the hours.
  requireAdminNotify: true
  special:
  - !type:AddComponentSpecial
    components:
    - type: NpcFactionMember
      factions: [Institute]
  # #Reclamation Project - Institute relay brain implant
  - !type:AddInstituteRelayOrganSpecial
    implant: InstituteRelayImplantCommand
  # #Reclamation Project - Institute augments: 15% less damage (stacks with armour), Adamantium Skeleton, flash-immune eyes
  - !type:AddComponentSpecial
    components:
    - type: InstituteAugment
      damageMultiplier: 0.85
    - type: GibModifier
      ungibbable: true
    - type: FlashImmunity
  # #Reclamation Project - Director: fireman carry + nanites (full repair after 10 s unhurt), never hungry,
  # blood loss is harmless, 95% fire resistance, crawls in crit at normal lying-down speed
  - !type:AddComponentSpecial
    components:
    - type: CanFiremanCarry
    - type: TraumaRegeneration
    - type: NaniteRepair
    - type: SyntheticSustenance
    - type: InnateFireProtection
    - type: SteadyCrawl

- type: playTimeTracker
  id: InstituteDirector

