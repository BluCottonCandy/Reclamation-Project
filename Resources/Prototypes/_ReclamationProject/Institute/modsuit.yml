- type: entity
  parent: ClothingModsuitStandardPowerCell
  id: ReclamationClothingModsuitInstitute
  name: Institute Courser MOD suit
  description: A modular protective suit issued to Institute Coursers.
  components:
  - type: Tag
    tags: [InstituteMODControl]
  - type: ToggleableClothing
    clothingPrototypes:
      head: ReclamationClothingModsuitHelmetInstitute
      gloves: ReclamationClothingModsuitGauntletsInstitute
      outerClothing: ReclamationClothingModsuitChestplateInstitute
      shoes: ReclamationClothingModsuitBootsInstitute
  - type: ChameleonClothing
    slot: [back]
    default: ReclamationClothingModsuitInstitute
    restrictTargets: true
    additionalTargets:
    - ReclamationClothingModsuitInstitute
    - N14ClothingBackpackTrekker
    - N14ClothingBackpackHiking
    - N14ClothingBackpackExplorer
    - N14ClothingBackpackMilitary
    - N14ClothingBackpackNCR
    - N14ClothingBackpackRadioNCR
    - N14ClothingBackpackRucksackNCR
    - N14ClothingBackpackTribal
    - N14ClothingBackpackVaultBlue
    - N14ClothingBackpackVaultOrange
    - N14ClothingBackpackVaultGreen
    - N14ClothingBackpackVaultGreenDark
    - N14ClothingBackpackVaultPurple
    - N14ClothingBackpackVaultRed
    - N14ClothingBackpackVaultBlueDark
    - N14ClothingBackpackDuffel
    - N14ClothingBackpackDuffelSalvage
    - N14ClothingBackpackDuffelMilitary
    - N14ClothingBackpackDuffelMilitaryMedical
    - N14ClothingBackpackSatchelTrekker
    - N14ClothingBackpackSatchelExplorer
    - N14ClothingBackpackSatchelTribal
    - N14ClothingBackpackSatchelMilitary
    - N14ClothingBackpackSatchelNCR
  - type: UserInterface
    interfaces:
      enum.ChameleonUiKey.Key:
        type: ChameleonBoundUserInterface

- type: entity
  parent: ClothingModsuitHelmetStandard
  id: ReclamationClothingModsuitHelmetInstitute
  name: Institute MOD suit helmet
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
        Radiation: 0.9
        Caustic: 0.9
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: ComponentToggler
    components:
    - type: EyeProtection
      protectionTime: 10
  - type: HideLayerClothing
    slots: [Hair, Snout, HeadTop, HeadSide]
    force: true
    hideOnSeal: true
  - type: ChameleonClothing
    slot: [head]
    default: ReclamationClothingModsuitHelmetInstitute
    additionalTargets: [ReclamationClothingModsuitHelmetInstitute]
  - type: UserInterface
    interfaces:
      enum.ChameleonUiKey.Key:
        type: ChameleonBoundUserInterface

