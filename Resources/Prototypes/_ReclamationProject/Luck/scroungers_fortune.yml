- type: entity
  id: ActionScroungersFortune
  name: Scrounger's Fortune
  description: Search for five seconds to uncover one scrap pile within four tiles. Luck 10 required. Ten-minute cooldown after a successful find.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    icon:
      sprite: _Nuclear14/Structures/Decoration/crafting_junk.rsi
      state: Junk_1
    event: !type:ScroungersFortuneActionEvent

- type: entity
  id: ReclamationFortunePileBase
  parent: BaseStructure
  abstract: true
  description: A promising pile of overlooked salvage. Rummage through it to uncover its contents.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Decoration/crafting_junk.rsi
    state: Junk_1
    noRot: true
    drawdepth: Items
    scale: 0.8, 0.8
  # Salvage should never become an indestructible barricade.
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
  - type: ScroungerPile
  - type: ContainerContainer
    containers:
      storagebase: !type:Container

