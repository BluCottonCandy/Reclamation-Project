# #Reclamation Project - Arcane magic: language, Wild Wasteland trait, mana alert.

- type: language
  id: Arcane
  isVisibleLanguage: true
  speech:
    color: "#9b7fd9"
  obfuscation:
    !type:SyllableObfuscation
    minSyllables: 1
    maxSyllables: 3
    replacement:
    - vor
    - akh
    - tel
    - un
    - mir
    - en
    - ska
    - rra
    - orr
    - hal
    - kor
    - ven
    - umb
    - rax
    - tha
    - zul
    - neh
    - isk

- type: trait
  id: ReclamationWildWasteland
  category: Mental
  points: 2 # a downside trait: gives 2 points back
  requirements:
  - !type:CharacterSpeciesRequirement # no magic for machines
    inverted: true
    species:
    - Gen3Synth
    - Courser
  functions:
  - !type:TraitAddComponent
    components:
    - type: MagicWildWasteland

# Pick the Arcane language in character creation (5 points). Only for Wild Wasteland characters.
- type: trait
  id: ReclamationLanguageArcane
  category: Speech
  points: -5
  requirements:
  - !type:CharacterTraitRequirement
    traits:
    - ReclamationWildWasteland
  functions:
  - !type:TraitModifyLanguages
    languagesSpoken:
    - Arcane
    languagesUnderstood:
    - Arcane
  - !type:TraitAddComponent
    components:
    - type: MagicCaster

- type: alert
  id: MagicMana
