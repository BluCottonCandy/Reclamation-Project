# #Reclamation Project - Arcane magic books. All three use the existing book sprite parts (no new art).
# They come from admins (spawn menu) or rarely from junk piles.

- type: entity
  id: MagicGrimoire
  parent: BaseItem
  name: grimoire
  description: A heavy, rune-carved book with blank parchment pages. It hums faintly.
  components:
  - type: Sprite
    sprite: Objects/Misc/books.rsi
    layers:
    - state: paper
    - state: cover_old
      color: "#2a1838"
    - state: decor_wingette_circle
      color: "#b08a3e"
    - state: icon_pentagramm
      color: "#c9a85a"
  - type: Item
    size: Small
  - type: MagicGrimoire
  - type: ActionsContainer
  - type: ActivatableUI
    key: enum.MagicGrimoireUiKey.Key
  - type: UserInterface
    interfaces:
      enum.MagicGrimoireUiKey.Key:
        type: MagicGrimoireBoundUserInterface
  - type: Tag
    tags:
    - Book
  - type: EmitSoundOnPickup
    sound: /Audio/SimpleStation14/Items/Handling/book_pickup.ogg
  - type: EmitSoundOnDrop
    sound: /Audio/SimpleStation14/Items/Handling/book_drop.ogg

# Codex leaves: use one on your grimoire to bind it into the book's Codex tab.
- type: entity
  id: MagicCodexLeafBase
  parent: BaseItem
  abstract: true
  components:
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - Paper

- type: entity
  id: MagicCodexKey
  parent: MagicCodexLeafBase
  name: key of runes
  description: A stiff old leaf ruled into neat boxes, each holding a rune beside a letter. The binding holes along one edge look made for a book.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/clutter.rsi
    layers:
    - state: paper
      color: "#e2cf9e"
    - state: paper_words
      color: "#7a1f1f"
  - type: MagicCodexLeaf

- type: entity
  id: MagicSpellIndex
  parent: MagicCodexLeafBase
  name: spell index
  description: A long leaf ruled into columns, every one empty. The binding holes along one edge look made for a book.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/clutter.rsi
    layers:
    - state: paper
      color: "#d9c9a0"
    - state: paper_words
      color: "#2a3a6a"
  - type: MagicSpellIndexLeaf

- type: entity
