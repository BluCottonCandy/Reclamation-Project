# Blank vellum: use it on your grimoire to stitch in one more blank page (up to 40).
- type: entity
  id: MagicVellum
  parent: BaseItem
  name: blank vellum
  description: A clean, pale sheet of fine vellum. It feels faintly warm.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/clutter.rsi
    layers:
    - state: paper
      color: "#f2e8cc"
  - type: Item
    size: Tiny
  - type: MagicVellum
  - type: Tag
    tags:
    - Paper

# Admin only (not in any loot): reading it unseals every school of magic for the reader.
- type: entity
  id: MagicUnsealingCodex
  parent: BaseItem
  name: codex of the unsealed schools
  description: A heavy black book bound in chains that hang loose and broken. Every page is a different colour of ink.
  components:
  - type: Sprite
    sprite: Objects/Misc/books.rsi
    layers:
    - state: paper
    - state: cover_base
      color: "#141018"
    - state: decor_diagonal
      color: "#c9a0ff"
    - state: icon_magic
      color: "#f2d27a"
  - type: Item
    size: Normal
  - type: MagicUnsealingBook
  - type: Tag
    tags:
    - Book

- type: entity
  id: MagicSilentCastingTreatise
  parent: BaseItem
  name: treatise on silent casting
  description: A slim book of breathing drills and hand forms. The margins are full of someone's practice notes.
  components:
  - type: Sprite
    sprite: Objects/Misc/books.rsi
    layers:
    - state: paper
    - state: cover_base
      color: "#1f2a44"
    - state: decor_diagonal
      color: "#9ab4d8"
    - state: icon_magic
      color: "#d8e4f2"
  - type: Item
    size: Small
  - type: MagicChantlessBook
  - type: Tag
    tags:
    - Book

- type: entity
  id: MagicArcanePrimer
  parent: BaseItem
  name: arcane primer
  description: A thin, battered book. The letters seem to crawl across the page.
  components:
  - type: Sprite
    sprite: Objects/Misc/books.rsi
    layers:
    - state: paper
    - state: cover_base
      color: "#4a2a5a"
    - state: decor_diagonal
      color: "#b08a3e"
    - state: icon_magic
      color: "#d9c27a"
  - type: Item
    size: Small
  - type: MagicPrimer
  - type: Tag
    tags:
    - Book

- type: Tag
  id: MagicQuill

# The only thing that can write in a grimoire. Also works like a pen on normal paper.
- type: entity
  id: MagicQuill
  parent: BaseItem
  name: raven quill
  description: A black feather quill. The ink it leaves seems to move when you aren't looking.
  components:
  - type: Sprite
    sprite: _ReclamationProject/Magic/quill.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - Write
    - MagicQuill

# A page torn out of a grimoire. Only its owner can use it.
- type: entity
  id: MagicTornPage
  parent: BaseItem
  name: torn page
  description: A ragged page torn from an old book, covered in swirling star charts.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/clutter.rsi
    layers:
    - state: paper
      color: "#d9bf8c"
    - state: paper_words
      color: "#6b3a18"
  - type: Item
    size: Tiny
  - type: MagicTornPage
  - type: ActionsContainer
  - type: Tag
    tags:
    - Paper
