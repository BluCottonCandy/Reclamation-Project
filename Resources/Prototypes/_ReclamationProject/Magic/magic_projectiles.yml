# #Reclamation Project - spell projectiles (generated).

- type: entity
  id: ProjectileMagicRockBullet
  parent: BaseBullet
  name: "rock bullet"
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Fun/petrock.rsi
    layers:
    - state: rock
      color: "#e8a070"
  - type: Projectile
    damage:
      types:
        Piercing: 35
        Heat: 5
    armorPenetration: 1.0
  - type: MagicOnHit
    hit:
      slow: 5

