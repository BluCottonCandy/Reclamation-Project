# ---------------------------------------------------------------- walls

- type: entity
  id: MagicEarthWall
  name: rock wall
  description: A wall of rock pulled up out of the ground. It's already starting to crumble.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Sprite
    sprite: Structures/Walls/mining.rsi
    state: full
    drawdepth: Walls
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: Occluder
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: TimedDespawn
    lifetime: 30

- type: entity
  id: MagicIceWall
  parent: MagicEarthWall
  name: ice wall
  description: A slab of magic ice. It's melting.
  components:
  - type: Sprite
    sprite: Structures/Walls/ice.rsi
    state: full
  - type: Occluder
    enabled: false
  - type: TimedDespawn
    lifetime: 20

# ---------------------------------------------------------------- copies and servants

- type: entity
  id: MagicMirrorImage
  name: shimmering figure
  description: It flickers when you look straight at it.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: false
  - type: Clickable
  - type: Sprite
    sprite: Mobs/Ghosts/ghost_human.rsi
    state: animated
    color: "#d0e0ffaa"
    noRot: true
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: TimedDespawn
    lifetime: 20
  - type: MagicMirrorImage
    lifetime: 20

- type: entity
  id: MagicServantBase
  parent: N14MobBaseHostileFeral
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: MagicServant
  - type: TimedDespawn
    lifetime: 30
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Dead
  - type: MeleeWeapon
    hidden: true
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Cold: 8
    range: 1

- type: entity
  id: MagicShadowClone
  parent: MagicServantBase
  name: shadow clone
  description: A dark shape in the outline of a person.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: active
      sprite: Mobs/Ghosts/revenant.rsi
      color: "#3a3058"
  - type: DamageStateVisuals
    states:
      Alive:
        Base: active
      Critical:
        Base: stunned
      Dead:
        Base: stunned

- type: entity
  id: MagicShadowServant
  parent: MagicShadowClone
  name: shadow servant
  description: Something dark that crawled out of a corpse.
  components:
  - type: TimedDespawn
    lifetime: 120

- type: entity
  id: MagicShacklesCuffs
  parent: Handcuffs
  name: arcane shackles
  description: Glowing bands of force. They'll fade in a couple of minutes.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    color: "#a080ff"
  - type: Handcuff
    breakoutTime: 40
    breakOnRemove: true
  - type: MagicShackles
  - type: TimedDespawn
    lifetime: 120
  - type: StaticPrice
    price: 0

