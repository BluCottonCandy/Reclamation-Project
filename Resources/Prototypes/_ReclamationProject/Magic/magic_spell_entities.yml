# #Reclamation Project - things spells spawn: lingering zones, walls, servants, conjured weapons and cuffs.
# All of them vanish on their own (TimedDespawn). Sprites are reused from the base game (no new art).

# ---------------------------------------------------------------- zones

- type: entity
  id: MagicZoneBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: false
  - type: Sprite
    drawdepth: Effects
    noRot: true
  - type: TimedDespawn
    lifetime: 15
  - type: MagicAura

# Floor fire left by fire spells: burns for 8 s and sets anyone standing in it alight.
- type: entity
  id: MagicFloorFire
  parent: MagicZoneBase
  name: magic fire
  description: The floor itself is burning.
  components:
  - type: Sprite
    sprite: Effects/fire.rsi
    state: fire
    shader: unshaded
  - type: PointLight
    color: "#ff8a2a"
    radius: 1.6
    energy: 1.6
  - type: TimedDespawn
    lifetime: 8
  - type: MagicAura
    radius: 0.45
    interval: 1
    hit:
      damage:
        types:
          Heat: 2
      fireStacks: 0.3

# Shown where a delayed spell will land (DOOM, delayed zones).
- type: entity
  id: MagicZoneWarning
  parent: MagicZoneBase
  name: shimmering air
  components:
  - type: Sprite
    sprite: Effects/portal.rsi
    state: portal-red
    color: "#ffffff88"
  - type: TimedDespawn
    lifetime: 3
  - type: MagicAura
    radius: 0
    interval: 99

- type: entity
  id: MagicSmokeCloud
