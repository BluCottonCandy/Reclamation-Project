    state: chemsmoke
    scale: 3, 3
    color: "#e8eef0cc"
  - type: Occluder
    boundingBox: -1.5,-1.5,1.5,1.5
  - type: TimedDespawn
    lifetime: 12
  - type: MagicAura
    radius: 2
    interval: 2
    hit:
      damage:
        types:
          Heat: 2

