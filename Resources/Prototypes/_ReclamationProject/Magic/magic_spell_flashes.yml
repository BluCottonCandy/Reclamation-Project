# #Reclamation Project - spell flashes: what people SEE when a spell goes off.
# Cast = a pulse around the caster; Hit = a pulse on each target; RingN = an area burst N tiles across.
# One set per class, coloured like the class glow in the grimoire. Spawned by MagicSystem.Flash/FlashRing.

- type: entity
  id: MagicFlashBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.8
  - type: EffectVisuals
  - type: AnimationPlayer
  - type: Tag
    tags:
    - HideContextMenu

# Held = a spell charged and waiting in the hand (stays until it fires or fizzles).
- type: entity
  id: MagicFlashHeldBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: MagicFlashHeldElemental
  parent: MagicFlashHeldBase
  components:
  - type: Sprite
    drawdepth: Effects
    noRot: true
    layers:
    - shader: unshaded
      map: [ "enum.EffectLayers.Unshaded" ]
      sprite: Effects/emp.rsi
      state: emp_pulse
      color: "#ff9a5c"
      scale: 0.7, 0.7
  - type: PointLight
    color: "#ff9a5c"
    radius: 1.2
    energy: 2

