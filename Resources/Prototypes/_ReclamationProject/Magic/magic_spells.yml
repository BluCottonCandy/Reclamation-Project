# Firebolt: a quick shot of fire. 12 heat and a few fire stacks.
- type: entity
  id: ProjectileMagicFirebolt
  parent: BaseBullet
  name: firebolt
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: fireball
      shader: unshaded
      scale: 0.6, 0.6
  - type: PointLight
    color: "#E25822"
    radius: 1.5
    energy: 3.0
  - type: Projectile
    damage:
      types:
        Heat: 20
  - type: IgniteOnCollide
  - type: MagicFloorFireOnHit
    fireStacks: 0.5

- type: entity
  id: ActionMagicFirebolt
  parent: ActionMagicBase
  name: · · ·
  components:
  - type: WorldTargetAction
    useDelay: 3
    itemIconStyle: NoItem
    checkCanAccess: false
    raiseOnUser: true
    range: 60
    icon:
      sprite: _ReclamationProject/Magic/spells.rsi
      state: firebolt
    event: !type:ProjectileSpellEvent
