# Plasma Bolt spell: the plasma rifle bolt, tuned for the spell (34 total). Guns keep their own BulletPlasma.
- type: entity
  id: ProjectileMagicPlasmaBolt
  parent: BulletPlasma
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    impactEffect: BulletPlasmaImpactEffect
    damage:
      types:
        Caustic: 28
        Radiation: 6
        Structural: 50
    soundHit:
      path: "/Audio/Weapons/Guns/Hits/energy_meat1.ogg"
