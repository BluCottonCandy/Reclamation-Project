- type: magicSpell
  id: VeilOfNight
  name: magic-spell-veil-of-night
  words: [ Shadow, MindShield ]
  class: Dark
  manaCost: 15
  action: ActionMagicVeilOfNight
  corruptionCost: 8
  summary: "Lights in a 3x3 area go out for 20 s."

- type: entity
  id: ActionMagicVeilOfNight
  parent: ActionMagicBase
  name: · · ·
  components:
  - type: WorldTargetAction
    useDelay: 25
    itemIconStyle: NoItem
    raiseOnUser: true
    icon:
      sprite: _ReclamationProject/Magic/spells.rsi
      state: veil_of_night
    range: 10
    checkCanAccess: false
    event: !type:MagicZoneSpellEvent
      radius: 2
      special: LightsOut

