- type: magicSpell
  id: ArcLightning
  name: magic-spell-arc-lightning
  words: [ Lightning ]
  class: Elemental
  manaCost: 10
  action: ActionMagicArcLightning
  summary: "Shock that jumps to people next to the target."

- type: entity
  id: ActionMagicArcLightning
  parent: ActionMagicBase
  name: · · ·
  components:
  - type: EntityTargetAction
    useDelay: 5
    itemIconStyle: NoItem
    raiseOnUser: true
    icon:
      sprite: _ReclamationProject/Magic/spells.rsi
      state: arc_lightning
    range: 8
