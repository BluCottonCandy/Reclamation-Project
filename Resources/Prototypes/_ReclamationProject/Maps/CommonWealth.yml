# Common Wealth is the default mapping base.
- type: gameMap
  id: CommonWealth
  mapName: Common Wealth
  mapAuthor: Reclamation Project
  mapPath: /Maps/Reclamation/CommonWealth.yml
  minPlayers: 0
  stations:
    CommonWealth:
      stationProto: FalloutStation
      components:
      - type: StationNameSetup
        mapNameTemplate: Common Wealth
      - type: StationJobs
        overflowJobs: [Wastelander]
        availableJobs:
          Wastelander: [-1, -1]
          RailroadSafehouse1Intern: [2, 2]
          RailroadSafehouse1Worker: [2, 2]
          RailroadSafehouse1Agent: [2, 2]
          RailroadSafehouse1Runner: [2, 2]
          RailroadSafehouse1Conductor: [1, 1]
          RailroadSafehouse1SafehouseOwner: [1, 1]
          RailroadSafehouse2Intern: [2, 2]
          RailroadSafehouse2Worker: [2, 2]
          RailroadSafehouse2Agent: [2, 2]
          RailroadSafehouse2Runner: [2, 2]
          RailroadSafehouse2Conductor: [1, 1]
          RailroadSafehouse2SafehouseOwner: [1, 1]
          RailroadAlphaLeader: [1, 1]
          RailroadInspector: [1, 1]
          # #Reclamation Project - Institute jobs (no Institute spawn points mapped yet; they use the station fallback)
          InstituteDirector: [ 1, 1 ]
          InstituteDivisionHead: [ 2, 2 ]
          InstituteScientist: [ 4, 4 ]
          InstituteCourser: [ 2, 2 ]
          InstituteSecurity: [ 4, 4 ]
          # #Reclamation Project - Minutemen General (faction leader, job-whitelist only). No Minutemen spawn points
          # are mapped here yet, so they use the station fallback like the Institute.
          MinutemenGeneral: [ 1, 1 ]
          # #Reclamation Project - Diamond City jobs. Diamond City is not mapped yet, so they use the station
          # fallback spawn until the DiamondCitySpawnPoint* markers are placed.
          DiamondCityMayor: [ 1, 1 ]
          DiamondCitySecurityChief: [ 1, 1 ]
          DiamondCitySecuritySergeant: [ 1, 1 ]
          DiamondCitySecurityGuard: [ 3, 3 ]
          DiamondCitySecurityRecruit: [ 3, 3 ]
          DiamondCityMedic: [ 2, 2 ]
          DiamondCityShopkeeper: [ 2, 2 ]
          DiamondCityTakahashi: [ 1, 1 ]
          DiamondCityTownsfolk: [ -1, -1 ]
