# #Reclamation Project - Minutemen Rank Pin Progressions
# NCR rank names on the Enclave timing: each job counts only its own tracker
# (departmentTracker: false) and climbs one pin every 20 hours.
# NCRRankPinSpawnSystem matches on job ID and puts the earned pin in the player's hand at spawn.
#
# Tracker quick-reference (use with: playtime_addrole <user> <tracker> <time>)
#   MinutemenRecruit     — Minutemen Recruit
#   MinutemenPrivate     — Minutemen Private
#   MinutemenCorporal    — Minutemen Corporal
#   MinutemenSergeant    — Minutemen Sergeant
#   MinutemenLieutenant  — Minutemen Lieutenant
#   MinutemenCaptain     — Minutemen Captain
#   MinutemenCommander   — Minutemen Commander
#   MinutemenColonel     — Minutemen Colonel (admin-only)
#   MinutemenGeneral     — Minutemen General (faction leader)

# Recruit: Recruit
- type: ncrRankPinProgression
  id: MinutemenRecruitPins
  jobs:
    - MinutemenRecruit
  tracker: MinutemenRecruit
  departmentTracker: false
  thresholds:
    - min: 0
      entity: ClothingNeckPinMinutemenRecruit

# Private: PVT → PFC at 20h → SPC at 40h
- type: ncrRankPinProgression
  id: MinutemenPrivatePins
  jobs:
    - MinutemenPrivate
  tracker: MinutemenPrivate
  departmentTracker: false
  thresholds:
    - min: 0
      entity: ClothingNeckPinMinutemenPrivate
    - min: 72000   # 20 hours
      entity: ClothingNeckPinMinutemenPFC
    - min: 144000  # 40 hours
      entity: ClothingNeckPinMinutemenSpecialist

