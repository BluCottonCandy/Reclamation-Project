- type: entity
  parent: N14IDCard
  id: OperatorsStampIdBase
  abstract: true
  description: A pair of dark metal Operator identification tags.
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Operators/dogtags.rsi
    state: icon
  - type: Item
    sprite: _ReclamationProject/Objects/Operators/dogtags.rsi

- type: entity
  parent: BaseItem
  id: OperatorContractScroll
  name: Operator contract
  description: A gold contract. Use it in hand to review and accept the offer.
  components:
  - type: OperatorContract
  - type: Sprite
    sprite: _ReclamationProject/Objects/Operators/contract.rsi
    layers:
    - state: scroll
      map: ["contract"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.OperatorContractVisuals.Stage:
        contract:
          Written: { state: scroll }
          Accepted: { state: accepted }
          Paid: { state: paid }
  - type: Item
    size: Tiny
    sprite: _ReclamationProject/Objects/Operators/contract.rsi

- type: entity
  id: ActionOperatorCreateContract
  name: Create Contract
  description: Write a job offer and set its price in caps.
  categories: [HideSpawnMenu]
  components:
  - type: InstantAction
    icon:
      sprite: _ReclamationProject/Objects/Operators/contract.rsi
      state: scroll
    event: !type:OperatorCreateContractEvent
