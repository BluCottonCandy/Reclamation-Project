- type: department
  id: Operators
  description: department-operators-description
  color: "#804657"
  uiCategory: MinorFaction
  roles: [OperatorsSpirit, OperatorsGhost, OperatorsSpectre, OperatorsShade, OperatorsPhantom, OperatorsWraith, OperatorsRevenant]

- type: job
  id: OperatorsSpirit
  name: job-name-operators-spirit
  description: job-description-operators-spirit
  playTimeTracker: OperatorsSpirit
  startingGear: OperatorsSpiritGear
  setPreference: true
  alwaysUseSpawner: true
  canBeAntag: false
  icon: JobIconOperators
  supervisors: operators-supervisors
  access: [Operators]
  special:
  - !type:AddComponentSpecial
    components:
    - type: OperatorTracker
    - type: OperatorContractIssuer
    - type: OperatorSmoke
    - type: OperatorTraps
    - type: TraitSpeedModifier
      sprintModifier: 1.05
      walkModifier: 1.05
      requiredTriggeredSpeedModifier: 1.05

- type: playTimeTracker
  id: OperatorsSpirit

- type: entity
  parent: SpawnPointJobBase
  id: SpawnPointOperatorsSpirit
  name: Operator Spirit spawn
  components:
  - type: SpawnPoint
    job_id: OperatorsSpirit

