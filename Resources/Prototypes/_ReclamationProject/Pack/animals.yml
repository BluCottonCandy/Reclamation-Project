- type: entity
  parent: MarkerBase
  id: SpawnPackBrahdo
  name: Pack brahdo spawner
  components:
  - type: ConditionalSpawner
    prototypes:
    - PackBrahdo

- type: entity
  id: PackYaoGuai
  parent: N14MobYaoguai
  name: Pack yao guai
  components:
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 5
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 9
        Slash: 26
  - type: SlowOnDamage
    speedModifierThresholds:
      150: 0.8
      300: 0.6

  - type: Scent
  - type: PackAnimal
    armorModifiers:
      coefficients: { Blunt: 0.65, Slash: 0.65, Piercing: 0.65 }
  - type: ItemSlots
    slots:
      pack-armor:
        name: pack-animal-armor-slot
        whitelist:
          components: [PackAnimalArmor]
  - type: NpcFactionMember
    factions: [Pack]
  - type: Body
    prototype: N14PetAnimal
  - type: Bloodstream
  - type: MobState
    allowedStates: [Alive, Critical, Dead]
  - type: MobThresholds
    thresholds:
      0: Alive
      600: Critical
      800: Dead
    allowRevives: true
  - type: HTN
    rootTask:
      task: N14RangedHostileCompound
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: petting-success-generic
    interactSuccessSpawn: EffectHearts
