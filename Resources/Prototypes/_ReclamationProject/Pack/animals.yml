- type: entity
  parent: N14MobPetDogLegion
  id: PackHound
  name: Pack hound
  description: A scarred, well-fed kennel hound that recognizes only the Pack as its
    own.
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Critical
      290: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      50: 0.8
      100: 0.6

  - type: Scent
  - type: PackAnimal
    armorModifiers:
      coefficients: { Blunt: 0.75, Slash: 0.75, Piercing: 0.75 }
  - type: ItemSlots
    slots:
      pack-armor:
        name: pack-animal-armor-slot
        whitelist:
          components: [PackAnimalArmor]
  - type: MirelurkQueenCharge
    singleTarget: true
    cooldown: 20
    windup: 0
    range: 5
    impactSlowdown: 0.05
    impactDamage:
      types:
        Blunt: 10
  - type: NpcFactionMember
    factions:
    - Pack
  - type: LanguageKnowledge
    speaks:
    - N14Dog
    understands:
    - N14Dog
    - English
- type: entity
  parent: MarkerBase
  id: SpawnPackHound
  name: Pack hound spawner
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: _Nuclear14/Mobs/Animals/dogwolf.rsi
      state: wolf
    - state: ai
  - type: ConditionalSpawner
    prototypes:
    - PackHound
- type: entity
