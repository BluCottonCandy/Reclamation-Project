- type: entity
  parent: BaseItem
  id: PackArrowBundle
  name: Pack arrow bundle
  description: Ten poison-tipped hunting arrows bound together with cord. Take arrows
    out like an ammunition box, or add loose arrows to refill it.
  components:
  - type: Item
    size: Small
    storedRotation: 90
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Pack/arrow_bundle.rsi
    layers:
    - state: cord
    - state: arrows
      map:
      - arrows
  - type: BallisticAmmoProvider
    capacity: 10
    proto: PackHuntingArrow
    mayTransfer: true
    whitelist:
      tags:
      - Arrow
    soundRack: null
    soundInsert:
      path: /Audio/Weapons/Guns/Misc/arrow_nock.ogg
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container {}
  - type: PackCompoundBow
  - type: Appearance
  - type: AmmoCounter
  - type: GenericVisualizer
    visuals:
      enum.AmmoVisuals.AmmoCount:
        arrows:
          '0':
            visible: false
          '1':
            visible: true
          '2':
            visible: true
          '3':
            visible: true
          '4':
            visible: true
          '5':
            visible: true
          '6':
            visible: true
          '7':
            visible: true
          '8':
            visible: true
          '9':
            visible: true
          '10':
            visible: true
