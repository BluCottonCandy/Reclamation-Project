- type: entity
  name: Pack Stalker
  parent: KitBase
  id: PackKitStalker
  description: 'Quiet hunter. Contains: a Pack hunting bow, magnetic arrow quiver,
    seventeen loose Pack hunting arrows, a refillable bundle of ten reserve arrows,
    a Pack fang spear, binoculars and a combat knife, two stimpaks, bandages, an MRE
    box, two bolas and two sets of handcuffs.'
  components:
  - type: Sprite
    state: rifleman
  - type: Item
    size: Huge
  - type: SpawnItemsOnUse
    items:
    - id: PackHuntingBow
    - id: PackArrowQuiver
    - id: PackHuntingArrow
      amount: 17
    - id: PackArrowBundle
    - id: PackFangSpear
    - id: N14Binoculars
    - id: N14CombatKnife
    - &id001
      id: N14Stimpak
      amount: 2
    - &id002
      id: N14Bandage
    - &id003
      id: N14BoxCardboardMREBoxCFilled
    - &id004
      id: Bola
      amount: 2
    - &id005
      id: Handcuffs
      amount: 2
- type: UndecidedLoadoutBackpackSet
  id: PackStalkerSet
  name: pack-kit-stalker-name
  description: pack-kit-stalker-description
  sprite:
    sprite: _Nuclear14/Objects/Misc/kits.rsi
    state: rifleman
  content:
  - PackKitStalker
