- type: entity
  parent: Trademachine
  id: ReclamationSupplyPackVendor
  name: Pack supply vendor
  description: A battered requisitions machine painted in the Pack's colours. Shared
    supply points start at 50 and accrue at 3 per minute, up to 200. Hold or drag
    a supply crate beside the vendor and redeem it for 20, 50 or 100 points depending
    on its type. Issued equipment cannot be sold. Rank equipment is restricted to
    your rank and below.
