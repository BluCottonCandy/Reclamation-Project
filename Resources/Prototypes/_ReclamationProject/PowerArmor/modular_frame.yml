  - sprite: /Textures/_ReclamationProject/Interface/Alerts/power_armor_condition.rsi
    state: condition3
  - sprite: /Textures/_ReclamationProject/Interface/Alerts/power_armor_condition.rsi
    state: condition4
  - sprite: /Textures/_ReclamationProject/Interface/Alerts/power_armor_condition.rsi
    state: condition5
  - sprite: /Textures/_ReclamationProject/Interface/Alerts/power_armor_condition.rsi
    state: condition6
  - sprite: /Textures/_ReclamationProject/Interface/Alerts/power_armor_condition.rsi
    state: condition7
  - sprite: /Textures/_ReclamationProject/Interface/Alerts/power_armor_condition.rsi
