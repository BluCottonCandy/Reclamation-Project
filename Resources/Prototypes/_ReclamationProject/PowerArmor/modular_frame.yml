- type: entity
  id: ReclamationPowerArmorRatingView
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - map: [ "enum.AlertVisualLayers.Base" ]
    - sprite: Interface/Alerts/essence_counter.rsi
      state: "0"
      offset: 0.375, 0.28125
      map: [ "pa-tens" ]
    - sprite: Interface/Alerts/essence_counter.rsi
      state: "0"
      offset: 0.5625, 0.28125
      map: [ "pa-ones" ]
