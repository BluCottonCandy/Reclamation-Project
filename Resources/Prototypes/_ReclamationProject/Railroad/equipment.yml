# Rank armor: Agent and above get better protection, topping out below power armor.
- type: entity
  parent: RailroadCombatArmor
  id: RailroadCombatArmorMk2
  name: Railroad combat armor mk2
  description: A reinforced suit of matte black combat armor issued to safehouse leadership.
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.6
        Heat: 0.65
    priceMultiplier: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0.75

