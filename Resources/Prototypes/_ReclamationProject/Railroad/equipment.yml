    sprite: _ReclamationProject/Railroad/combat_armor.rsi
  - type: Clothing
    sprite: _ReclamationProject/Railroad/combat_armor.rsi
  - type: Item
    sprite: _ReclamationProject/Railroad/combat_armor.rsi

- type: entity
  parent: RailroadCombatArmorMk2
  id: RailroadAgentCombatArmor
  name: Railroad compact combat armor mk2
  description: A compact suit of reinforced black combat armor designed to be carried discreetly by an undercover operative.
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,0,1

- type: entity
  parent: N14ClothingNeckRangerDuster
  id: RailroadRangerDuster
