  description: A black duster with white trim, silver fittings, and reinforced shoulder plates.
  components:
  - type: Sprite
    sprite: _ReclamationProject/Railroad/ranger_duster.rsi
  - type: Clothing
    sprite: _ReclamationProject/Railroad/ranger_duster.rsi

- type: entity
