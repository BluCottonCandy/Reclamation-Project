    sprite: _ReclamationProject/Railroad/gray_beanie.rsi
  - type: Clothing
    sprite: _ReclamationProject/Railroad/gray_beanie.rsi
  - type: Item
    sprite: _ReclamationProject/Railroad/gray_beanie.rsi

- type: entity
  parent: MisfitsClothingHeadsetWastelandScrap
  id: RailroadScrapHeadset
  name: Railroad scrap headset
  description: A scrap-built headset fitted with Railroad and Wasteland encryption keys.
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyRailroad
      - EncryptionKeyWastelandGlobal

- type: entity
  abstract: true
  parent: N14ClothingNeckDogtags
  id: RailroadSpikeIDBase
  name: Railroad identification spike
  description: A small railroad spike engraved with its owner's name and assignment.
  components:
  - type: Sprite
    sprite: _ReclamationProject/Railroad/spike_id.rsi
  - type: Clothing
    sprite: _ReclamationProject/Railroad/spike_id.rsi
    slots: [idcard]
  - type: IdCard
    nameLocId: railroad-id-name
    fullNameLocId: railroad-id-full-name
  - type: Tag
    tags: [DoorBumpOpener, WhitelistChameleon]

- type: entity
  parent: N14ClothingOuterVestLeather
  id: RailroadVest
  name: Railroad armored vest
  description: A discreet black armored vest for Railroad operatives, lined with plates as tough as combat armor.
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.75
        Slash: 0.75
        Piercing: 0.7
        Heat: 0.7
    priceMultiplier: 0.5
  - type: Sprite
    sprite: _ReclamationProject/Railroad/vest.rsi
  - type: Clothing
    sprite: _ReclamationProject/Railroad/vest.rsi
  - type: Item
    sprite: _ReclamationProject/Railroad/vest.rsi

