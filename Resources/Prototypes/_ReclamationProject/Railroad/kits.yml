# Railroad physical equipment kits. Each rank's selection box offers the kits listed for it; choose one.

- type: entity
  parent: KitBase
  id: RailroadKitPistol
  name: Railroad 10mm pistol kit
  description: "A cheap, common sidearm that won't draw attention. Contains 1 loaded 10mm pistol, 2 spare 10mm magazines, a combat knife, 1 MRE kit, 1 stimpak, and 1 roll of clean gauze (10 uses)."
  components:
  - type: Sprite
    state: rifleman
  - type: SpawnItemsOnUse
    items:
    - id: N14BoxCardboardMREBoxCFilled
    - id: N14Stimpak
    - id: N14CleanGauze10
    - id: N14WeaponPistol10mm
    - id: N14MagazinePistol10mm
    - id: N14MagazinePistol10mm
    - id: N14CombatKnife
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: UndecidedLoadoutBackpackSet
  id: RailroadKitSetPistol
  name: railroad-kit-pistol-name
  description: railroad-kit-pistol-description
  sprite:
    sprite: _Nuclear14/Objects/Misc/kits.rsi
    state: rifleman
  content:
  - RailroadKitPistol

