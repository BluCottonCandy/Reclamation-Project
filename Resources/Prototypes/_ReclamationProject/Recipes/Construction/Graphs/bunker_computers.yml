- type: constructionGraph
  id: ReclamationBunkerTerminalCompact
  start: start
  graph:
  - node: start
    edges:
    - to: finished
      completed:
      - !type:SnapToGrid {}
      steps:
      - material: Steel
        amount: 10
      - material: Cable
        amount: 4
      - material: Glass
        amount: 1
      - material: N14ScrapElectronic
        amount: 2
      - tag: N14Board
        name: circuit board
        icon: {sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi, state: board_1}
      - tag: N14Board
        name: circuit board
        icon: {sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi, state: board_1}
        doAfter: 3
  - node: finished
    entity: ReclamationBunkerTerminalCompact
    edges:
    - to: start
      conditions:
      - !type:ContainerEmpty
        container: game-holotape
      steps:
      - tool: Screwing
        doAfter: 3
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 10
      - !type:SpawnPrototype
        prototype: CableApcStack1
        amount: 4
      - !type:SpawnPrototype
        prototype: SheetGlass1
        amount: 1
      - !type:SpawnPrototype
        prototype: N14ScrapElectronic1
        amount: 2
      - !type:SpawnPrototype
        prototype: N14JunkComponentBoard1
        amount: 2
      - !type:DeleteEntity {}

