- type: constructionGraph
  id: ReclamationWeaponPlaque
  start: start
  graph:
  - node: start
    edges:
    - to: finished
      steps:
      - material: WoodPlank
        amount: 2
        doAfter: 2
  - node: finished
    entity: ReclamationWeaponPlaque
    edges:
    - to: start
      conditions:
      - !type:ContainerEmpty
        container: weapon
      steps:
      - tool: Screwing
        doAfter: 2
      completed:
      - !type:SpawnPrototype
        prototype: MaterialWoodPlank1
        amount: 2
      - !type:DeleteEntity {}

