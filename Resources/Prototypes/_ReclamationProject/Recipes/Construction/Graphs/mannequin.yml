- type: constructionGraph
  id: Mannequin
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: mannequin
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: WoodPlank
              amount: 5
              doAfter: 2
    - node: mannequin
      entity: ReclamationMannequin
      edges:
        - to: start
          completed:
            - !type:EmptyAllContainers
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank
              amount: 5
          steps:
            - tool: Screwing
              doAfter: 3
