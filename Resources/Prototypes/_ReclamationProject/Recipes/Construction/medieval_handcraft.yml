# #Reclamation Project - medieval weapons (RogueTown sprites provided by Chermaity)

# Basic stone, bone and wood weapons anyone can make by hand (construction menu, Weapons tab).

- type: constructionGraph
  id: RPMedievalWoodenRoundShieldGraph
  start: start
  graph:
  - node: start
    edges:
    - to: done
      steps:
      - material: WoodPlank
        amount: 6
        doAfter: 2
      - material: Cloth
        amount: 2
        doAfter: 2
  - node: done
    entity: RPMedievalWoodenRoundShield

- type: construction
  name: "wooden round shield"
  id: RPMedievalWoodenRoundShield
  graph: RPMedievalWoodenRoundShieldGraph
  startNode: start
  targetNode: done
  category: construction-category-weapons
  description: "Planks pegged together into a simple round shield. Cheap, light, and better than nothing."
  icon: { sprite: _ReclamationProject/Objects/Weapons/Medieval/wooden_round_shield.rsi, state: icon }
  objectType: Item

- type: constructionGraph
  id: RPMedievalSlingGraph
  start: start
  graph:
  - node: start
    edges:
    - to: done
      steps:
      - material: Cloth
        amount: 3
        doAfter: 2
  - node: done
    entity: RPMedievalSling

- type: construction
  name: "shepherd's sling"
  id: RPMedievalSling
  graph: RPMedievalSlingGraph
  startNode: start
  targetNode: done
  category: construction-category-weapons
  description: "A leather pouch on two cords. Pack it with a handful of stones, bricks, bottles or grenades, whirl it, and let fly: everything in the pouch goes in one shot. Grenades arm as they leave; bullets just get thrown like stones (the fustibalus fires them)."
  icon: { sprite: _ReclamationProject/Objects/Weapons/Medieval/sling.rsi, state: icon }
  objectType: Item

- type: constructionGraph
