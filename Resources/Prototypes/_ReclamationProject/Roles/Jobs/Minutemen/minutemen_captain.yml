# #Reclamation Project - Minutemen Captain: senior officer, whitelisted.

- type: job
  id: MinutemenCaptain
  setPreference: true
  whitelisted: true # job whitelist: jobwhitelistadd <player> MinutemenCaptain
  jobWhitelistBypassesRoleTimers: false # Whitelisting does not waive rank progression.
  weight: 110
  displayWeight: 110
  showBorderBelow: true
  canBeAntag: false
  name: job-name-minutemen-captain
  description: job-description-minutemen-captain
  playTimeTracker: MinutemenCaptain
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
      - Human
      - Courser
      - Ghoul
    - !type:CharacterPlaytimeRequirement
      tracker: MinutemenLieutenant
      min: 18000 # 5 hours in the preceding role.
  startingGear: MinutemenCaptainKitGear
  alwaysUseSpawner: true # #Reclamation Project - spawn at the Minutemen spawn points, late join too
  access:
  - Minutemen
  - MinutemenNCO
  icon: "JobIconNcrLeader" # placeholder until Minutemen job icon art exists
  supervisors: job-supervisors-minutemen-general
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Minutemen
          - Wastelander

- type: playTimeTracker
  id: MinutemenCaptain
