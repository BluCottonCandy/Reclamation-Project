# #Reclamation Project - Minutemen Commander: highest player rank, whitelisted.

- type: job
  id: MinutemenCommander
  setPreference: true
  whitelisted: true # job whitelist: jobwhitelistadd <player> MinutemenCommander
  jobWhitelistBypassesRoleTimers: false # Whitelisting does not waive rank progression.
  weight: 120
  displayWeight: 120
  showBorderBelow: true
  canBeAntag: false
  name: job-name-minutemen-commander
  description: job-description-minutemen-commander
  playTimeTracker: MinutemenCommander
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
      - Human
      - Courser
      - Ghoul
    - !type:CharacterPlaytimeRequirement
      tracker: MinutemenCaptain
      min: 18000 # 5 hours in the preceding role.
  startingGear: MinutemenCommanderGear
  alwaysUseSpawner: true # #Reclamation Project - spawn at the Minutemen spawn points, late join too
  access:
  - Minutemen
  - MinutemenNCO
  icon: "JobIconNcrLeader" # placeholder until Minutemen job icon art exists
  supervisors: job-supervisors-minutemen-general
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Minutemen
          - Wastelander

- type: playTimeTracker
  id: MinutemenCommander
