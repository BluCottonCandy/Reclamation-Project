# #Reclamation Project - Minutemen Corporal: junior NCO leading a fireteam.

- type: job
  id: MinutemenCorporal
  setPreference: true
  weight: 80
  displayWeight: 80
  showBorderBelow: true
  canBeAntag: false
  name: job-name-minutemen-corporal
  description: job-description-minutemen-corporal
  playTimeTracker: MinutemenCorporal
  jobWhitelistBypassesRoleTimers: true
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
      - Human
      - Courser
      - Ghoul
    - !type:CharacterPlaytimeRequirement
      tracker: MinutemenPrivate
      min: 18000 # 5 hours in the preceding role.
  startingGear: MinutemenCorporalKitGear
  alwaysUseSpawner: true # #Reclamation Project - spawn at the Minutemen spawn points, late join too
  access:
  - Minutemen
  icon: "JobIconNcrSpec" # placeholder until Minutemen job icon art exists
  supervisors: job-supervisors-minutemen-officers
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Minutemen
          - Wastelander

- type: playTimeTracker
  id: MinutemenCorporal
