    jumpsuit: MinutemenClothingUniformNCO
    outerClothing: MinutemenClothingOuterVestNCO
    gloves: MinutemenClothingHandsGloves
    shoes: MinutemenClothingShoesBoots
    ears: MisfitsClothingHeadsetWastelandScrap
    back: N14ClothingBackpackMilitary
    id: MinutemenIDDogtagsSergeant
    suitstorage: MinutemenWeaponLaserMusket
  storage:
    back:
    - N14BoxPlasticFilledWastelander
    - N14MicrofusionCellRed
    - N14MicrofusionCellRed

