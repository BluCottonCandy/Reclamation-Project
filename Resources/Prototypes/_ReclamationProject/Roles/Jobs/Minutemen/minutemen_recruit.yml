# #Reclamation Project - Minutemen Recruit: entry rank, open to everyone.

- type: job
  id: MinutemenRecruit
  setPreference: true
  weight: 60
  displayWeight: 60
  canBeAntag: false
  name: job-name-minutemen-recruit
  description: job-description-minutemen-recruit
  playTimeTracker: MinutemenRecruit
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
      - Human
      - Ghoul
  startingGear: MinutemenRecruitKitGear
  alwaysUseSpawner: true # #Reclamation Project - spawn at the Minutemen spawn points, late join too
  access:
  - Minutemen
  icon: "JobIconNcrCadet" # placeholder until Minutemen job icon art exists
  supervisors: job-supervisors-minutemen-officers
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Minutemen
          - Wastelander

- type: playTimeTracker
  id: MinutemenRecruit
