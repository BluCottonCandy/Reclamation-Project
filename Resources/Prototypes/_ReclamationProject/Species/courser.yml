# Courser: Institute Gen 3 synth race (whitelist). Looks, sounds and handles like a human (human
# sprites, voice, size, speed, food, medicine, surgery) so nobody can tell, but is built like a
# C-27 underneath: C-27 health and toughness, radiation-immune, never needs to breathe, and its
# "bleeding" never hurts it. Carries the Courser perks in every job and always counts as Institute.

- type: species
  id: Courser
  name: species-name-courser
  roundStart: true
  whitelistRequired: true
  jobWhitelistUnlock: InstituteCourser # whitelisted for the Courser job = can pick the race
  prototype: MobCourser
  sprites: MobHumanSprites
  defaultSkinTone: "#c0967f"
  markingLimits: MobHumanMarkingLimits
  dollPrototype: MobCourserDummy
  skinColoration: HumanToned
  minHeight: 0.937
  maxHeight: 1.249
  minWidth: 0.825
  maxWidth: 1.05

# Own body: human-looking synthetic parts, laid out exactly like a human body so surgery works the same.
- type: body
  id: Courser
  name: "courser"
  root: torso
  slots:
    head:
      part: HeadCourser
      connections:
      - torso
      organs:
        brain: OrganCourserBrain
        eyes: OrganCourserEyes
    torso:
      part: TorsoCourser
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      - head
      organs:
        heart: OrganCourserHeart
        lungs: OrganCourserLungs
        stomach: OrganCourserStomach
        liver: OrganCourserLiver
        kidneys: OrganCourserKidneys
        appendix: OrganCourserAppendix
    right arm:
      part: RightArmCourser
      connections:
      - right hand
    left arm:
      part: LeftArmCourser
      connections:
      - left hand
    right hand:
      part: RightHandCourser
    left hand:
      part: LeftHandCourser
    right leg:
      part: RightLegCourser
      connections:
      - right foot
    left leg:
      part: LeftLegCourser
      connections:
      - left foot
    right foot:
      part: RightFootCourser
    left foot:
      part: LeftFootCourser

# Body parts: pass for human while attached; give themselves away once cut off.
- type: entity
  parent: TorsoHuman
  id: TorsoCourser
  categories: [ HideSpawnMenu ]
  components:
  - type: SyntheticBodyPart
    revealedName: courser-part-torso-name
    revealedDescription: courser-part-description

