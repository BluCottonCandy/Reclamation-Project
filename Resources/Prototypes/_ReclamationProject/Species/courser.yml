# C-27 resistances: radiation immune, otherwise like a C-27 chassis.
- type: damageModifierSet
  id: CourserSynthetic
  coefficients:
    Shock: 1.0
    Radiation: 0.0

- type: entity
  save: false
  parent: MobHuman
  id: MobCourser
  name: Urist McHands
  components:
  - type: HumanoidAppearance
    species: Courser
  - type: Body
    prototype: Courser
    requiredLegs: 2
  - type: CourserSynth
  - type: NpcFactionMember
    factions:
    - Institute
  # --- C-27 toughness ---
  - type: Damageable
    damageModifierSet: CourserSynthetic
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Critical
      400: Dead
    allowRevives: true
  - type: Stamina
    critThreshold: 120
  - type: Reflect
    reflects:
    - SmallCaliber
    - MediumCaliber
    reflectProb: 0.10
    innate: true
    spread: 90
  - type: EyeProtection
  - type: StepTriggerImmune
    whitelist:
      types:
      - Shard
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcFist
    attackRate: 1
    damage:
      types:
        Blunt: 10
  # --- Synthetic body ---
  # Never needs to breathe: saturation can't drop low enough to suffocate, and no gasping.
  - type: Respirator
    suffocationThreshold: -1000
    damage:
      types:
        Asphyxiation: 0
  # Bleeds (so nobody can tell) but losing it never hurts.
  - type: Bloodstream
    bloodlossDamage:
      types:
        Bloodloss: 0
    bloodlossHealDamage:
      types:
        Bloodloss: 0
  # --- Courser perks (every job) ---
  - type: InstituteAugment
    damageMultiplier: 0.70
  - type: GibModifier
    ungibbable: true
  - type: FlashImmunity
  - type: CanFiremanCarry
  - type: TraumaRegeneration
  - type: PassiveDamage
    allowedStates:
    - Alive
    - Critical
    damageCap: 300
    damage:
      types:
        Blunt: -0.50
        Slash: -0.50
        Piercing: -0.50
        Heat: -0.50
        Cold: -0.50
        Shock: -0.50
        Caustic: -0.50
        Asphyxiation: -0.875
        Bloodloss: -0.25
        Poison: -0.25
        Radiation: -0.25

- type: entity
  save: false
  parent: MobHumanDummy
  id: MobCourserDummy
  categories: [ HideSpawnMenu ]
  components:
  - type: HumanoidAppearance
    species: Courser
