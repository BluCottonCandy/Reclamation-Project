- type: entity
  parent: N14ClothingOuterPoliceVestCargo
  id: TriggermenArmoredVest
  name: Triggermen armored vest
  description: A surplus ballistic vest worn by the Triggermen beneath their old-world finery.
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.60
        Slash: 0.60
        Piercing: 0.60
        Heat: 0.80

- type: entity
  parent: ClothingNeckBase
  id: TriggermenDonMantle
  name: Don's mantle
  description: A weighty black mantle with pale fur trim and a discreet gold clasp. Worn by the Don, it carries the quiet authority of someone whose requests are rarely refused.
  components:
  - type: Sprite
    sprite: _ReclamationProject/Clothing/Neck/triggermen_don.rsi
  - type: Clothing
    sprite: _ReclamationProject/Clothing/Neck/triggermen_don.rsi

- type: entity
  parent: ClothingNeckBase
  id: TriggermenOvercoat
  name: Triggermen overcoat
  description: A weathered black overcoat with pale lapels and white accents, draped over the shoulders in the old-world style. Respectable enough for a business meeting, imposing enough for a protection racket.
  components:
  - type: Sprite
    sprite: _ReclamationProject/Clothing/Neck/triggermen_overcoat.rsi
  - type: Clothing
    sprite: _ReclamationProject/Clothing/Neck/triggermen_overcoat.rsi

# Retain the original prototype ID for existing maps; use black fedora visuals with the same steel-brim mechanics.
- type: entity
  parent: ClothingHeadHatFedoraBlack
  id: TriggermenRazorFlatcap
  name: razor-brim black fedora
  description: A black fedora reinforced with sharpened metal around its brim. A vicious throw sends the steel edge slicing through anyone in its path.
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
  - type: DamageExaminable
  - type: MeleeWeapon
    wideAnimationRotation: 90
    attackRate: 0.5
    damage:
      types:
        Slash: 2
        Piercing: 3
  - type: DamageOtherOnHit
    ignoreResistances: true
    staminaCost: 5
    maxHitQuantity: 100
    damage:
      types:
        Slash: 10
        Piercing: 15
  # Preserve thrown momentum while disabling attachment to targets.
  - type: EmbeddableProjectile
    embedOnThrow: false
  - type: LandAtCursor

- type: entity
  parent: N14MeleeHandsBrassKnuckle
  id: TriggermenBrassKnuckles
  components:
  - type: Item
    shape:
    - 0,0,0,1

- type: entity
  parent: Magazine45SubMachineGun
  id: TriggermenMagazine45Drum
  name: .45 Auto SMG drum magazine
  description: A refillable drum that holds 50 rounds of .45 Auto.
  components:
  - type: BallisticAmmoProvider
    capacity: 50
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/22lr/smgmag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]

- type: entity
  parent: N14WeaponSMG45
  id: TriggermenSMG45
  suffix: Triggermen
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: TriggermenMagazine45Drum
        insertSound: /Audio/_Nuclear14/Weapons/Effects/Reload/SMGs/smg_magin.ogg
        ejectSound: /Audio/_Nuclear14/Weapons/Effects/Reload/SMGs/smg_magout.ogg
        whitelist:
          tags: [Magazine45SubMachineGun]
      gun_chamber:
        name: Chamber
        startingItem: N14CartridgePistol45
        priority: 1
        whitelist:
          tags: [N14CartridgePistol45]

- type: entity
  parent: N14BaseBallBat
  id: TriggermenWireBat
  name: barbed-wire baseball bat
  description: A wooden bat with loops of barbed wire wound around the barrel.
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/triggermen_wire_bat.rsi
  - type: Item
    sprite: _ReclamationProject/Objects/Weapons/triggermen_wire_bat.rsi
  - type: Clothing
    sprite: _ReclamationProject/Objects/Weapons/triggermen_wire_bat.rsi
    slots: [back, suitStorage]
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 20
        Slash: 10
        Piercing: 5

- type: entity
  parent: N14WeaponPistol45Colt
  id: TriggermenHeavyColt
  name: Triggermen heavy Colt
  description: A syndicate Colt rechambered for 12.7mm pistol ammunition.
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: N14MagazinePistol12mm
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags: [N14MagazinePistol12mm]
      gun_chamber:
        name: Chamber
        startingItem: N14CartridgePistol127
        priority: 1
        whitelist:
          tags: [N14CartridgePistol127]
