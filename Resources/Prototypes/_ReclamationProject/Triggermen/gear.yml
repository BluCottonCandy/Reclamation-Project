- type: entity
  parent: N14ClothingOuterPoliceVestCargo
  id: TriggermenArmoredVest
  name: Triggermen armored vest
  description: A surplus ballistic vest worn by the Triggermen beneath their old-world finery.
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.70
        Slash: 0.70
        Piercing: 0.65
        Heat: 0.80

- type: entity
  parent: ClothingNeckBase
  id: TriggermenDonMantle
  name: Don's mantle
  description: A weighty black mantle with pale fur trim and a discreet gold clasp. Worn by the Don, it carries the quiet authority of someone whose requests are rarely refused.
  components:
  - type: Sprite
    sprite: _ReclamationProject/Clothing/Neck/triggermen_don.rsi
  - type: Clothing
    sprite: _ReclamationProject/Clothing/Neck/triggermen_don.rsi

- type: entity
  parent: ClothingNeckBase
  id: TriggermenOvercoat
  name: Triggermen overcoat
  description: A weathered black overcoat with pale lapels and white accents, draped over the shoulders in the old-world style. Respectable enough for a business meeting, imposing enough for a protection racket.
  components:
  - type: Sprite
    sprite: _ReclamationProject/Clothing/Neck/triggermen_overcoat.rsi
  - type: Clothing
    sprite: _ReclamationProject/Clothing/Neck/triggermen_overcoat.rsi

# Uses ordinary flatcap clothing, with throw embedding disabled and no glass construction.
- type: entity
  parent: ClothingHeadHatGreyFlatcap
  id: TriggermenRazorFlatcap
  name: razor-brim flatcap
  description: A smart flatcap reinforced with sharpened metal around its brim. A vicious throw sends the steel edge slicing through anyone in its path.
  components:
  - type: DamageExaminable
  - type: MeleeWeapon
    wideAnimationRotation: 90
    attackRate: 0.5
    damage:
      types:
        Slash: 2
        Piercing: 3
  - type: DamageOtherOnHit
    ignoreResistances: true
    staminaCost: 5
    maxHitQuantity: 100
    damage:
      types:
        Slash: 10
        Piercing: 15
  # Preserve thrown momentum while disabling attachment to targets.
  - type: EmbeddableProjectile
    embedOnThrow: false
  - type: LandAtCursor

- type: entity
  parent: N14MeleeHandsBrassKnuckle
  id: TriggermenBrassKnuckles
  components:
  - type: Item
    shape:
    - 0,0,0,1
