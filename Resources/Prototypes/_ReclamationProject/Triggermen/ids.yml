# Marked playing cards share native throwing-knife combat behavior and ID access.
- type: entity
  parent: N14IDCard
  id: TriggermenCardIDBase
  abstract: true
  components:
  - type: DamageExaminable
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 0.5
    range: 1.5
    damage:
      types:
        Slash: 2
        Piercing: 3
    heavyRateModifier: 1.25
    heavyDamageBaseModifier: 1.2
    maxTargets: 3
    angle: 40
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: DamageOtherOnHit
    ignoreResistances: true
    staminaCost: 5
    damage:
      types:
        Slash: 10
        Piercing: 15
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: EmbedPassiveDamage
  - type: LandAtCursor

- type: entity
  parent: TriggermenCardIDBase
  id: TriggermenBossID
  name: ace of spades
  description: A worn playing card bearing a discreet Triggermen mark. It identifies a Don and grants their access. Its sharpened edge makes it as dangerous to throw as a throwing knife.
  categories: []
  components:
  - type: Sprite
    sprite: EstacaoPirata/Objects/Misc/cards.rsi
    layers:
    - state: sc_Ace_of_Spades_black
  - type: Clothing
    sprite: EstacaoPirata/Objects/Misc/cards.rsi
  - type: IdCard
    nameLocId: triggermen-id-ace-name
    fullNameLocId: triggermen-id-ace-full-name
  - type: PresetIdCard
    job: TriggermenBoss

