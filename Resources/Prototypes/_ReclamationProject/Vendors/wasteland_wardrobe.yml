# Wastelander clothing loadout catalog. Clothing costs 20 caps; outerwear exceeding 20% protection costs 50 caps.
- type: entity
  parent: Trademachine
  id: ReclamationWastelanderClothingVendor
  name: wasteland wardrobe
  description: A weathered clothing dispenser. Clothing costs 20 caps, or 50 caps for outerwear with stronger protection.
  suffix: Clothing, 20 or 50 caps
  components:
  - type: Sprite
    sprite: _ReclamationProject/Structures/Machines/wasteland_wardrobe.rsi
    layers:
    - state: base
  - type: PointLight
    enabled: false
  - type: NcStore
    currencyWhitelist: [Caps]
    buyPresets: [ReclamationWastelanderClothing]

- type: storePresetStructured
  id: ReclamationWastelanderClothing
  currency: Caps
  categories:
  - ReclamationWardrobeHead
  - ReclamationWardrobeHands
  - ReclamationWardrobeShoes
  - ReclamationWardrobeMask
  - ReclamationWardrobeNeck
  - ReclamationWardrobeEyes
